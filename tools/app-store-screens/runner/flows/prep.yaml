# Fresh guest session: wipe app data, deny permission prompts, clear the first-run pop-ups.
appId: ${APP}
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: popups.yaml
- extendedWaitUntil:
    visible:
      id: navHome
    timeout: 60000
- runFlow: popups.yaml
