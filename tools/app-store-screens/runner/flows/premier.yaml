# The Premier tile is an image on the home page: scroll down SWIPES times, tap it.
appId: ${APP}
---
- tapOn:
    id: navHome
- tapOn:
    id: navHome
- repeat:
    times: ${SWIPES}
    commands:
      - swipe:
          start: "50%,80%"
          end: "50%,15%"
      - waitForAnimationToEnd
- tapOn:
    point: ${TAP}
- waitForAnimationToEnd:
    timeout: 10000
