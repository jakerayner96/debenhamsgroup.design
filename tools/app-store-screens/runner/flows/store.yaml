# Switch country: Account > Settings (gear) > Change Country/Region > the country > confirm
appId: ${APP}
---
- tapOn:
    id: navAccount
- tapOn:
    id: settingsButton
- tapOn:
    text: "(?i).*(country|region|pays|land|regio).*"
    index: 0
- tapOn: ${STORE}
- tapOn:
    text: "(?i)(change country/region|changer|ändern|wijzigen|ändra).*"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 2
    commands:
      - tapOn:
          text: "(?i)(ask app not to track|do not track|maybe later|not now|don.t allow|ok|confirm|yes)"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: navHome
    optional: true
