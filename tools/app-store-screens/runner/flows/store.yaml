# Switch storefront: Account > App Settings > Change Country/Region (button is disabled if already on that store)
appId: ${APP}
---
- tapOn:
    id: navAccount
- tapOn:
    id: settingsButton
- tapOn: "(?i)change country/region.*"
- tapOn: ${STORE}
- tapOn:
    text: "CHANGE COUNTRY/REGION"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 2
    commands:
      - tapOn:
          text: "(?i)(ask app not to track|do not track|maybe later|not now|don.t allow|ok|confirm|yes)"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: navHome
    optional: true
