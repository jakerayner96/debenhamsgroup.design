# Back out of pages opened by a link (they sit above the tab bar) until the tab bar is there again
appId: ${APP}
---
# late pop-ups (tracking prompt, notifications, Android "isn't responding") — clear before every screen
- tapOn:
    text: "(?i)(do not track|ask app not to track|don.t allow|maybe later|not now|peut-être plus tard|pas maintenant|später|nicht jetzt|misschien later|niet nu|kanske senare|inte nu|wait)"
    optional: true
- repeat:
    while:
      notVisible:
        id: navHome
    times: 6
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: "(Back|Retour|Zurück|Terug|Tillbaka|Atrás)"
                index: 0
                optional: true
            - runFlow:
                when:
                  notVisible:
                    id: navHome
                commands:
                  - swipe:
                      start: "1%,50%"
                      end: "85%,50%"
                      duration: 400
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: navHome
