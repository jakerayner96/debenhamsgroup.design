# On a category page: open the product in position N (plpItem-0 is the first)
appId: ${APP}
---
- extendedWaitUntil:
    visible:
      id: plpItem-0
    timeout: 20000
- scrollUntilVisible:
    element:
      id: plpItem-${N}
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    id: plpItem-${N}
- extendedWaitUntil:
    visible:
      id: productImageCarousel
    timeout: 20000
- waitForAnimationToEnd
