# Product page by name (when no SKU): search it and open the first result
appId: ${APP}
---
- runFlow: search.yaml
- hideKeyboard:
    optional: true
- tapOn:
    id: plpItem-0
- extendedWaitUntil:
    visible:
      id: productImageCarousel
    timeout: 8000
    optional: true
- runFlow:                       # the first tap can just dismiss the keyboard / settle the list — tap again
    when:
      notVisible:
        id: productImageCarousel
    commands:
      - tapOn:
          id: plpItem-0
      - extendedWaitUntil:
          visible:
            id: productImageCarousel
          timeout: 15000
- waitForAnimationToEnd
