<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet our customers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&family=Geologica:ital,wght@0,200;0,300;0,400;0,500;0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/ds/tokens.css">
<!-- Meet our customers deck (11 Nov 2026). Format = the AI Generated Badge deck (jakerayner96.github.io/ai-generated-badge): fixed 1920×1080
     stage, Antonio caps + Geologica, grid texture, glow, ghost numerals, rise reveals. From the Brand Room deck: the HUD site switch and G overview.
     Every word on a slide comes from assets/ds/personas-data.js = the "Meet our customers" PDF, word for word. Slides are built from that data,
     so the deck, the DS cards and the persona tests never drift apart. Keys: ← → / space / click · G overview · 1–5 jump to a site · #n deep link. -->
<style>
:root{--stage-bg:#050505;--slide-bg:#050505;--text:#fff;--mute:#9a9a92;--ease:cubic-bezier(0.16,1,0.3,1);--acc:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg)}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;visibility:hidden;opacity:0;pointer-events:none;color:var(--text);font-family:'Geologica',sans-serif;
  background:var(--slide-bg);background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:96px 96px;background-position:center}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
img{max-width:100%;max-height:100%}
/* per-site accent from the DS fascia mode; PLT garnet and boohooMAN ink are too dark on black, so they take their light tone */
[data-brand]{--acc:var(--brand-primary)}
[data-brand="plt"]{--acc:var(--brand-light-1)}
[data-brand="boohooman"]{--acc:#01FE8A}
.glow{position:absolute;width:1200px;height:1200px;border-radius:50%;filter:blur(120px);opacity:.55;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 14%,transparent) 0%,transparent 60%)}
.g1{right:-400px;top:-400px}.g2{left:-500px;bottom:-500px}.g3{right:-300px;bottom:-500px}
.ghost{position:absolute;right:40px;bottom:-90px;font:700 560px/1 'Antonio';color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.06);letter-spacing:-.03em;pointer-events:none;user-select:none;white-space:nowrap}
.header{position:absolute;left:100px;top:96px;z-index:3;right:100px}
.eyebrow{font:200 15px/1.5 'Geologica';letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
.rule{height:1px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:24px;width:100%;transform:scaleX(0);transform-origin:left}
.slide.visible .rule{animation:draw 1s var(--ease) .35s forwards}
@keyframes draw{to{transform:scaleX(1)}}
.reveal{opacity:0;transform:translateY(34px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(.15s + var(--n,0)*.08s)}
.slide.visible .reveal{opacity:1;transform:none}
.rise{display:block;overflow:hidden}.rise>span{display:inline-block;opacity:0;transform:translateY(70px)}
.slide.visible .rise>span{animation:rise .9s var(--ease) forwards;animation-delay:calc(.12s + var(--n,0)*.14s)}
@keyframes rise{to{opacity:1;transform:none}}
.av{display:block;border-radius:50%;overflow:hidden;background:var(--persona-hd);flex:none}
.av img{display:block;width:100%;height:100%;object-fit:cover;max-width:none;max-height:none}

/* 01 cover */
.cover .kicker{position:absolute;left:100px;top:266px;font:200 20px/1.5 'Geologica';letter-spacing:.1em;text-transform:uppercase;color:var(--mute);z-index:3}
.cover h1{position:absolute;left:94px;top:320px;font:700 200px/1.02 'Antonio';letter-spacing:-.02em;text-transform:uppercase;z-index:3}
.cover .foot{position:absolute;left:100px;top:930px;font:200 15px/1.5 'Geologica';color:var(--mute);z-index:3}
.wall{position:absolute;right:-60px;top:-140px;width:1060px;height:1360px;display:flex;gap:22px;transform:rotate(-8deg);z-index:1}
.wcol{display:flex;flex-direction:column;gap:22px;animation:drift 38s linear infinite}
.wcol:nth-child(even){animation-direction:reverse;animation-duration:46s}
.wcol .av{width:190px;height:190px;opacity:.95;transition:transform .4s var(--ease)}
.wcol .av:hover{transform:scale(1.08)}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.cover-shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,#050505 0%,#050505 34%,rgba(5,5,5,.82) 46%,rgba(5,5,5,0) 70%),linear-gradient(180deg,#050505 0%,rgba(5,5,5,0) 18%,rgba(5,5,5,0) 82%,#050505 100%)}

/* 02 intro */
.intro .lead{position:absolute;left:100px;top:250px;width:820px;font:300 40px/1.35 'Geologica';letter-spacing:-.015em}
.lead p{margin-bottom:22px}.lead ul{list-style:none;font-size:30px;line-height:1.4}.lead li{position:relative;padding-left:34px;margin-bottom:16px}.lead li::before{content:"";position:absolute;left:0;top:.62em;width:18px;height:2px;background:#fff}
.facts{position:absolute;left:1060px;top:270px;width:760px;display:grid;grid-template-columns:1fr 1fr;gap:56px 60px}
.fact{padding-left:28px;border-left:1px solid rgba(255,255,255,.3)}
.fact-v{font:700 132px/1 'Antonio';font-variant-numeric:tabular-nums}
.fact-v.sm{font-size:88px;line-height:1.5;white-space:nowrap}
.fact-l{font:300 18px/1.5 'Geologica';letter-spacing:.24em;text-transform:uppercase;color:#fff;margin-top:10px}
.legend{position:absolute;left:100px;bottom:150px;display:flex;gap:44px;list-style:none;font:300 22px/1 'Geologica'}
.legend li{display:flex;align-items:center;gap:14px}
.k{width:14px;height:14px;border-radius:50%;background:var(--season-everyday);flex:none}
.k[data-k="christmas"]{background:var(--season-christmas)}.k[data-k="sale"]{background:var(--season-sale)}.k[data-k="bf"]{background:#050505;box-shadow:0 0 0 1.5px #fff}
.sites{position:absolute;left:100px;top:760px;width:880px;display:grid;grid-template-columns:repeat(5,1fr);gap:40px;align-items:center}
.sites a{display:block;height:40px;opacity:.85;transition:opacity .3s;cursor:pointer}.sites a:hover{opacity:1}
.sites img{height:100%;width:100%;object-fit:contain;object-position:left center;filter:invert(1)}

/* site divider */
.div .logo{position:absolute;left:100px;top:250px;height:110px;z-index:3}
.div .logo img{height:100%;width:auto;filter:invert(1)}
.div .full{position:absolute;left:100px;top:400px;font:300 22px/1.4 'Geologica';color:var(--acc);text-decoration:underline;text-underline-offset:6px;z-index:3}
.bars{position:absolute;left:100px;top:500px;width:1720px;display:grid;grid-template-columns:repeat(8,1fr);gap:22px;align-items:end;height:470px;z-index:3}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;text-decoration:none;color:#fff;cursor:pointer}
.bar .col{width:100%;border-radius:10px 10px 0 0;background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 25%,transparent));height:0;transition:height 1.2s var(--ease);transition-delay:calc(.3s + var(--n)*.07s);position:relative}
.bar[data-kind="typical"] .col{background:repeating-linear-gradient(135deg,var(--acc) 0 14px,color-mix(in srgb,var(--acc) 55%,transparent) 14px 28px)}
.bar[data-kind="catchall"] .col{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.03))}
.slide.visible .bar .col{height:var(--h)}
.bar .v{font:700 44px/1 'Antonio';margin-bottom:14px;text-transform:uppercase;text-align:center;white-space:nowrap}
.bar .v.t{font-size:30px}
.bar .av{width:120px;height:120px;margin-top:-60px;position:relative;box-shadow:0 0 0 5px #050505;transition:transform .35s var(--ease)}
.bar:hover .av{transform:translateY(-8px) scale(1.05)}
.bar .n{font:500 20px/1.2 'Geologica';margin-top:16px;text-align:center}
.bar .r{font:300 16px/1.3 'Geologica';color:#fff;text-align:center;margin-top:4px}
.stack{display:flex;flex-direction:column;align-items:center;width:100%}

/* persona */
.p .pv{position:absolute;left:100px;top:250px;width:400px;height:400px;z-index:2}
.p .pv .av{width:400px;height:400px;box-shadow:0 0 0 6px #050505,0 0 0 8px var(--acc);opacity:0;transform:scale(.86);transition:opacity .9s var(--ease) .15s,transform 1.1s var(--ease) .15s}
.slide.visible .pv .av{opacity:1;transform:none}
.p .tag{position:absolute;left:100px;top:206px;font:500 15px/1 'Geologica';letter-spacing:.2em;padding:9px 16px;border-radius:99px;background:var(--acc);color:#050505;z-index:3}
.p .tag.ca{background:#5D6271;color:#fff}
.p .who{position:absolute;left:100px;top:700px;width:560px;z-index:2}
.p .who h2{font:700 116px/.98 'Antonio';text-transform:uppercase;letter-spacing:-.01em}
.cm{font:700 0.9em/1 'Geologica';font-style:normal;margin-right:.08em}
.p .who .role{font:300 30px/1.3 'Geologica';color:#fff;margin-top:14px}
.p .mid{position:absolute;left:720px;top:250px;width:500px;z-index:2}
.p .head{font:700 112px/1 'Antonio';text-transform:uppercase;letter-spacing:-.01em;color:var(--acc)}
.p .head.t{font-size:70px;line-height:1.02}
.p .hsub{font:300 19px/1.45 'Geologica';color:#fff;margin-top:12px}
.p .meter{height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:22px;overflow:hidden}
.p .meter i{display:block;height:100%;width:0;background:var(--acc);border-radius:inherit;transition:width 1.3s var(--ease) .5s}
.slide.visible .meter i{width:var(--w)}
.p .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.p .chips span{font:300 18px/1.3 'Geologica';padding:9px 16px;border:1px solid rgba(255,255,255,.28);border-radius:99px}
.p .desc{font:300 24px/1.5 'Geologica';letter-spacing:-.01em;margin-top:32px;color:#e9e9e4}
.p .scen{position:absolute;left:1300px;top:250px;width:520px;z-index:2}
.p .scen .eyebrow{margin-bottom:12px}
.srow{display:grid;grid-template-columns:14px 1fr auto;gap:16px;align-items:baseline;padding:13px 0;border-top:1px solid rgba(255,255,255,.12);transition:opacity .3s}
.srow:first-of-type{border-top:0}
.srow .k{transform:translateY(-2px)}
.srow b{font:300 22px/1.3 'Geologica'}
.srow em{font:700 26px/1 'Antonio';font-style:normal;color:#fff;white-space:nowrap}
.scen[data-season] .srow{opacity:.2}.scen[data-season="everyday"] .srow[data-k="everyday"],.scen[data-season="christmas"] .srow[data-k="christmas"],.scen[data-season="sale"] .srow[data-k="sale"],.scen[data-season="bf"] .srow[data-k="bf"]{opacity:1}
.p .end{position:absolute;left:1300px;bottom:100px;width:520px;z-index:2;border-top:1px solid rgba(255,255,255,.25);padding-top:22px}
.find{font:300 22px/1.4 'Geologica';margin-bottom:14px}
.sev{display:inline-block;font:500 14px/1 'Geologica';letter-spacing:.12em;padding:7px 10px;border-radius:4px;background:var(--sev-high);color:#fff;margin-right:12px;vertical-align:3px}
.sev[data-sev="critical"]{background:var(--sev-critical)}
.status{font:300 20px/1.4 'Geologica';color:#fff}
a.status{color:#fff;text-decoration:underline;text-underline-offset:5px;font-weight:500}
.mini{position:absolute;right:100px;top:62px;display:flex;gap:8px;z-index:3}
.mini a{display:block;transition:transform .3s var(--ease);opacity:.5}.mini a:hover,.mini a.on{opacity:1;transform:translateY(-4px)}
.mini .av{width:44px;height:44px}
.mini a.on .av{box-shadow:0 0 0 3px #050505,0 0 0 5px var(--acc)}
.slegend{position:absolute;left:1300px;top:206px;display:flex;gap:20px;list-style:none;z-index:3}
.slegend button{appearance:none;background:none;border:0;color:var(--mute);font:300 15px/1 'Geologica';display:flex;align-items:center;gap:8px;cursor:pointer}
.slegend button:hover,.slegend button.on{color:#fff}
.slegend .k{width:10px;height:10px}

/* close */
.close .grid{position:absolute;left:100px;top:300px;display:grid;grid-template-columns:220px repeat(8,1fr);gap:18px 18px;width:1720px;align-items:center}
.close .site{font:700 34px/1 'Antonio';text-transform:uppercase;color:var(--acc)}
.close .grid a{display:block;transition:transform .3s var(--ease)}.close .grid a:hover{transform:scale(1.08)}
.close .grid .av{width:100px;height:100px}
.close .note{position:absolute;left:100px;bottom:96px;width:1400px;font:300 18px/1.6 'Geologica';color:var(--mute)}
.close h2{position:absolute;left:100px;top:172px;font:700 74px/1 'Antonio';text-transform:uppercase}

/* chrome */
.progress{position:fixed;left:0;top:0;height:2px;background:#fff;z-index:1001;transition:width .5s var(--ease);box-shadow:0 0 12px rgba(255,255,255,.6)}
.hud{position:fixed;right:28px;bottom:16px;display:flex;align-items:center;gap:18px;z-index:1001;font-family:'Geologica'}
.counter{font:500 13px/1 'Geologica';letter-spacing:.3em;color:var(--mute)}.counter b{color:#fff;font-weight:500}
.nav-btn{width:34px;height:34px;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:transparent;color:#fff;font:200 16px/1 'Geologica';cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s}
.nav-btn:hover{background:rgba(255,255,255,.12);border-color:#fff}
.sitesw{position:fixed;left:28px;bottom:16px;display:flex;gap:4px;z-index:1001}
.sitesw button{appearance:none;background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--mute);font:500 11px/1 'Geologica';letter-spacing:.16em;text-transform:uppercase;padding:9px 12px;cursor:pointer;border-radius:99px;transition:all .25s}
.sitesw button:hover{color:#fff;border-color:#fff}.sitesw button.on{background:#fff;color:#050505;border-color:#fff}
.ov{position:fixed;inset:0;z-index:2000;background:rgba(5,5,5,.96);display:none;overflow:auto;padding:48px 48px 80px;font-family:'Geologica';color:#fff}
.ov.on{display:block}
.ov h3{font:200 14px/1.5 'Geologica';letter-spacing:.28em;text-transform:uppercase;color:var(--mute);margin:28px 0 12px}
.ov .row{display:flex;flex-wrap:wrap;gap:10px}
.ov button{appearance:none;background:#111;border:1px solid #222;color:#fff;border-radius:10px;padding:10px 14px 10px 10px;display:flex;align-items:center;gap:10px;font:300 14px/1.2 'Geologica';cursor:pointer;text-align:left}
.ov button:hover{border-color:#fff}.ov button .av{width:36px;height:36px}.ov button small{display:block;color:var(--mute);font-size:12px}
.ov .x{position:fixed;top:20px;right:28px}
@media print{html,body{width:1920px;height:auto;overflow:visible;background:#050505}.deck-viewport{position:static;overflow:visible}.deck-stage{position:static;width:auto;height:auto;transform:none!important}
  .slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;width:1920px;height:1080px;break-after:page;page-break-after:always}
  .slide .reveal,.slide .rise>span{opacity:1!important;transform:none!important;animation:none!important}.meter i{width:var(--w)!important}.bar .col{height:var(--h)!important}.pv .av{opacity:1!important;transform:none!important}
  .hud,.sitesw,.progress,.ov{display:none!important}.wcol{animation:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}.wcol{animation:none}}
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage" id="stage"></div></div>
<div class="progress" id="prog"></div>
<div class="sitesw" id="sitesw"></div>
<div class="hud"><button class="nav-btn" id="ovb" title="Overview (G)" aria-label="Overview">▦</button><button class="nav-btn" id="prev" aria-label="Previous">‹</button><span class="counter" id="ctr"></span><button class="nav-btn" id="next" aria-label="Next">›</button></div>
<div class="ov" id="ov"><button class="nav-btn x" id="ovx" aria-label="Close">✕</button><div id="ovb2"></div></div>
<script src="../../assets/ds/personas-data.js"></script>
<script>
const D=window.DG_PERSONAS,M=D.meta,B=D.brands,BASE='../../';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const av=(p,cls='')=>`<span class="av ${cls}" data-brand="${p.img.split('/').pop().split('-')[0]}"><img src="${BASE}${esc(p.img)}" alt="" loading="eager"></span>`;
const up=s=>esc(s).toUpperCase();
const rise=(t,n=0)=>`<span class="rise" style="--n:${n}"><span>${esc(t)}</span></span>`;
const fill=p=>p.kind==='typical'?100:p.kind==='catchall'?0:Math.min(100,Math.round(p.share/11*100));
const S=[];const idx={};
/* 01 cover: the 40 portraits drifting behind the title */
const all=B.flatMap(b=>b.personas);
const cols=[0,1,2,3,4].map(c=>all.filter((_,i)=>i%5===c));
S.push({cls:'cover',html:`<div class="wall">${cols.map(c=>`<div class="wcol">${c.concat(c).map(p=>av(p)).join('')}</div>`).join('')}</div><div class="cover-shade"></div>
  <div class="kicker reveal">${esc(M.eyebrow)}</div><h1>${rise('MEET OUR',0)}${rise('CUSTOMERS',1)}</h1>
  <div class="foot reveal" style="--n:4">11.11.26 &nbsp;-&nbsp; jake.rayner@debenhamsgroup.com</div>`});
/* 02 intro: the PDF intro, the four figures, the sites, the season key */
S.push({cls:'intro',html:`<div class="glow g1"></div><div class="header"><div class="eyebrow reveal">${esc(M.eyebrow)}</div><div class="rule"></div></div>
  <div class="lead reveal" style="--n:1"><p>${esc(M.intro)}</p><ul>${(M.introList||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="facts">${M.stats.map(([v,l],i)=>`<div class="fact reveal" style="--n:${2+i}"><div class="fact-v${/\D/.test(v)?' sm':''}" data-count="${esc(v)}">${esc(v)}</div><div class="fact-l">${esc(l)}</div></div>`).join('')}</div>
  <div class="sites">${B.map((b,i)=>`<a class="reveal" style="--n:${5+i}" data-go="div-${b.slug}" title="${esc(b.name)}"><img src="${BASE}assets/brands/${b.slug}.svg" alt="${esc(b.name)}"></a>`).join('')}</div>
  <ul class="legend">${M.legend.map(([k,l],i)=>`<li class="reveal" style="--n:${8+i}"><span class="k" data-k="${k}"></span>${esc(l)}</li>`).join('')}</ul>`});
B.forEach(b=>{
  const mx=Math.max(...b.personas.filter(p=>p.kind==='cohort').map(p=>p.share));
  idx['div-'+b.slug]=S.length;
  S.push({cls:'div',brand:b.slug,html:`<div class="glow g1"></div><div class="glow g2"></div><div class="ghost" aria-hidden="true">${up(b.name)}</div>
    <div class="header"><div class="eyebrow reveal">${esc(M.title)}</div><div class="rule"></div></div>
    <div class="logo reveal" style="--n:1"><img src="${BASE}assets/brands/${b.slug}.svg" alt="${esc(b.name)}"></div>
    <a class="full reveal" style="--n:2" href="${esc(b.full.url)}" target="_blank" rel="noopener">${esc(b.full.label)}</a>
    <div class="bars">${b.personas.map((p,i)=>{const h=p.kind==='typical'?100:p.kind==='catchall'?0:Math.round(p.share/mx*86);
      return `<a class="bar" data-go="p-${b.slug}-${p.id}" data-kind="${p.kind}" style="--n:${i}"><div class="stack"><div class="v${/\d/.test(p.head)&&p.head.length<7?'':' t'}">${up(p.head)}</div><div class="col" style="--h:${70+h*2.1}px"></div>${av(p)}<div class="n">${esc(p.label)}</div><div class="r">${esc(p.role)}</div></div></a>`}).join('')}</div>`});
  b.personas.forEach((p,i)=>{idx['p-'+b.slug+'-'+p.id]=S.length;
    S.push({cls:'p',brand:b.slug,html:`<div class="glow g3"></div><div class="ghost" aria-hidden="true">${String(i+1).padStart(2,'0')}</div>
      <div class="header"><div class="eyebrow reveal">${esc(b.name)} &nbsp;·&nbsp; ${esc(M.title)}</div><div class="rule"></div></div>
      ${p.tag?`<div class="tag reveal${p.kind==='catchall'?' ca':''}" style="--n:2">${esc(p.tag)}</div>`:''}
      <div class="pv">${av(p)}</div>
      <div class="who"><h2><span class="rise" style="--n:1"><span>${esc(p.label.toUpperCase()).replace(',','<i class="cm">,</i>')}</span></span></h2><div class="role reveal" style="--n:3">${esc(p.role)}</div></div>
      <div class="mid"><div class="head reveal${/\d/.test(p.head)&&p.head.length<7?'':' t'}" style="--n:2">${up(p.head)}</div><div class="hsub reveal" style="--n:3">${esc(p.headSub)}</div>
        <div class="meter reveal" style="--n:3;--w:${fill(p)}%"><i></i></div>
        <div class="chips">${p.chips.map((c,j)=>`<span class="reveal" style="--n:${4+j*.6}">${esc(c)}</span>`).join('')}</div>
        <p class="desc reveal" style="--n:6">${esc(p.desc)}</p></div>
      <ul class="slegend reveal" style="--n:3">${M.legend.map(([k,l])=>`<li><button data-season="${k}"><span class="k" data-k="${k}"></span>${esc(l)}</button></li>`).join('')}</ul>
      <div class="scen">${p.scen.map((s,j)=>`<div class="srow reveal" data-k="${s.k}" style="--n:${3+j*.5}"><span class="k" data-k="${s.k}"></span><b>${esc(s.t)}</b><em>${esc(s.v)}</em></div>`).join('')}</div>
      <div class="end reveal" style="--n:8">${p.finding?`<div class="find"><span class="sev" data-sev="${p.finding.sev.toLowerCase()}">${esc(p.finding.sev)}</span>${esc(p.finding.text)}</div>`:''}${p.status.url?`<a class="status" href="${esc(p.status.url)}" target="_blank" rel="noopener">${esc(p.status.text)}</a>`:`<div class="status">${esc(p.status.text)}</div>`}</div>
      <div class="mini">${b.personas.map(q=>`<a data-go="p-${b.slug}-${q.id}" class="${q.id===p.id?'on':''}" title="${esc(q.label)}">${av(q)}</a>`).join('')}</div>`})});
});
/* close: all 40, by site, + the PDF footnote */
S.push({cls:'close',html:`<div class="glow g2"></div><div class="header"><div class="eyebrow reveal">${esc(M.eyebrow)}</div><div class="rule"></div></div>
  <h2>${rise(M.title.toUpperCase())}</h2>
  <div class="grid">${B.map((b,bi)=>`<div class="site reveal" data-brand="${b.slug}" style="--n:${bi}">${esc(b.name)}</div>${b.personas.map((p,i)=>`<a class="reveal" data-go="p-${b.slug}-${p.id}" style="--n:${bi+i*.15}" title="${esc(p.label)}">${av(p)}</a>`).join('')}`).join('')}</div>
  <p class="note reveal" style="--n:6">${esc(M.foot)}</p>`});

const stage=document.getElementById('stage');
stage.innerHTML=S.map(s=>`<section class="slide ${s.cls}"${s.brand?` data-brand="${s.brand}"`:''}>${s.html}</section>`).join('');
const slides=[...stage.querySelectorAll('.slide')];let i=0;
const prog=document.getElementById('prog'),ctr=document.getElementById('ctr'),sw=document.getElementById('sitesw');
sw.innerHTML=B.map((b,n)=>`<button data-go="div-${b.slug}" title="${n+1}">${esc(b.name)}</button>`).join('');
const brandAt=n=>slides[n].dataset.brand||'';
function paint(){prog.style.width=((i+1)/slides.length*100)+'%';ctr.innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b> / '+slides.length;
  const br=brandAt(i);sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.go==='div-'+br));
  prog.style.background=br?getComputedStyle(slides[i]).getPropertyValue('--acc'):'#fff';
  if(history.replaceState)history.replaceState(null,'','#'+(i+1))}
function count(s){s.querySelectorAll('[data-count]').forEach(el=>{const m=el.dataset.count.match(/^(\d+)(.*)$/);if(!m)return;const to=+m[1],t0=performance.now();
  const f=t=>{const k=Math.min(1,(t-t0)/1100);el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+m[2];if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function show(n){slides[i].classList.remove('active','visible');i=(n+slides.length)%slides.length;slides[i].classList.add('active');paint();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{slides[i].classList.add('visible');count(slides[i])}))}
const go=k=>{if(k in idx)show(idx[k])};
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-season]');if(s){e.stopPropagation();const box=s.closest('.slide').querySelector('.scen'),on=box.dataset.season===s.dataset.season;
    if(on)delete box.dataset.season;else box.dataset.season=s.dataset.season;s.closest('.slegend').querySelectorAll('button').forEach(b=>b.classList.toggle('on',!on&&b===s));return}
  const g=e.target.closest('[data-go]');if(g){e.stopPropagation();e.preventDefault();ov.classList.remove('on');go(g.dataset.go);return}
  if(e.target.closest('a,button,.ov'))return;show(i+1)});
document.getElementById('prev').onclick=e=>{e.stopPropagation();show(i-1)};
document.getElementById('next').onclick=e=>{e.stopPropagation();show(i+1)};
/* overview (G): every slide by site */
const ov=document.getElementById('ov');
document.getElementById('ovb2').innerHTML=`<h3>${esc(M.title)}</h3><div class="row"><button data-n="0">01 · ${esc(M.title)}</button><button data-n="1">02 · ${esc(M.eyebrow)}</button></div>`+
  B.map(b=>`<h3>${esc(b.name)}</h3><div class="row"><button data-go="div-${b.slug}">${esc(b.full.label)}</button>${b.personas.map(p=>`<button data-go="p-${b.slug}-${p.id}">${av(p)}<span>${esc(p.label)}<small>${esc(p.head)}</small></span></button>`).join('')}</div>`).join('')+
  `<div class="row" style="margin-top:28px"><button data-n="${slides.length-1}">${slides.length} · ${esc(M.title)}</button></div>`;
ov.querySelectorAll('[data-n]').forEach(b=>b.onclick=e=>{e.stopPropagation();ov.classList.remove('on');show(+b.dataset.n)});
document.getElementById('ovb').onclick=e=>{e.stopPropagation();ov.classList.toggle('on')};
document.getElementById('ovx').onclick=e=>{e.stopPropagation();ov.classList.remove('on')};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();show(i+1)}if(e.key==='ArrowLeft'||e.key==='PageUp')show(i-1);
  if(e.key==='g'||e.key==='G')ov.classList.toggle('on');if(e.key==='Escape')ov.classList.remove('on');if(/^[1-5]$/.test(e.key))go('div-'+B[+e.key-1].slug);
  if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n>=1&&n<=slides.length&&n-1!==i)show(n-1)});
const h=parseInt(location.hash.slice(1),10);slides[0].classList.add('active');
if(h>=2&&h<=slides.length)show(h-1);else{paint();requestAnimationFrame(()=>requestAnimationFrame(()=>slides[0].classList.add('visible')))}
</script>
</body>
</html>
