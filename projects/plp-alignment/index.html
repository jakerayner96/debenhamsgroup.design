<!DOCTYPE html>
<html lang="en" data-brand="plt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P-05 · PLP Alignment — working skeleton</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;600&family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;700&family=Jost:wght@400;600&display=swap" rel="stylesheet">
<!-- DS — canonical, linked not copied -->
<link rel="stylesheet" href="../../assets/ds/tokens.css">
<link rel="stylesheet" href="../../assets/ds/components.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-family-base);font-weight:var(--w-regular);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}

/* project chrome (not DS) — the switch strip for review */
.strip{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:6px;padding:9px 16px;background:#000;color:#B0B0B0;font-family:'Montserrat',sans-serif;font-size:11.5px}
.strip b{color:#F7F7F7;font-weight:600;margin-right:8px}
.strip button{padding:5px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.2);font-size:11.5px}
.strip button.on{background:#F7F7F7;color:#000;border-color:#F7F7F7;font-weight:600}
.strip .cfg{margin-left:auto;font-size:10.5px;color:#707070}

/* PLP — everything below consumes DS tokens only */
.plp{max-width:1440px;margin:0 auto;padding:0 var(--space-24) var(--space-64)}
.crumb{padding:var(--space-16) 0 var(--space-8);font-size:12px;color:var(--text-secondary)}
h1{font-size:24px;font-weight:var(--w-strong);text-transform:var(--cta-case);letter-spacing:.01em;margin:0 0 var(--space-4)}
.count{font-size:13px;color:var(--text-secondary);margin-bottom:var(--space-16)}
.filters{display:flex;gap:var(--space-8);padding:var(--space-12) 0;border-top:var(--border-w) solid var(--border-subtle);border-bottom:var(--border-w) solid var(--border-subtle);margin-bottom:var(--space-24);overflow-x:auto}
.chip{flex:none;padding:8px 14px;border:var(--border-w) solid var(--border-default);border-radius:var(--radius-pill);font-size:13px;background:var(--surface-page);transition:border-color var(--dur-fast) var(--ease-standard)}
.chip:hover{border-color:var(--border-strong)}
.chip:focus-visible{outline:var(--border-w-focus) solid var(--border-focus);outline-offset:2px}

.grid{display:grid;gap:var(--space-24) var(--space-16)}
.card{position:relative}
.card .img{aspect-ratio:3/4;border-radius:var(--radius-default);background:linear-gradient(165deg,var(--brand-light-3),var(--brand-light-1));position:relative;overflow:hidden}
.grid.pad .card .img{margin:0}
.card .fav{position:absolute;top:var(--space-8);right:var(--space-8);width:36px;height:36px;min-width:36px;border-radius:var(--radius-pill);background:var(--surface-page);display:grid;place-items:center;color:var(--icon-action);font-size:15px;box-shadow:0 4px 10px rgba(22,19,20,.12)}
.card .fav:focus-visible{outline:var(--border-w-focus) solid var(--border-focus);outline-offset:2px}
.card .badge{position:absolute;left:var(--space-8);bottom:var(--space-8);background:var(--surface-accent);color:var(--text-primary);font-size:11px;font-weight:var(--w-strong);text-transform:var(--cta-case);padding:3px 8px;border-radius:var(--radius-default)}
.card .brand{font-size:11px;font-weight:var(--w-strong);letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary);margin-top:var(--space-8)}
.card .name{font-size:13px;font-weight:var(--w-regular);margin-top:2px}
.card .brand+.name{margin-top:2px}
.card .name:first-child{margin-top:var(--space-8)}
.card .price{font-size:14px;font-weight:var(--w-strong);margin-top:3px}
.card .price s{color:var(--text-secondary);font-weight:var(--w-regular);margin-left:var(--space-4)}
.more{display:flex;justify-content:center;margin-top:var(--space-40)}

@media(max-width:920px){.grid{grid-template-columns:repeat(2,1fr)!important;gap:var(--space-16) var(--space-8)}.plp{padding:0 var(--space-16) var(--space-48)}}
</style>
</head>
<body>

<!-- review strip — project chrome, not part of the PLP -->
<div class="strip" id="strip">
  <b>P-05 · PLP</b>
  <button data-b="plt" class="on">PLT</button>
  <button data-b="boohoo">boohoo</button>
  <button data-b="boohooman">boohooMAN</button>
  <button data-b="warehouse">Warehouse</button>
  <button data-b="brandroom">Brand Room</button>
  <span class="cfg" id="cfg"></span>
</div>

<main class="plp">
  <div class="crumb">Home / Women / Dresses</div>
  <h1>Dresses</h1>
  <div class="count">1,284 styles</div>
  <div class="filters">
    <button class="chip">Filter &amp; sort</button>
    <button class="chip">Size</button>
    <button class="chip">Colour</button>
    <button class="chip">Price</button>
    <button class="chip">Length</button>
    <button class="chip">New in</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="more"><button class="bd pri">Load more</button></div>
</main>

<script>
/* Per-fascia config — DRAFT values, reconcile against .context/08-plp-alignment.md
   + live capture. This object IS the deliverable shape: differences as config, not forks. */
const PLP_CONFIG={
  plt:       {showBrand:false,imageFullWidth:true, favouriteIcon:'default',columnsDesktop:4,fontScale:'plt'},
  boohoo:    {showBrand:true, imageFullWidth:true, favouriteIcon:'default',columnsDesktop:4,fontScale:'plt'},
  boohooman: {showBrand:true, imageFullWidth:true, favouriteIcon:'default',columnsDesktop:4,fontScale:'plt'},
  warehouse: {showBrand:false,imageFullWidth:true, favouriteIcon:'km',     columnsDesktop:4,fontScale:'plt'},
  brandroom: {showBrand:true, imageFullWidth:true, favouriteIcon:'default',columnsDesktop:4,fontScale:'plt'},
};

const PRODUCTS=[
  {brand:'Collection', name:'Ribbed knit midi dress',        price:'£28.00', was:'£40.00', badge:'-30%'},
  {brand:'Collection', name:'Oversized denim jacket',        price:'£45.00'},
  {brand:'Premium',    name:'Satin slip dress',              price:'£35.00', badge:'New'},
  {brand:'Collection', name:'Tailored wide-leg trouser',     price:'£32.00'},
  {brand:'Basics',     name:'Longline shacket',              price:'£38.00', was:'£55.00', badge:'-30%'},
  {brand:'Premium',    name:'Pleated mini skirt',            price:'£22.00'},
  {brand:'Collection', name:'Cropped blazer',                price:'£42.00'},
  {brand:'Basics',     name:'Seamless bodysuit',             price:'£16.00', badge:'New'},
];

const grid=document.getElementById('grid'),cfgEl=document.getElementById('cfg');

function render(){
  const b=document.documentElement.getAttribute('data-brand');
  const c=PLP_CONFIG[b];
  grid.style.gridTemplateColumns=`repeat(${c.columnsDesktop},1fr)`;
  grid.classList.toggle('pad',!c.imageFullWidth);
  const fav=c.favouriteIcon==='km'?'♥':'♡';
  grid.innerHTML=PRODUCTS.map(p=>`
    <article class="card">
      <div class="img">
        <button class="fav" aria-label="Add to wishlist">${fav}</button>
        ${p.badge?`<span class="badge">${p.badge}</span>`:''}
      </div>
      ${c.showBrand?`<div class="brand">${p.brand}</div>`:''}
      <div class="name">${p.name}</div>
      <div class="price">${p.price}${p.was?` <s>${p.was}</s>`:''}</div>
    </article>`).join('');
  cfgEl.textContent=`cols ${c.columnsDesktop} · brand ${c.showBrand?'on':'off'} · fav ${c.favouriteIcon} · img ${c.imageFullWidth?'full':'padded'}`;
}

document.querySelectorAll('#strip button[data-b]').forEach(btn=>btn.onclick=()=>{
  document.documentElement.setAttribute('data-brand',btn.dataset.b);
  document.querySelectorAll('#strip button[data-b]').forEach(x=>x.classList.toggle('on',x===btn));
  render();
});
render();
</script>
</body>
</html>
