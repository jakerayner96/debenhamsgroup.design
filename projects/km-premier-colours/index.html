<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KM Premier colours · configurator</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ============================================================
   Review shell — Jake's standard prototype format (model: Core PDP 2026, jakerayner96.github.io/core-pdp-2026).
   TOP BAR = window controls: fascia chips · Desktop/Mobile · width preset · live width · Full page/Fold · Export.
   LEFT PANEL = page configuration (project-specific — fill renderPanel()).
   STAGE = the page in an iframe, drag handle on its right edge to resize; Fold = iPhone Safari frame.
   EXPORT = one zip: <name>-mobile-390.png + <name>-desktop-1440.png (full page) + config.json + the page code.
   ============================================================ */
:root{--bg:#161616;--bar:#000;--panel:#000;--line:rgba(255,255,255,.14);--ink:#F7F7F7;--muted:#9A9A9A;--dim:#707070;--accent:#0D99FF;--ok:#1FA971;--warn:#E8A23B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:'Google Sans','Montserrat',system-ui,sans-serif;color:var(--muted);display:grid;grid-template-rows:48px 1fr;grid-template-columns:360px 1fr;height:100%;overflow:hidden;font-size:12px}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
a{color:var(--accent)}
/* ---- top bar ---- */
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:600;font-size:12px;color:var(--ink);white-space:nowrap}
.top .mid{margin:0 auto;display:flex;align-items:center;gap:10px;min-width:0}
.top .div{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px;flex:none}
.top .w{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.top .status{font-size:11px;color:var(--muted);white-space:nowrap}
.top select{background:#161616;color:var(--ink);border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:4px 8px;font:inherit;font-size:11.5px}
.export{display:flex;align-items:center;gap:8px;background:var(--ink);color:#000;padding:6px 12px;border-radius:99px;font-weight:600;font-size:12px;flex:none}
.export:disabled{opacity:.5;cursor:progress}.export svg{width:13px;height:13px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:99px;overflow:hidden;flex:none}
.seg button{padding:5px 12px;color:#B0B0B0;font-size:11.5px;white-space:nowrap}
.seg button.on{background:var(--ink);color:#000;font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.top .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chip{padding:5px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.2);font-size:11.5px;color:#B0B0B0;white-space:nowrap}
.chip.on{background:var(--ink);color:#000;border-color:var(--ink);font-weight:600}
.chip[disabled]{opacity:.35;cursor:not-allowed}
/* ---- left panel ---- */
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 14px 40px}
.panel h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:4px 0 4px;color:var(--ink)}
.panel .intro{font-size:11px;color:var(--dim);line-height:1.45;margin-bottom:14px}
.panel select,.panel input{background:#161616;color:var(--ink);border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:5px 8px;font:inherit;font-size:11.5px}
.panel option:disabled{color:#555}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#0E0E0E}
.card h3{font-size:12.5px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.card h3 small{font-weight:400;color:var(--dim);font-size:10.5px;margin-left:6px}
.card p{font-size:11px;color:var(--dim);line-height:1.45;margin-bottom:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer;border-top:1px solid rgba(255,255,255,.07);width:100%;text-align:left}
.opt:first-child{border-top:none}
.opt .r{flex:none;width:16px;height:16px;border-radius:99px;border:1.5px solid #6A6A6A;margin-top:1px;position:relative}
.opt.on .r{border-color:var(--accent);background:var(--accent)}
.opt.on .r::after{content:"";position:absolute;inset:4px;border-radius:99px;background:#0A0A0A}
.opt .t{flex:1;min-width:0}.opt .t b{display:block;font-size:12px;font-weight:500;color:#D8D8D8}.opt.on .t b{font-weight:600;color:var(--ink)}
.opt .t span{display:block;font-size:10.5px;color:var(--dim);line-height:1.4}
.f{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.f>span{font-size:11px;color:#C8C8C8;font-weight:500}
.f input,.f select{width:100%}
.f small{font-size:10.5px;color:var(--dim)}.f small.warn{color:var(--warn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink);cursor:pointer;font-weight:400}
.sw input{display:none}.sw i{width:30px;height:18px;border-radius:99px;background:#3A3A3A;position:relative;transition:.15s;flex:none}.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:99px;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{left:14px}
.rules{font-size:10.5px;color:var(--dim);line-height:1.55}.rules b{color:#C8C8C8;font-weight:600}
/* ---- stage: frame + drag handle ---- */
.stage{position:relative;overflow:hidden;display:flex;align-items:stretch;justify-content:center;padding:0}
.win{display:flex;height:100%;max-width:100%}
.holder{display:flex;flex:1;min-height:0}
iframe{border:none;display:block;height:100%;background:#FFF;box-shadow:0 0 60px rgba(0,0,0,.5)}
.handle{width:16px;display:flex;align-items:center;justify-content:center;cursor:col-resize;flex:none}
.handle i{width:5px;height:56px;border-radius:99px;background:#3A3A3A}
.handle:hover i,.dragging .handle i{background:#6A6A6A}
body.dragging{user-select:none;cursor:col-resize}body.dragging iframe{pointer-events:none}
/* ---- fold view: iOS 26 Safari frame (SEEL Enhancements 2026 · 3366-199353) ---- */
.device{position:relative;display:flex;flex-direction:column;height:100%;background:#FFF}
.device iframe{flex:1;min-height:0}
.device .sb,.device .tb,.device .home,.device .chin{display:none}
body.fold .stage{align-items:center}body.fold .win{height:auto}
body.fold .device{height:calc(var(--k) * 874px);border-radius:calc(var(--k) * 44px);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
body.fold .device .sb,body.fold .device .tb,body.fold .device .home{display:flex}
body.fold .device .chin{display:block;flex:none;height:calc(var(--k) * 82px);background:#FFF}
body.fold .device iframe{box-shadow:none}
.device .sb{height:calc(var(--k) * 62px);flex:none;background:#FFF;position:relative;align-items:center;justify-content:space-between;padding:0 calc(var(--k) * 30px) 0 calc(var(--k) * 48px);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif}
.device .sb .time{font-size:calc(var(--k) * 17px);font-weight:600;color:#000;letter-spacing:-.02em;width:calc(var(--k) * 54px)}
.device .sb .island{position:absolute;left:50%;top:calc(var(--k) * 11px);transform:translateX(-50%);width:calc(var(--k) * 124px);height:calc(var(--k) * 36px);background:#000;border-radius:99px}
.device .sb .sys{display:flex;align-items:center;gap:calc(var(--k) * 6px)}
.device .sb .sig{width:calc(var(--k) * 18px);height:calc(var(--k) * 12px)}.device .sb .wifi{width:calc(var(--k) * 16px);height:calc(var(--k) * 12px)}.device .sb .bat{width:calc(var(--k) * 28px);height:calc(var(--k) * 13px)}
.device .tb{position:absolute;left:0;right:0;bottom:calc(var(--k) * 34px);height:calc(var(--k) * 48px);padding:0 calc(var(--k) * 28px);align-items:center;justify-content:space-between;gap:calc(var(--k) * 8px);pointer-events:none}
.device .tb .circ{width:calc(var(--k) * 48px);height:calc(var(--k) * 48px);border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.18);display:grid;place-items:center;flex:none;backdrop-filter:blur(12px)}
.device .tb .circ svg{width:calc(var(--k) * 12px);height:calc(var(--k) * 20px)}.device .tb .circ:last-child svg{width:calc(var(--k) * 22px);height:calc(var(--k) * 6px)}
.device .tb .url{flex:1;height:calc(var(--k) * 48px);border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--k) * 14px);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;font-size:calc(var(--k) * 17px);color:#000;backdrop-filter:blur(12px)}
.device .tb .url .pg{width:calc(var(--k) * 20px);height:calc(var(--k) * 18px)}.device .tb .url .rl{width:calc(var(--k) * 20px);height:calc(var(--k) * 20px)}
.device .home{position:absolute;left:50%;bottom:calc(var(--k) * 8px);transform:translateX(-50%);width:calc(var(--k) * 134px);height:calc(var(--k) * 5px);border-radius:99px;background:#000}
/* ---- export overlay ---- */
#exp{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50}
#exp[hidden]{display:none}
#exp .box{background:#0A0A0A;border:1px solid var(--line);color:#FFF;padding:16px 22px;border-radius:12px;font-size:13px;display:flex;gap:12px;align-items:center;max-width:420px}
#exp .sp{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#FFF;border-radius:99px;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
#hidden{position:fixed;left:-20000px;top:0;width:1px;height:1px;overflow:hidden}
/* ---- phones: page fills the window; the panel slides over it from a settings tab ---- */
#mtab,.mhead{display:none}
@media(max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:1fr}.top{display:none}.stage{padding:0}
  .win,.holder,.device{width:100%!important}.device{flex:1}iframe{width:100%!important;box-shadow:none}.stage .handle{display:none!important}
  #mtab{display:grid;place-items:center;position:fixed;left:0;top:64px;z-index:70;width:44px;height:44px;background:#000;color:#FFF;border-radius:0 12px 12px 0;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #mtab svg{width:22px;height:22px}
  .panel{position:fixed;inset:0;z-index:80;border-right:none;transform:translateX(-100%);transition:transform .25s ease;padding-top:12px}.panel.open{transform:none}
  .mhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.mhead .chips{flex:1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .mhead .mclose{flex:none;width:32px;height:32px;border-radius:99px;border:1px solid rgba(255,255,255,.3);color:var(--ink)}
}
.warn{font-size:11px;color:var(--warn);line-height:1.45;margin-top:8px}.dim{color:var(--dim)}
.sws{display:flex;gap:6px;flex-wrap:wrap}.swc{width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.3)}.swc.on{outline:2px solid var(--accent);outline-offset:2px}
.swc.none{background:repeating-linear-gradient(45deg,#333 0 4px,#222 4px 8px)!important}
.f2{margin-top:10px}.f2>span{display:block;font-size:11px;color:var(--dim);margin-bottom:6px}
.pair{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}.pair i{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.35)}
.opt .t b .pair{margin-left:6px}
.lnk{color:var(--accent);font-size:11px;margin-top:10px}
.ok{color:#5BD38A}
</style>
</head>
<body>
<header class="top">
  <span class="ttl" id="ttl">KM Premier colours</span>
  <div class="mid">
    <span class="chips" id="brands"></span>
    <span class="div"></span>
    <span class="seg" id="dev"><button data-w="0">Desktop</button><button data-w="390" class="on">Mobile</button></span>
    <select id="preset" aria-label="Width preset" title="Exact width — or drag the handle on the preview">
      <option value="390" selected>390</option><option value="402">402</option><option value="440">440</option><option value="768">768</option><option value="1024">1024</option><option value="1280">1280</option><option value="1440">1440</option><option value="0">Fit</option>
    </select>
    <span class="w" id="sizebox"></span>
    <span class="seg" id="fold"><button data-f="0" class="on">Full page</button><button data-f="1">Fold</button></span>
  </div>
  <span class="status" id="status"></span>
  <button class="export" id="exportbtn" title="Export a zip: full-page mobile (390) and desktop (1440) PNGs, the config and the page code"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 12.5h11"/></svg>Export</button>
</header>
<button id="mtab" aria-label="Open the configurator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<aside class="panel" id="panel">
  <div class="mhead"><span class="chips" id="brands-m"></span><button class="export" id="exportbtn2">Export</button><button class="mclose" id="mclose" aria-label="Close">✕</button></div>
  <!-- {{PANEL_HTML}} — page configuration lives here; renderPanel() fills #cfgpanel -->
  <div id="cfgpanel"></div>
</aside>
<main class="stage" id="stage">
  <div class="win" id="win"><div class="holder">
    <div class="device" id="device">
      <div class="sb"><span class="time">9:41</span><span class="island"></span><span class="sys">
        <svg class="sig" viewBox="0 0 18 12" fill="#000"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
        <svg class="wifi" viewBox="0 0 16 12" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"/><path d="M4 7a5.8 5.8 0 0 1 8 0"/><circle cx="8" cy="10.2" r="1" fill="#000" stroke="none"/></svg>
        <svg class="bat" viewBox="0 0 28 13"><rect x=".5" y=".5" width="24" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity=".4"/><rect x="2" y="2" width="21" height="9" rx="2" fill="#000"/><path d="M26 4.5v4a2 2 0 0 0 0-4z" fill="#000" fill-opacity=".4"/></svg>
      </span></div>
      <iframe id="frame" title="Page preview"></iframe>
      <div class="tb"><span class="circ"><svg viewBox="0 0 12 20" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></span><span class="url"><svg class="pg" viewBox="0 0 20 18" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="2" width="14" height="10" rx="1.5"/><path d="M6 6h8M6 9h5M7 16h6"/></svg><span id="urltxt"></span><svg class="rl" viewBox="0 0 20 20" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M15 2v4h-4"/></svg></span><span class="circ"><svg viewBox="0 0 22 6" fill="#000"><circle cx="3" cy="3" r="2.2"/><circle cx="11" cy="3" r="2.2"/><circle cx="19" cy="3" r="2.2"/></svg></span></div>
      <div class="chin"></div><div class="home"></div>
    </div>
    <div class="handle" id="hr" title="Drag to resize width"><i></i></div>
  </div></div>
</main>
<div id="exp" hidden><div class="box"><span class="sp"></span><span id="exptxt">Exporting…</span></div></div>

<script>
/* ======================= PROJECT CONFIG — the only part a new prototype edits ======================= */
/* Karen Millen colours from assets/ds/tokens.css: brand accent #D24508 · buttons #000 (21 Oct 2026) · link #892D05 · surface-neutral #FAE9E1 · sec-pressed #F4D1C1 · Grey 1 #F2F2F2 · Grey 2 #E7E7E7 */
const K={orange:'#D24508',brown:'#892D05',blush:'#FAE9E1',blushLine:'#F4D1C1',grey:'#F2F2F2',greyLine:'#E7E7E7'};
/* Each option: Premier box (pm) + Deliver+ banner (dp). null = the DS default as live today (solid black). */
const OPTS=[
  {id:'current',n:'Today — solid black',d:'Both boxes black with white ink, as live. The baseline.',pm:null,dp:null},
  {id:'blush-white',n:'Blush Premier · white Deliver+',d:'Inspo 1. Premier on KM blush (no keyline) with an outlined white Add; Deliver+ white with the grey keyline of the boxes below, Learn More in KM brown.',
    pm:{bg:K.blush,fg:'#000',ctaBg:'#FFF',ctaFg:'#000',ctaLine:'#000'},dp:{bg:'#FFF',fg:'#000',link:K.brown,line:K.greyLine}},
  {id:'orange-accent',n:'Orange accent',d:'Inspo 2. Premier white with an orange keyline and orange Add; Deliver+ on blush, no keyline. The only orange in the buy column now Add to bag is black.',
    pm:{bg:'#FFF',fg:'#000',line:K.orange,ctaBg:K.orange,ctaFg:'#FFF'},dp:{bg:K.blush,fg:'#000',link:K.brown}},
  {id:'blush-both',n:'Blush, both',d:'Both boxes on KM blush, no keyline; black Add, Learn More in KM brown. One warm family under the black CTA.',
    pm:{bg:K.blush,fg:'#000',ctaBg:'#000',ctaFg:'#FFF'},dp:{bg:K.blush,fg:'#000',link:K.brown}},
  {id:'keyline',n:'White + grey keyline',d:'Both white with the #E7E7E7 keyline of the delivery, BNPL and Subscribe boxes below, and a black Add. The quietest option; the buy column reads as one set.',
    pm:{bg:'#FFF',fg:'#000',line:K.greyLine,ctaBg:'#000',ctaFg:'#FFF'},dp:{bg:'#FFF',fg:'#000',link:'#000',line:K.greyLine}},
  {id:'grey',n:'Grey',d:'Both on Grey 1 with a black Add. Neutral, like the boohooMAN / Debenhams boxes.',
    pm:{bg:K.grey,fg:'#000',ctaBg:'#000',ctaFg:'#FFF'},dp:{bg:K.grey,fg:'#000',link:'#000'}},
];
const P={
  name:'km-premier-colours',
  title:'KM Premier colours',
  page:'page.html',
  brands:[['karenmillen','Karen Millen']],
  domains:{karenmillen:'karenmillen.com'},
  files:['page.html','README.md'],
  store:'proto-km-premier-colours',
  initial:()=>{const o=OPTS[1];return {opt:o.id,pm:o.pm&&{...o.pm},dp:o.dp&&{...o.dp}}},
};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lum=h=>{const x=String(h).replace('#','');const f=x.length===3?x.split('').map(c=>c+c).join(''):x;return [0,2,4].map(i=>{const v=parseInt(f.slice(i,i+2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const up=h=>String(h||'').toUpperCase();
const GROUNDS=[['White','#FFF'],['KM blush',K.blush],['Grey 1',K.grey],['KM blush 2',K.blushLine],['Black','#000']];
/* rule (Jake 21 Oct): a keyline only on a white box — grey (the other boxes' #E7E7E7) or orange; a shaded fill never has one */
const LINES=[['Grey (matches the boxes below)',K.greyLine],['Orange',K.orange]];
const WHITE=h=>up(h)==='#FFF'||up(h)==='#FFFFFF';
const ADDS=[['black','Black'],['outline','Outline'],['orange','Orange'],['white','White']];
const ADD={black:{ctaBg:'#000',ctaFg:'#FFF',ctaLine:''},outline:{ctaBg:'#FFF',ctaFg:'#000',ctaLine:'#000'},orange:{ctaBg:K.orange,ctaFg:'#FFF',ctaLine:''},white:{ctaBg:'#FFF',ctaFg:'#000',ctaLine:''}};
const LINKS=[['Black','#000'],['KM brown',K.brown],['Orange',K.orange],['White','#FFF']];
const addOf=pm=>pm?(Object.entries(ADD).find(([k,v])=>up(v.ctaBg)===up(pm.ctaBg)&&up(v.ctaLine||'')===up(pm.ctaLine||''))||['custom'])[0]:'white';
const sw=(id,cur,list)=>`<div class="sws" data-sw="${id}">${list.map(([n,h])=>`<button class="swc${h?'':' none'}${up(h)===up(cur||'')?' on':''}" data-v="${h}" title="${n}${h?' '+h:''}" style="background:${h||'none'}"></button>`).join('')}</div>`;
const pair=o=>o?`<span class="pair"><i style="background:${o.pm.bg}"></i><i style="background:${o.dp.bg}"></i></span>`:`<span class="pair"><i style="background:#000"></i><i style="background:#000"></i></span>`;
/* Fill the left panel. Call update() after changing S.cfg to push the change into the frame. */
function renderPanel(host,S,update){
  const c=S.cfg,cur=OPTS.find(o=>o.id===c.opt);
  const pm=c.pm||{bg:'#000',fg:'#FFF',ctaBg:'#FFF',ctaFg:'#000'},dp=c.dp||{bg:'#000',fg:'#FFF',link:'#FFF'};
  const warn=[];
  const r1=cr(pm.bg,pm.fg),r2=cr(dp.bg,dp.link||dp.fg),r3=cr(pm.ctaBg,pm.ctaFg);
  if(r1<4.5)warn.push(`Premier copy ${r1.toFixed(1)}:1 — below AA 4.5:1`);
  if(r2<4.5)warn.push(`Deliver+ Learn More ${r2.toFixed(1)}:1 — below AA 4.5:1`);
  if(r3<4.5)warn.push(`Premier Add ${r3.toFixed(1)}:1 — below AA 4.5:1`);
  if(up(pm.bg)===up(pm.ctaBg)&&!pm.ctaLine)warn.push('Premier Add has the same fill as the box — give it an outline.');
  if(up(pm.bg)==='#000'||up(dp.bg)==='#000')warn.push('A box is still solid black — the clash this prototype is fixing.');
  host.innerHTML=`<h1>KM Premier colours</h1><p class="intro">The Karen Millen PDP from the DS template (the Shopping agent PDP). Only the <b>Premier</b> (Membership box) and <b>Deliver+</b> backgrounds and text colours change. Layout, copy and lockups stay as they are.</p>
  <div class="card"><h3>Option</h3>${OPTS.map(o=>`<button class="opt${c.opt===o.id?' on':''}" data-opt="${o.id}"><span class="r"></span><span class="t"><b>${esc(o.n)}${pair(o.pm?o:null)}</b><span>${esc(o.d)}</span></span></button>`).join('')}
    <button class="opt${c.opt==='custom'?' on':''}" data-opt="custom"><span class="r"></span><span class="t"><b>Custom</b><span>Your own mix. Changing anything below switches to Custom.</span></span></button></div>
  <div class="card"><h3>Premier <small>Membership box</small></h3>
    <div class="f2"><span>Background</span>${sw('pm.bg',pm.bg,GROUNDS)}</div>
    ${WHITE(pm.bg)?`<div class="f2"><span>Keyline <small>white boxes only</small></span>${sw('pm.line',pm.line,LINES)}</div>`:'<p class="rules" style="margin-top:10px">No keyline on a shaded box.</p>'}
    <div class="f2"><span>Add button</span><span class="seg" data-add>${ADDS.map(([v,l])=>`<button data-v="${v}" class="${addOf(c.pm)===v?'on':''}">${l}</button>`).join('')}</span></div>
    <p style="margin-top:10px">Text <b>${dark(pm.fg)?'black':'white'}</b> · ${r1.toFixed(1)}:1${r1>=4.5?' <span class="ok">AA</span>':''} · logo ${dark(pm.fg)?'dark ink':'white'}</p></div>
  <div class="card"><h3>Deliver+ <small>PDP banner</small></h3>
    <div class="f2"><span>Background</span>${sw('dp.bg',dp.bg,GROUNDS)}</div>
    ${WHITE(dp.bg)?`<div class="f2"><span>Keyline <small>white boxes only</small></span>${sw('dp.line',dp.line,LINES)}</div>`:'<p class="rules" style="margin-top:10px">No keyline on a shaded box.</p>'}
    <div class="f2"><span>Learn More</span>${sw('dp.link',dp.link,LINKS)}</div>
    <p style="margin-top:10px">Text <b>${dark(dp.fg)?'black':'white'}</b> · Learn More ${r2.toFixed(1)}:1${r2>=4.5?' <span class="ok">AA</span>':''} · lockup ${dark(dp.fg)?'dark ink (checkout art)':'white'}</p></div>
  ${warn.length?`<div class="card"><h3>Checks</h3>${warn.map(w=>`<p class="warn">${esc(w)}</p>`).join('')}</div>`:''}
  <div class="card"><h3>Rules</h3><p class="rules">Keyline only on a white box, in grey (#E7E7E7, like the boxes below) or orange. A shaded box has none.</p>
    <p class="rules">Text and icons go black on any light background and white on black, and the logos follow: dark-ink Premier logo, and the white-background Deliver+ lockup. Contrast is checked against AA 4.5:1. Add to bag is the DS Karen Millen button: black (21 Oct 2026).</p>
    <p class="rules">Colours come from the Karen Millen DS tokens. The boxes are DS components (Membership box, Deliver+), coloured through their own --mb-* / --dplus-* settings.</p></div>`;
  const re=()=>{update();renderPanel(host,S,update)};
  const custom=()=>{if(c.opt!=='custom'){c.pm={...pm};c.dp={...dp};c.opt='custom'}};
  host.querySelectorAll('[data-opt]').forEach(x=>x.onclick=()=>{const o=OPTS.find(o=>o.id===x.dataset.opt);
    if(o){c.opt=o.id;c.pm=o.pm&&{...o.pm};c.dp=o.dp&&{...o.dp}}else custom();re()});
  host.querySelectorAll('[data-sw]').forEach(g=>g.querySelectorAll('button').forEach(x=>x.onclick=()=>{custom();const [box,k]=g.dataset.sw.split('.'),o=c[box],v=x.dataset.v;
    o[k]=v;if(k==='bg'){o.fg=dark(v)?'#FFF':'#000';o.line=WHITE(v)?(o.line||K.greyLine):'';if(box==='dp'&&(!o.link||cr(v,o.link)<3))o.link=o.fg;
      if(box==='pm'&&cr(v,o.ctaBg)<1.3&&!o.ctaLine)Object.assign(o,dark(v)?ADD.white:ADD.black)}re()}));
  host.querySelector('[data-add]').querySelectorAll('button').forEach(x=>x.onclick=()=>{custom();Object.assign(c.pm,ADD[x.dataset.v]);re()});
}
const dark=h=>lum(h)<.18;
/* ==================================================================================================== */

let S={brand:new URLSearchParams(location.search).get('brand')||'',page:'pdp',w:390,fold:false,by:{}};
try{const s=JSON.parse(localStorage.getItem(P.store)||'null');if(s)S=Object.assign(S,s,{brand:S.brand||s.brand})}catch(e){}
if(!P.brands.some(b=>b[0]===S.brand))S.brand=P.brands[0][0];
Object.defineProperty(S,'cfg',{get(){return S.by[S.brand]||(S.by[S.brand]=P.initial(S.brand))},set(v){S.by[S.brand]=v},enumerable:false});
const $=s=>document.querySelector(s),frame=$('#frame'),stage=$('#stage'),win=$('#win'),preset=$('#preset');
const save=()=>{try{localStorage.setItem(P.store,JSON.stringify({brand:S.brand,w:S.w,fold:S.fold,by:S.by}))}catch(e){}};
/* the page gets each placement with its message resolved from the library (+ any copy edits) */
const state=()=>Object.assign({brand:S.brand},S.cfg);
const src=()=>P.page+'?s='+encodeURIComponent(JSON.stringify(state()))+'&_='+Date.now();
function update(){save();try{frame.contentWindow.postMessage({protoSet:state()},'*')}catch(e){frame.src=src()}}
function panel(){renderPanel($('#cfgpanel'),S,()=>{update()})}
function apply(){
  if(matchMedia('(max-width:760px)').matches){frame.style.width='100%';win.style.width='100%';return}
  const avail=stage.clientWidth-16,w=Math.min(S.w||avail,avail);
  frame.style.width=w+'px';win.style.width=(w+16)+'px';
  const mobile=w<600;document.body.classList.toggle('fold',S.fold&&mobile);document.documentElement.style.setProperty('--k',(w/390).toFixed(4));
  document.querySelectorAll('#fold button').forEach(b=>{b.classList.toggle('on',(+b.dataset.f===1)===(S.fold&&mobile));b.disabled=!mobile});
  $('#urltxt').textContent=P.domains[S.brand]||'';$('#sizebox').textContent=Math.round(w)+'px';
  document.querySelectorAll('#dev button').forEach(b=>b.classList.toggle('on',(b.dataset.w==='390'&&w<600)||(b.dataset.w==='0'&&w>=600)));
}
function brands(){['#brands','#brands-m'].forEach(id=>{$(id).innerHTML=P.brands.map(([v,n])=>`<button class="chip${S.brand===v?' on':''}" data-b="${v}">${n}</button>`).join('');
  $(id).querySelectorAll('button').forEach(b=>b.onclick=()=>setBrand(b.dataset.b))})}
function setBrand(b){S.brand=b;history.replaceState(null,'','?brand='+b);$('#ttl').textContent=P.title+' · '+(P.brands.find(x=>x[0]===b)||[0,b])[1];brands();panel();save();frame.src=src();apply()}
document.querySelectorAll('#dev button').forEach(b=>b.onclick=()=>{S.w=+b.dataset.w;preset.value=String(S.w);save();apply()});
preset.onchange=()=>{S.w=+preset.value;save();apply()};
document.querySelectorAll('#fold button').forEach(b=>b.onclick=()=>{S.fold=b.dataset.f==='1';save();apply()});
$('#hr').addEventListener('pointerdown',e=>{e.preventDefault();document.body.classList.add('dragging');const sx=e.clientX,sw=frame.offsetWidth;
  const move=ev=>{S.w=Math.max(320,sw+(ev.clientX-sx));preset.value='0';apply()};
  const up=()=>{document.body.classList.remove('dragging');removeEventListener('pointermove',move);removeEventListener('pointerup',up);save()};
  addEventListener('pointermove',move);addEventListener('pointerup',up)});
addEventListener('resize',apply);
$('#mtab').onclick=()=>$('#panel').classList.add('open');$('#mclose').onclick=()=>$('#panel').classList.remove('open');
preset.value=[390,402,440,768,1024,1280,1440].includes(S.w)?String(S.w):'0';
setBrand(S.brand);

/* ---------- Export: one zip — full-page 390 + 1440 PNGs, config.json, the page code ---------- */
const status=$('#status'),exp=$('#exp'),exptxt=$('#exptxt');
function loadFrame(w){return new Promise((res,rej)=>{const f=document.createElement('iframe');f.style.cssText=`width:${w}px;height:900px;border:0`;f.src=src();$('#hidden').appendChild(f);
  const t=setTimeout(()=>rej(new Error('page did not answer protoReady')),20000);
  const onMsg=e=>{if(e.source!==f.contentWindow||!e.data)return;
    if(e.data.protoReady){f.contentWindow.postMessage({protoSet:state(),exporting:true},'*');setTimeout(()=>f.contentWindow.postMessage({protoPing:1},'*'),400)}
    if(e.data.protoPong){clearTimeout(t);removeEventListener('message',onMsg);f.style.height=(e.data.h+20)+'px';setTimeout(()=>res(f),700)}};
  addEventListener('message',onMsg)})}
/* page.html embeds the real page — capture that document (html2canvas leaves iframes blank) */
async function shot(w){const f=await loadFrame(w),win=f.contentWindow,doc=(win.EXPORT_DOC&&win.EXPORT_DOC())||f.contentDocument,h=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0);
  /* capture inside the embedded page's own realm: html2canvas's clone takes its base URL from the calling script's document, so a call started
     here would resolve the page's relative images / stylesheets against this shell. iw.Function + iw.setTimeout make the page the caller.
     The canvas belongs to that page, so its bytes come out before the frame is removed. */
  const iw=doc.defaultView;if(!iw.html2canvas)await new Promise((res,rej)=>{const sc=doc.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('html2canvas did not load in the page'));doc.head.appendChild(sc)});
  const run=iw.Function('w','h','return new Promise((res,rej)=>setTimeout(()=>html2canvas(document.documentElement,{width:w,height:h,windowWidth:w,windowHeight:h,scale:2,useCORS:true,backgroundColor:"#FFFFFF",logging:false}).then(c=>c.toBlob(b=>b.arrayBuffer().then(res,rej),"image/png")).catch(rej),0))');
  const buf=await run(w,h),bytes=Uint8Array.from(new Uint8Array(buf));f.remove();
  return new Blob([bytes],{type:'image/png'})}
const stamp=()=>new Date().toISOString().slice(0,16).replace('T','-').replace(':','');
async function doExport(){const btns=[$('#exportbtn'),$('#exportbtn2')];btns.forEach(b=>b.disabled=true);exp.hidden=false;
  try{const name=`${P.name}-${S.cfg.opt}-${stamp()}`;
    exptxt.textContent='Rendering mobile (390) full page…';const m=await shot(390);
    exptxt.textContent='Rendering desktop (1440) full page…';const d=await shot(1440);
    exptxt.textContent='Packaging…';const zip=new JSZip(),root=zip.folder(name);
    root.file(`${name}-mobile-390.png`,m);root.file(`${name}-desktop-1440.png`,d);
    root.file('config.json',JSON.stringify(Object.assign(state(),{exportedAt:new Date().toISOString()}),null,2));
    for(const f of P.files){try{const r=await fetch(f);if(r.ok)root.file(f.split("/").pop(),await r.blob())}catch(e){}}
    root.file('README.txt',`${P.title} — ${S.brand}\nExported ${new Date().toISOString()}\n\n${name}-mobile-390.png / -desktop-1440.png = full-page designs at this configuration.\nconfig.json = the decision record. Open ${P.page} over HTTP with ?s=<config.json> to reproduce it.\n`);
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.zip';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    status.textContent='Exported ✓ zip (390 + 1440 PNGs)';
  }catch(err){console.error(err);status.textContent='Export failed: '+err.message}
  finally{btns.forEach(b=>b.disabled=false);exp.hidden=true;setTimeout(()=>status.textContent='',8000)}}
$('#exportbtn').onclick=doExport;$('#exportbtn2').onclick=doExport;
</script>
<script src="../../assets/ds/proto-shot.js"></script>   <!-- Screenshot button beside Export: PNG of what is on screen in the device frame -->
