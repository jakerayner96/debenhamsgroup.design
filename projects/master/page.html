<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><link rel="icon" href="/debenhamsgroup.design/assets/brands/favicon.svg" type="image/svg+xml"><link rel="icon" href="/debenhamsgroup.design/assets/brands/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/debenhamsgroup.design/assets/brands/favicon-180.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../../">
<title>Master prototype · page</title>
</head>
<body>
<script>
/* Master prototype — the page. It has no page of its own: it opens the DS page template for state.page AS IT STANDS (fetched fresh, so
   whatever is banked in a template is in the master the moment it is pushed) and adds projects/master/master.js, the journey layer.
     home → templates/home.html · plp → projects/plp-alignment/plp.html (mode=new) · pdp → templates/pdp.html · bag → templates/bag.html · wishlist → templates/wishlist.html
   The template is written into this document (same window), so the shell's protocol (?s=, protoSet, protoPing → protoReady / protoPong)
   and the html2canvas export talk to the template directly. in: ?s={brand,page}. */
(function(){
  const SRC={home:'templates/home.html',plp:'projects/plp-alignment/plp.html',pdp:'templates/pdp.html',bag:'templates/bag.html',wishlist:'templates/wishlist.html'};
  let S={brand:'debenhams',page:'home'};
  try{const q=new URLSearchParams(location.search).get('s');if(q)S=Object.assign(S,JSON.parse(q))}catch(e){}   // URLSearchParams already decodes
  if(!SRC[S.page])S.page='home';
  /* the templates read ?s= / ?brand= (the PLP also ?mode=new) */
  const sp=new URLSearchParams();sp.set('s',JSON.stringify(S));sp.set('brand',S.brand);if(S.page==='plp')sp.set('mode','new');
  history.replaceState(null,'',location.pathname+'?'+sp.toString());
  fetch(SRC[S.page],{cache:'no-cache'}).then(r=>r.text()).then(h=>{
    /* asset paths: templates/ use <base href="../"> (one level down, like us two levels down → ../../); the PLP resolves from its own folder */
    h=S.page==='plp'?h.replace(/<head>/i,'<head><base href="'+new URL('../plp-alignment/',location.href).href+'">')
                    :h.replace('<base href="../">','<base href="../../">');
    const pre=`<script>window.MASTER=${JSON.stringify({page:S.page,state:S})}<\/script>`;
    h=h.replace(/<\/head>/i,pre+'</head>').replace(/<\/body>(?![\s\S]*<\/body>)/i,'<script src="'+new URL('master.js',location.href).href+'"><\/script></body>');
    document.open();document.write(h);document.close();
  });
})();
</script>
</body>
</html>
