<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping agent · configurator — All Brands</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ============================================================
   Review shell — Jake's standard prototype format (model: Core PDP 2026, jakerayner96.github.io/core-pdp-2026).
   TOP BAR = window controls: fascia chips · Desktop/Mobile · width preset · live width · Full page/Fold · Export.
   LEFT PANEL = page configuration (project-specific — fill renderPanel()).
   STAGE = the page in an iframe, drag handle on its right edge to resize; Fold = iPhone Safari frame.
   EXPORT = one zip: <name>-mobile-390.png + <name>-desktop-1440.png (full page) + config.json + the page code.
   ============================================================ */
:root{--bg:#161616;--bar:#000;--panel:#000;--line:rgba(255,255,255,.14);--ink:#F7F7F7;--muted:#9A9A9A;--dim:#707070;--accent:#0D99FF;--ok:#1FA971;--warn:#E8A23B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:'Google Sans','Montserrat',system-ui,sans-serif;color:var(--muted);display:grid;grid-template-rows:48px 1fr;grid-template-columns:360px 1fr;height:100%;overflow:hidden;font-size:12px}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
a{color:var(--accent)}
/* ---- top bar ---- */
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:600;font-size:12px;color:var(--ink);white-space:nowrap}
.top .mid{margin:0 auto;display:flex;align-items:center;gap:10px;min-width:0}
.top .div{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px;flex:none}
.top .w{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.top .status{font-size:11px;color:var(--muted);white-space:nowrap}
.top select{background:#161616;color:var(--ink);border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:4px 8px;font:inherit;font-size:11.5px}
.export{display:flex;align-items:center;gap:8px;background:var(--ink);color:#000;padding:6px 12px;border-radius:99px;font-weight:600;font-size:12px;flex:none}
.export:disabled{opacity:.5;cursor:progress}.export svg{width:13px;height:13px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:99px;overflow:hidden;flex:none}
.seg button{padding:5px 12px;color:#B0B0B0;font-size:11.5px;white-space:nowrap}
.seg button.on{background:var(--ink);color:#000;font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.top .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chip{padding:5px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.2);font-size:11.5px;color:#B0B0B0;white-space:nowrap}
.chip.on{background:var(--ink);color:#000;border-color:var(--ink);font-weight:600}
.chip[disabled]{opacity:.35;cursor:not-allowed}
/* ---- left panel ---- */
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 14px 40px}
.panel h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:4px 0 4px;color:var(--ink)}
.panel .intro{font-size:11px;color:var(--dim);line-height:1.45;margin-bottom:14px}
.panel select,.panel input{background:#161616;color:var(--ink);border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:5px 8px;font:inherit;font-size:11.5px}
.panel option:disabled{color:#555}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#0E0E0E}
.card h3{font-size:12.5px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.card h3 small{font-weight:400;color:var(--dim);font-size:10.5px;margin-left:6px}
.card p{font-size:11px;color:var(--dim);line-height:1.45;margin-bottom:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer;border-top:1px solid rgba(255,255,255,.07);width:100%;text-align:left}
.opt:first-child{border-top:none}
.opt .r{flex:none;width:16px;height:16px;border-radius:99px;border:1.5px solid #6A6A6A;margin-top:1px;position:relative}
.opt.on .r{border-color:var(--accent);background:var(--accent)}
.opt.on .r::after{content:"";position:absolute;inset:4px;border-radius:99px;background:#0A0A0A}
.opt .t{flex:1;min-width:0}.opt .t b{display:block;font-size:12px;font-weight:500;color:#D8D8D8}.opt.on .t b{font-weight:600;color:var(--ink)}
.opt .t span{display:block;font-size:10.5px;color:var(--dim);line-height:1.4}
.f{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.f>span{font-size:11px;color:#C8C8C8;font-weight:500}
.f input,.f select{width:100%}
.f small{font-size:10.5px;color:var(--dim)}.f small.warn{color:var(--warn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink);cursor:pointer;font-weight:400}
.sw input{display:none}.sw i{width:30px;height:18px;border-radius:99px;background:#3A3A3A;position:relative;transition:.15s;flex:none}.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:99px;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{left:14px}
.rules{font-size:10.5px;color:var(--dim);line-height:1.55}.rules b{color:#C8C8C8;font-weight:600}
/* ---- stage: frame + drag handle ---- */
.stage{position:relative;overflow:hidden;display:flex;align-items:stretch;justify-content:center;padding:0}
.win{display:flex;height:100%;max-width:100%}
.holder{display:flex;flex:1;min-height:0}
iframe{border:none;display:block;height:100%;background:#FFF;box-shadow:0 0 60px rgba(0,0,0,.5)}
.handle{width:16px;display:flex;align-items:center;justify-content:center;cursor:col-resize;flex:none}
.handle i{width:5px;height:56px;border-radius:99px;background:#3A3A3A}
.handle:hover i,.dragging .handle i{background:#6A6A6A}
body.dragging{user-select:none;cursor:col-resize}body.dragging iframe{pointer-events:none}
/* ---- fold view: iOS 26 Safari frame (SEEL Enhancements 2026 · 3366-199353) ---- */
.device{position:relative;display:flex;flex-direction:column;height:100%;background:#FFF}
.device iframe{flex:1;min-height:0}
.device .sb,.device .tb,.device .home,.device .chin{display:none}
body.fold .stage{align-items:center}body.fold .win{height:auto}
body.fold .device{height:calc(var(--k) * 874px);border-radius:calc(var(--k) * 44px);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
body.fold .device .sb,body.fold .device .tb,body.fold .device .home{display:flex}
body.fold .device .chin{display:block;flex:none;height:calc(var(--k) * 82px);background:#FFF}
body.fold .device iframe{box-shadow:none}
.device .sb{height:calc(var(--k) * 62px);flex:none;background:#FFF;position:relative;align-items:center;justify-content:space-between;padding:0 calc(var(--k) * 30px) 0 calc(var(--k) * 48px);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif}
.device .sb .time{font-size:calc(var(--k) * 17px);font-weight:600;color:#000;letter-spacing:-.02em;width:calc(var(--k) * 54px)}
.device .sb .island{position:absolute;left:50%;top:calc(var(--k) * 11px);transform:translateX(-50%);width:calc(var(--k) * 124px);height:calc(var(--k) * 36px);background:#000;border-radius:99px}
.device .sb .sys{display:flex;align-items:center;gap:calc(var(--k) * 6px)}
.device .sb .sig{width:calc(var(--k) * 18px);height:calc(var(--k) * 12px)}.device .sb .wifi{width:calc(var(--k) * 16px);height:calc(var(--k) * 12px)}.device .sb .bat{width:calc(var(--k) * 28px);height:calc(var(--k) * 13px)}
.device .tb{position:absolute;left:0;right:0;bottom:calc(var(--k) * 34px);height:calc(var(--k) * 48px);padding:0 calc(var(--k) * 28px);align-items:center;justify-content:space-between;gap:calc(var(--k) * 8px);pointer-events:none}
.device .tb .circ{width:calc(var(--k) * 48px);height:calc(var(--k) * 48px);border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.18);display:grid;place-items:center;flex:none;backdrop-filter:blur(12px)}
.device .tb .circ svg{width:calc(var(--k) * 12px);height:calc(var(--k) * 20px)}.device .tb .circ:last-child svg{width:calc(var(--k) * 22px);height:calc(var(--k) * 6px)}
.device .tb .url{flex:1;height:calc(var(--k) * 48px);border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--k) * 14px);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;font-size:calc(var(--k) * 17px);color:#000;backdrop-filter:blur(12px)}
.device .tb .url .pg{width:calc(var(--k) * 20px);height:calc(var(--k) * 18px)}.device .tb .url .rl{width:calc(var(--k) * 20px);height:calc(var(--k) * 20px)}
.device .home{position:absolute;left:50%;bottom:calc(var(--k) * 8px);transform:translateX(-50%);width:calc(var(--k) * 134px);height:calc(var(--k) * 5px);border-radius:99px;background:#000}
/* ---- App view: the React Native app (plt-app-prototype, exported for web into app/) in an iPhone frame.
   The app draws behind the status bar like iOS; ?inset=62,34 gives it the safe areas a browser reports as 0. ---- */
#appframe{display:none}
body.app .stage{align-items:center}body.app .win{height:auto}body.app .handle{visibility:hidden}
body.app .device{width:calc(var(--k) * 390px);height:calc(var(--k) * 844px);border-radius:calc(var(--k) * 54px);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
body.app #frame{display:none}
body.app #appframe{display:block;position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--k));transform-origin:0 0;box-shadow:none;background:#FFF}
body.app .device .sb{display:flex;position:absolute;left:0;right:0;top:0;z-index:2;background:transparent;pointer-events:none}
body.app .device .home{display:flex;z-index:2;pointer-events:none}
body.app .device .tb,body.app .device .chin{display:none}
/* ---- export overlay ---- */
#exp{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50}
#exp[hidden]{display:none}
#exp .box{background:#0A0A0A;border:1px solid var(--line);color:#FFF;padding:16px 22px;border-radius:12px;font-size:13px;display:flex;gap:12px;align-items:center;max-width:420px}
#exp .sp{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#FFF;border-radius:99px;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
#hidden{position:fixed;left:-20000px;top:0;width:1px;height:1px;overflow:hidden}
/* ---- phones: page fills the window; the panel slides over it from a settings tab ---- */
#mtab{display:none!important}.mhead{display:none}   /* phones: the page's hamburger opens the panel (protoMenu) */
@media(max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:1fr}.top{display:none}.stage{padding:0}
  .win,.holder,.device{width:100%!important}.device{flex:1}iframe{width:100%!important;box-shadow:none}.stage .handle{display:none!important}
  #mtab{display:grid;place-items:center;position:fixed;left:0;top:64px;z-index:70;width:44px;height:44px;background:#000;color:#FFF;border-radius:0 12px 12px 0;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #mtab svg{width:22px;height:22px}
  .panel{position:fixed;inset:0;z-index:80;border-right:none;transform:translateX(-100%);transition:transform .25s ease;padding-top:12px}.panel.open{transform:none}
  .mhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.mhead .chips{flex:1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .mhead .mclose{flex:none;width:32px;height:32px;border-radius:99px;border:1px solid rgba(255,255,255,.3);color:var(--ink)}
}
/* ---- project: feature list, config editor ---- */
.feat{display:flex;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.07);padding:2px 0}
.feat:first-of-type{border-top:none}
.feat .fn{flex:1;text-align:left;padding:7px 8px;border-radius:7px;margin-left:-8px}
.feat .fn b{display:block;font-size:12px;font-weight:500;color:#D8D8D8}.feat .fn span{display:block;font-size:10.5px;color:var(--dim)}
.feat.on .fn{background:rgba(13,153,255,.14)}.feat.on .fn b{color:var(--ink);font-weight:600}
.feat .fn:hover{background:rgba(255,255,255,.06)}
.panel textarea{background:#161616;color:var(--ink);border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:6px 8px;font:inherit;font-size:11.5px;width:100%;resize:vertical;line-height:1.45}
.panel input[type=color]{height:30px;padding:2px 4px}
.f input+input{margin-top:4px}
.vertog{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}.vertog .seg{align-self:flex-start}.vertog .seg button{min-width:72px;font-weight:700;letter-spacing:.04em}.vertog small{color:var(--dim)}
.phbox{position:relative;display:block}.phbox input{padding-right:46px}.phbox b{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:600;color:var(--dim);pointer-events:none}.phbox b.over{color:#FF8A80}   /* character count inside the field */
.diff{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#080808}
.diff code,.rules code{font:10.5px ui-monospace,Menlo,monospace;color:#9FD3FF}
.f .seg button{padding:5px 10px}
/* collapsible card: the Agent config is folded by default */
.card--fold .fold-h{cursor:pointer;margin:0;user-select:none}.card--fold .fold-h .chev{width:8px;height:8px;border:solid #9A9A9A;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:-3px 4px 0 auto;transition:transform .15s;flex:none}
.card--fold.open .fold-h{margin-bottom:8px}.card--fold.open .fold-h .chev{transform:rotate(-135deg);margin-top:3px}
.card--fold .fold-b{display:none}.card--fold.open .fold-b{display:block}

</style>
</head>
<body>
<header class="top">
  <span class="ttl" id="ttl">Shopping agent</span>

    <span class="seg" id="dev"><button data-w="0">Desktop</button><button data-w="390" class="on">Mobile</button><button data-app="1" title="The native app (React Native, glass UI) with the same options">App</button></span>

</header>
<button id="mtab" aria-label="Open the configurator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<aside class="panel" id="panel">
  <div class="mhead"><span class="chips" id="brands-m"></span><button class="export" id="exportbtn2">Export</button><button class="mclose" id="mclose" aria-label="Close">✕</button></div>

<main class="stage" id="stage">
  <div class="win" id="win"><div class="holder">

        <svg class="sig" viewBox="0 0 18 12" fill="#000"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>

        <svg class="bat" viewBox="0 0 28 13"><rect x=".5" y=".5" width="24" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity=".4"/><rect x="2" y="2" width="21" height="9" rx="2" fill="#000"/><path d="M26 4.5v4a2 2 0 0 0 0-4z" fill="#000" fill-opacity=".4"/></svg>
      </span></div>
      <iframe id="frame" title="Page preview"></iframe>
      <iframe id="appframe" title="App preview"></iframe>

<script>
/* ======================= PROJECT CONFIG — the only part a new prototype edits ======================= */
/* the feature list, in Jake's order (15 Oct) — one radio per feature; picking one shows its page and scrolls to it */
const FEATS=[
  {k:'ep-oa',grp:'ex',n:'Ask beside the field',pg:'home',d:'Exposed search with the “Ask” pill beside it (44px). Search active: the word Ask animates out, leaving the sparkle; typing pushes it out; the X stays.',set:{launcher:'outAsk'}},
  {k:'ep-lift',grp:'ex',n:'Lifts over the logo row',pg:'home',d:'Exposed search with the “Ask” pill. Tapping the field slides it up over the logo row for more room and Ask animates down to the sparkle; close and it drops back.',set:{launcher:'lift'}},
  {k:'ep-ni-ask',grp:'ni',n:'Search icon · Ask beside the field',pg:'home',d:'Chosen 19 Oct. The header has the search icon only. Tap it: the field opens focused (keyboard up) with the “Ask” pill and the X beside it; Ask stays while typing. Field: camera + search icons at 20px, 16px text (no iOS zoom).',set:{launcher:'niAsk',mCam:20,mSearchIcon:true,mTxt:16}},
  {k:'custom',n:'Content Prompts Banner',pg:'home',d:'Fixed prompts we choose and place (CMS-fed); each one opens the agent with that question. Homepage shown; the same works on category pages.',opts:[['module','A · Homepage module','Image + prompt panel under the hero.'],['strip','B · Promo strip','A slim AI-gradient bar at the top of the page.'],['hero','C · Chips on the hero','Prompt chips over the first hero image.']]},
  {k:'autocomplete',n:'Search Suggestions',pg:'plp',search:true,d:'Search active, as the Search Figma (1012:2295): an overlay under the header (USP banners hidden): Recent Searches and Popular Searches as one scrolling row each, then “Need some help?” with the agent’s prompts stacked, then Recently Viewed. The last prompt (Help me discover) is the open-ended one.'},

function handoff(c){const lines=[];const ep={niAsk:'Not exposed: header search icon; opens the field focused with an Ask pill and the X (Ask stays while typing); field = camera + search icons at 20px, 16px text (no iOS zoom)',niLift:'Not exposed: header search icon; the search row opens over the logo row, field focused, AI circle + X',outAsk:'Exposed search, “Ask” pill beside the field (both 44px); search active: the word Ask animates out to the sparkle circle, typing pushes it out, X always there',lift:'Exposed search + “Ask” pill; search active slides the field up over the logo row (mobile) and Ask animates to the sparkle',icon:'Mobile: header search icon only; search active shows the AI circle left of the X. Desktop: circle beside the field'}[c.launcher];
  lines.push(`# Shopping agent — ${AG.def(S.brand).brandName} · dev hand-off`,'',`Exported ${new Date().toISOString()}`,'');
  lines.push('## 1 · Agent config (backend)','`salesAgentConfig.json` = the dev retrieveConfig with our edits applied. Changed keys:','');
  if(BASE)AG.diff(BASE,cfgFile()).forEach(d=>lines.push(`- \`${d.path}\`: ${JSON.stringify(d.from)} → ${JSON.stringify(d.to)}`));
  lines.push('','Start screen: sparkle + “Hi there, I’m Deb” · one line · four one-line starter prompts (a custom_template in the messages-header slot, replacing the hero + zero-state intro). Close = DS modal close, 16×16 1pt at 24px in; no title bar text or icon.');
  lines.push('Images must be hosted on our CDN before go-live (hero, chat icon); load them via the backend config, not client-side overrides (flicker).','');
  lines.push('## 2 · Entry point + features (front end)','',`- **Entry point**: ${ep}`,`- **Search sizes**: ${(S.ver||'live')==='new'?'NEW — search text 14px (placeholder, typed text, Recent / Popular chips, Need some help? prompts), camera + search icons 16px':'LIVE — search text 16px (placeholder, typed text, Recent / Popular chips, Need some help? prompts), camera + search icons 20px'}`,`- **Search placeholder**: “${(c.ph||'').trim()||'Search product or brand'}” (${((c.ph||'').trim()||'Search product or brand').length} characters; ${(S.ver||'live')==='new'?'14 max at NEW 14px':'11 max at LIVE 16px'} for no clipping from 360px in the not-exposed + Ask + X layout)`,`- **Mobile search field**: camera + search icons ${c.mCam||20}px · search icon ${c.mSearchIcon===false?'hidden (the keyboard search key does it)':'shown'} · text ${c.mTxt||16}px${(c.mTxt||16)<16?' (input kept at 16px and scaled by '+((c.mTxt||16)/16).toFixed(3)+' so iOS does not zoom)':''}.`);
  FEATS.filter(x=>x.opts).forEach(x=>{const o=x.opts.find(o=>o[0]===c[POSKEY[x.k]]);lines.push(`- **${x.n}**: ${o?o[1]+' — '+o[2]:''}`)});
  lines.push(`- **Virtual Try On / Shop Similar**: chips ${c.chipPos==='image'?'stacked top right of the PDP gallery':c.chipPos==='bl'?'stacked bottom left of the PDP gallery':'in a row above the product title (VTO Figma 15656:21934)'} — one chip: ${c.chipKind==='vto'?'Virtual Stylist (hanger)':'Shop Similar (AI icon)'}.`);
  lines.push(`- **PLP Next Best Action**: ${c.nbaRow?`a full-width row of the grid after row ${c.nbaRow} (${c.nbaRow*2} products on mobile, ${c.nbaRow*5} on desktop)`:'below the filters, above the first row of products'}.`);
  lines.push('- **Search Suggestions**: Popular Searches → the agent’s suggestions; Recent Searches and Recently Viewed unchanged (Search Figma 1012:2295).');
  lines.push('','Calls:','```js',
    '// every chip / button below opens the chat with its query; the input sends what the shopper types',
    'window.googleAgent.sendQuery("Shop similar");',
    'window.googleAgent.sendQuery("Virtual Stylist");         // VTO — agent asks for a photo',
    ...c.acChips.filter(Boolean).map(q=>`window.googleAgent.sendQuery(${JSON.stringify(q)});   // search suggestion`),
    `window.googleAgent.sendQuery(${JSON.stringify(c.nbaQ)}+" → "+answer);   // PLP next best action`,
    'window.googleAgent.sendQuery("Help me find the perfect gift");   // content prompts banner (CMS-fed)',
    '```','','PDP prompts:','```html',
    `<google-ai-prompts product-id="{sku}" direction="${c.pdpDir}"></google-ai-prompts>`,'```',
    `Launch prompts (pre-baked): ${c.pdpPrompts.filter(Boolean).map(q=>JSON.stringify(q)).join(', ')}${c.pdpAsk?' + “Ask anything” (outlined — the open-ended option)':''}.`,
    '','## 3 · Reply components → config','',
    '| Reply part | In Google’s widget? | Styled by |','|---|---|---|',
    '| Text reply | Native | --chat-messenger-internal-message-bot-* · typescale body-medium · settings.dynamic-bot-writing |',
    '| User bubble | Native | --chat-messenger-internal-message-user-* |',
    '| Product carousel | Native | rich-content-config.tileConfig · --chat-messenger-product-carousel-* |',

    `| ADD TO BAG | Native | settings.custom-cart + cart-button-text · --cart-button-background-color ${(c.agent.cartBg||AG.def(S.brand).cartBg)} · --cart-button-font-color ${(c.agent.cartFg||AG.def(S.brand).cartFg)} · corner radii ${(c.agent.cartRadius??AG.def(S.brand).cartRadius)}px |`,
    '| Quick-reply chips | Native | --chat-messenger-internal-chips-* |',

    '| Complete the look | Not in the widget | custom_template or FDE |',
    '| Fit scale | Not in the widget | custom_template or FDE |',
    '| Photo upload (VTO) | Agent-side | confirm with Google |',
  '','Chip styling (DS .ai-pill): white pill, puck shadow, 14px Geologica, gap 2 (8px), AI icon 16px; the last chip of a group is the gradient-outline pill, not the shadow one.',
    '',`Out of scope this phase: ${OUT.join(', ')}.`);
  return lines.join('\n')}

  const phUpd=()=>{const n=phin.value.trim().length,ni=c.launcher==='niAsk',from=Math.ceil((ni?OFF[0]:OFF[1])+n*PHC),ct=host.querySelector('#phct');
    ct.textContent=n+'/'+PHMAX;ct.classList.toggle('over',n>PHMAX);
    host.querySelector('#phnote').innerHTML=(n>PHMAX?`<b style="color:#FF8A80">Over ${PHMAX}: clips below ~${from}px</b>`:`Fits from ~${from}px`)+` on every fascia (${ni?'not exposed, search open: field + Ask + X':'exposed: field + Ask'}). ${PHMAX} characters = no clipping from 360px (${NV?'NEW: 14px text':'LIVE: 16px text'}).`};
  if(phin){phUpd();phin.oninput=()=>{c.ph=phin.value;phUpd();update()}}
  host.querySelectorAll('#vertog button').forEach(b=>b.onclick=()=>{S.ver=b.dataset.v;go()});
  host.querySelectorAll('#eppage button').forEach(b=>b.onclick=()=>{c.page=b.dataset.v;c.search=false;c.chat=false;c.focus=null;go()});
  host.querySelectorAll('#eptab button').forEach(b=>b.onclick=()=>{c.epTab=b.dataset.v;const first=FEATS.find(x=>x.grp===b.dataset.v);c.feat=first.k;Object.assign(c,first.set);c.page=c.page||'home';c.search=false;c.chat=false;go()});
  const ms=(id,k,f)=>host.querySelectorAll(id+' button').forEach(b=>b.onclick=()=>{c[k]=f(b.dataset.v);c.page=c.page||'home';c.search=true;c.focus=null;go()});
  host.querySelector('#t-chat').onchange=ev=>{c.chat=ev.target.checked;go()};
  host.querySelector('#t-labels').onchange=ev=>{c.labels=ev.target.checked;c.chat=true;go()};
  host.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{c[POSKEY[fe.k]]=b.dataset.pos;c.page=fe.pg;c.focus={f:fe.k,n:Date.now()};go()});
  host.querySelectorAll('#chippos button').forEach(b=>b.onclick=()=>{c.chipPos=b.dataset.v;c.focus={f:fe.k,n:Date.now()};go()});
  host.querySelectorAll('#chipkind button').forEach(b=>b.onclick=()=>{c.chipKind=b.dataset.v;c.feat=b.dataset.v==='vto'?'vto':'shopSimilar';c.page='pdp';go()});
  host.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{c.nbaRow=+b.dataset.row;c.page='plp';c.focus={f:'nba',n:Date.now()};go()});
  host.querySelectorAll('#dir button').forEach(b=>b.onclick=()=>{c.pdpDir=b.dataset.v;go()});
  const ti=host.querySelector('#t-head');if(ti)ti.onchange=ev=>{c.pdpHead=ev.target.checked;go()};
  const tg=host.querySelector('#t-glance');if(tg)tg.onchange=ev=>{c.glance=ev.target.checked;c.focus={f:'pdpPrompts',n:Date.now()};go()};
  const ta=host.querySelector('#t-ask');if(ta)ta.onchange=ev=>{c.pdpAsk=ev.target.checked;go()};
  host.querySelectorAll('[data-arr]').forEach(i=>i.onchange=()=>{c[i.dataset.arr][+i.dataset.i]=i.value;go()});
  host.querySelectorAll('[data-key]').forEach(i=>i.onchange=()=>{c[i.dataset.key]=i.value;go()});
  host.querySelectorAll('[data-cp]').forEach(i=>i.onchange=()=>{c.cpChips=c.cpChips||['Gifts for her under £50','Stocking fillers she’ll love','What do I get my dad?'];c.cpChips[+i.dataset.cp]=i.value;go()});
  /* picture: scaled to 1000px wide JPEG so it travels in the page state and the export */
  const ci=host.querySelector('#cpimg');if(ci)ci.onchange=()=>{const f=ci.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1000/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);c.cpImg=cv.toDataURL('image/jpeg',.8);URL.revokeObjectURL(im.src);go()};im.src=URL.createObjectURL(f)};
  const cx=host.querySelector('#cpimgx');if(cx)cx.onclick=ev=>{ev.preventDefault();delete c.cpImg;go()};
  host.querySelectorAll('[data-ag]').forEach(i=>i.onchange=()=>{const k=i.dataset.ag;let v=i.type==='checkbox'?i.checked:i.value;
    if(k==='prompts'||k==='starters')v=v.split('\n').map(s=>s.trim()).filter(Boolean);if(['chipRadius','width','radius','cartRadius'].includes(k))v=+v;
    c.agent[k]=v;if(!['name'].includes(k))c.chat=true;go()});
  host.querySelector('#cfgtoggle').onclick=()=>{c.cfgOpen=!c.cfgOpen;save();panel()};
  host.querySelector('#dlcfg').onclick=()=>BASE&&dl('salesAgentConfig.json',JSON.stringify(cfgFile(),null,2));
  host.querySelector('#cpcfg').onclick=()=>{if(BASE)navigator.clipboard.writeText(JSON.stringify(cfgFile(),null,2)).then(()=>{$('#status').textContent='Config copied ✓';setTimeout(()=>$('#status').textContent='',3000)})};
  host.querySelector('#rscfg').onclick=()=>{c.agent={};go()};
}

let S={brand:new URLSearchParams(location.search).get('brand')||'',w:390,fold:false,by:{}};
try{const s=JSON.parse(localStorage.getItem(P.store)||'null');if(s)S=Object.assign(S,s,{brand:S.brand||s.brand})}catch(e){}
if(!P.brands.some(b=>b[0]===S.brand))S.brand=P.brands[0][0];
Object.defineProperty(S,'cfg',{get(){return S.by[S.brand]||(S.by[S.brand]=P.initial(S.brand))},set(v){S.by[S.brand]=v},enumerable:false});
const $=s=>document.querySelector(s),frame=$('#frame'),stage=$('#stage'),win=$('#win'),preset=$('#preset');
const save=()=>{try{localStorage.setItem(P.store,JSON.stringify({brand:S.brand,w:S.w,fold:S.fold,app:!!S.app,ver:S.ver||'live',by:S.by}))}catch(e){}};
const state=()=>Object.assign({brand:S.brand},S.cfg,{ver:S.ver||'live'});   /* LIVE / NEW is one switch for every fascia */
const src=()=>P.page+'?s='+encodeURIComponent(JSON.stringify(state()))+'&_='+Date.now();
function update(){save();try{frame.contentWindow.postMessage({protoSet:state()},'*')}catch(e){frame.src=src()}sendApp()}
/* ---- App view: the same options, mapped onto the native app's placements (plt-app-prototype AgentUrlState) ---- */
const appframe=$('#appframe');
const APP_SRC='app/?brand=debenhams&inset=62,34';
const APP_PDP='/product/P-a29ae3cd-c063-47be-ac02-7f8d214fe84b';   // a Debenhams dress with a full PDP record
const APP_PLP='/plp?slug=womens-dresses';
function appState(){const c=S.cfg,on=f=>(c.on||{})[f]!==false;
  /* The app (16 Oct): one PDP chip — Virtual Stylist or Shop Similar — at a position; the
     content prompts are the module only, with this panel's colours and picture; search
     suggestions and PDP prompts are always on (the app has no off for them). */
  const kind=c.chipKind==='similar'||(!on('vto')&&on('shopSimilar'))?'similar':'vto';
  const pos=c.chipPos==='image'||c.chipPos==='bl'?'image':'title';
  const pl={
      entry:c.launcher==='outAsk'?'ask':'icon',
      nbaRow:+c.nbaRow||0,
      pdpPrompts:c.pdpPos==='belowCta'?'belowBuy':'afterBnpl',
      chip:kind,chipPos:pos};
  if(c.cpBg)pl.bannerBg=c.cpBg;if(c.cpFg)pl.bannerFg=c.cpFg;pl.bannerImage=c.cpImg||null;
  return {brand:'debenhams',chat:!!c.chat,
    path:c.search?'/search-view':c.page==='pdp'?APP_PDP:c.page==='plp'?APP_PLP:'/',
    placements:pl}}
function sendApp(){if(S.app&&appframe.src)try{appframe.contentWindow.postMessage({appState:appState()},'*')}catch(e){}}
addEventListener('message',e=>{if(e.data&&e.data.appReady&&e.source===appframe.contentWindow)sendApp()});
function panel(){renderPanel($('#cfgpanel'),S,()=>{update()})}
function apply(){
  document.body.classList.toggle('app',!!S.app);
  if(S.app&&!appframe.src)appframe.src=APP_SRC;   // loaded once, then driven by postMessage
  document.querySelectorAll('#dev button').forEach(b=>b.classList.toggle('on',b.dataset.app?!!S.app:!S.app&&((b.dataset.w==='390'&&(S.w||9999)<600)||(b.dataset.w==='0'&&(S.w||9999)>=600))));
  preset.disabled=!!S.app;document.querySelectorAll('#fold button').forEach(b=>b.disabled=!!S.app);
  if(S.app){const k=matchMedia('(max-width:760px)').matches?innerWidth/390:Math.min(1,(stage.clientHeight-40)/844,(stage.clientWidth-40)/390);
    document.documentElement.style.setProperty('--k',k.toFixed(4));document.body.classList.remove('fold');
    frame.style.width='';win.style.width=Math.round(390*k)+'px';$('#sizebox').textContent='App · 390';sendApp();return}
  if(matchMedia('(max-width:760px)').matches){frame.style.width='100%';win.style.width='100%';return}
  const avail=stage.clientWidth-16,w=Math.min(S.w||avail,avail);
  frame.style.width=w+'px';win.style.width=(w+16)+'px';
  const mobile=w<600;document.body.classList.toggle('fold',S.fold&&mobile);document.documentElement.style.setProperty('--k',(w/390).toFixed(4));
  document.querySelectorAll('#fold button').forEach(b=>{b.classList.toggle('on',(+b.dataset.f===1)===(S.fold&&mobile));b.disabled=!mobile});
  $('#urltxt').textContent=P.domains[S.brand]||'';$('#sizebox').textContent=Math.round(w)+'px';
}
function brands(){['#brands','#brands-m'].forEach(id=>{$(id).innerHTML=P.brands.map(([v,n])=>`<button class="chip${S.brand===v?' on':''}" data-b="${v}">${n}</button>`).join('');
  $(id).querySelectorAll('button').forEach(b=>b.onclick=()=>setBrand(b.dataset.b))})}
function setBrand(b){S.brand=b;history.replaceState(null,'','?brand='+b);$('#ttl').textContent=P.title+' · '+(P.brands.find(x=>x[0]===b)||[0,b])[1];brands();panel();save();frame.src=src();apply()}
document.querySelectorAll('#dev button').forEach(b=>b.onclick=()=>{if(b.dataset.app){S.app=true}else{S.app=false;S.w=+b.dataset.w;preset.value=String(S.w)}save();apply()});
preset.onchange=()=>{S.w=+preset.value;save();apply()};
document.querySelectorAll('#fold button').forEach(b=>b.onclick=()=>{S.fold=b.dataset.f==='1';save();apply()});
$('#hr').addEventListener('pointerdown',e=>{e.preventDefault();document.body.classList.add('dragging');const sx=e.clientX,sw=frame.offsetWidth;
  const move=ev=>{S.w=Math.max(320,sw+(ev.clientX-sx));preset.value='0';apply()};
  const up=()=>{document.body.classList.remove('dragging');removeEventListener('pointermove',move);removeEventListener('pointerup',up);save()};
  addEventListener('pointermove',move);addEventListener('pointerup',up)});
addEventListener('resize',apply);
$('#mtab').onclick=()=>$('#panel').classList.add('open');$('#mclose').onclick=()=>$('#panel').classList.remove('open');
preset.value=[390,402,440,768,1024,1280,1440].includes(S.w)?String(S.w):'0';
setBrand(S.brand);

/* ---------- Export: one zip — full-page 390 + 1440 PNGs, config.json, the page code ---------- */
const status=$('#status'),exp=$('#exp'),exptxt=$('#exptxt');
function loadFrame(w){return new Promise((res,rej)=>{const f=document.createElement('iframe');f.style.cssText=`width:${w}px;height:900px;border:0`;f.src=src();$('#hidden').appendChild(f);
  const t=setTimeout(()=>rej(new Error('page did not answer protoReady')),20000);
  const onMsg=e=>{if(e.source!==f.contentWindow||!e.data)return;
    if(e.data.protoReady){f.contentWindow.postMessage({protoSet:state(),exporting:true},'*');setTimeout(()=>f.contentWindow.postMessage({protoPing:1},'*'),400)}
    if(e.data.protoPong){clearTimeout(t);removeEventListener('message',onMsg);f.style.height=(e.data.h+20)+'px';setTimeout(()=>res(f),700)}};
  addEventListener('message',onMsg)})}
async function shot(w){const f=await loadFrame(w),doc=f.contentDocument,h=doc.documentElement.scrollHeight;
  const c=await html2canvas(doc.documentElement,{width:w,height:h,windowWidth:w,windowHeight:h,scale:2,useCORS:true,backgroundColor:'#FFFFFF',logging:false});f.remove();
  return new Promise(r=>c.toBlob(r,'image/png'))}
const stamp=()=>new Date().toISOString().slice(0,16).replace('T','-').replace(':','');
async function doExport(){const btns=[$('#exportbtn'),$('#exportbtn2')];btns.forEach(b=>b.disabled=true);exp.hidden=false;
  try{const name=`${P.name}-${S.brand}-${stamp()}`;
    exptxt.textContent='Rendering mobile (390) full page…';const m=await shot(390);
    exptxt.textContent='Rendering desktop (1440) full page…';const d=await shot(1440);
    exptxt.textContent='Packaging…';const zip=new JSZip(),root=zip.folder(name);
    root.file(`${name}-mobile-390.png`,m);root.file(`${name}-desktop-1440.png`,d);
    root.file('config.json',JSON.stringify(Object.assign(state(),{exportedAt:new Date().toISOString()}),null,2));
    for(const f of P.files){try{const r=await fetch(f);if(r.ok)root.file(f,await r.blob())}catch(e){}}
    if(P.extra)P.extra(root);
    root.file('README.txt',`${P.title} — ${S.brand}\nExported ${new Date().toISOString()}\n\n${name}-mobile-390.png / -desktop-1440.png = full-page designs at this configuration.\nconfig.json = the decision record. Open ${P.page} over HTTP with ?s=<config.json> to reproduce it.\n`);
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.zip';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    status.textContent='Exported ✓ zip (390 + 1440 PNGs)';
  }catch(err){console.error(err);status.textContent='Export failed: '+err.message}
  finally{btns.forEach(b=>b.disabled=false);exp.hidden=true;setTimeout(()=>status.textContent='',8000)}}
/* the page tells us when the shopper opens / closes the chat, so the panel toggle stays true */
addEventListener('message',e=>{if(e.source!==frame.contentWindow||!e.data)return;if(e.data.protoMenu&&matchMedia('(max-width:760px)').matches){$('#panel').classList.add('open');return}if('protoChat' in e.data&&S.cfg.chat!==e.data.protoChat){S.cfg.chat=e.data.protoChat;save();panel()}if('protoSearch' in e.data){S.cfg.search=e.data.protoSearch;save();panel()}});
$('#exportbtn').onclick=doExport;$('#exportbtn2').onclick=doExport;
