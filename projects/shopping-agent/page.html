<!DOCTYPE html>
<html lang="en" data-brand="debenhams">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../../">
<title>Shopping agent · Debenhams</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ds/tokens.css">
<link rel="stylesheet" href="assets/ds/components.css">
<style>
/* Page scaffolding + the shopping-agent surfaces. Site pieces are DS components (catalogue.js / components.css).
   Agent pieces: the chat window reads the salesAgentConfig style keys by their own names (--chat-messenger-*),
   so what you see here is what the config file sets. PDP prompts mirror <google-ai-prompts> (prompts-container / prompt-link). */
*{box-sizing:border-box}html,body{margin:0;background:var(--surface-page)}
body{font-family:var(--font-family-base);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.wrap{padding:0 16px}@media(min-width:1024px){.wrap{padding:0 40px;max-width:1440px;margin:0 auto}}
.h1{font-size:20px;font-weight:var(--w-strong);margin:12px 0 4px}
@media(min-width:1024px){.h1{font-size:28px}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 8px}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 16px}}
article.pc{width:auto!important}   /* product cards only — .bnpl badges also use .pc */
.pgfoot{margin-top:40px}.pgfoot>*,.pgfoot>*>*{width:100%!important;max-width:none!important}
#hdrwrap{position:relative;z-index:20}
.hd-search span.q{color:var(--text-primary)}

/* ---------- the sparkle (dev build: shopping-agent-sparkle, gradient primary-dark → primary → 45% white) ---------- */
.spk{display:inline-block;flex:none;vertical-align:middle}

/* ---------- entry point: Ask Deb ---------- */

/* ---------- AI: DS .ai-pill (assets/ds/components.css) + AI icon; layout only here ---------- */
.ag-sw{flex:1;display:flex;align-items:center;gap:12px;max-width:940px;margin:0 auto;min-width:0}
.ag-sw .hd-search{margin:0;max-width:none}
.hd-search>span:not(.ics):not(.caret){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* option 1 (pill inside the box): 44px field, 40px pill inset 2px top / bottom / right (Jake, 12 Oct) */
.hd-search.ag-has,.ag-mrow .hd-search.ag-has{height:44px;padding-right:2px}
.hd-search.ag-has>.ai-pill,.ag-mrow .hd-search.ag-has>.ai-pill{height:40px;margin-left:4px;padding:0 16px 0 12px;font-size:14px}
.ag-mrow{padding:0 16px 12px}.ag-mrow .hd-search{height:44px;padding:0 16px;font-size:14px}
.ag-mrow .ai-pill{height:32px;font-size:13px;padding:0 12px 0 10px}
/* option 2 (pill outside the box): search field and Ask Deb pill share one height — 44px (Jake, 12 Oct) */
.ag-sw{--ag-h:44px}
.ag-sw>.hd-search{height:var(--ag-h);cursor:text;flex:1 1 0;min-width:0}
.ag-sw .hd-search .ics img{object-fit:contain}
.ag-mrow .ag-sw{gap:10px}
.ag-sw .hd-search .ics{margin-left:auto}.ag-mrow .ag-sw .hd-search .ics{gap:14px}.ag-mrow .ag-sw .hd-search .ics img{width:20px;height:20px}
.ai-circle{display:grid;place-items:center;width:var(--ag-h);height:var(--ag-h);flex:none;padding:0;border-radius:50%;cursor:pointer;border:0;background:#FFF;box-shadow:var(--shadow-puck);transition:box-shadow .15s,transform .15s}
.ai-circle:hover,.ag-ask:hover{box-shadow:var(--shadow-pill)}.ai-circle:active,.ag-ask:active{transform:scale(.96)}
.ag-ask{border:0!important;background:#FFF!important;box-shadow:var(--shadow-puck);transition:box-shadow .15s,transform .15s}   /* same soft shadow as the prompt pills, no gradient outline */
body.exporting .ai-circle,body.exporting .ag-ask{box-shadow:none;border:1px solid var(--border-subtle)!important}
.ai-circle .ai-icon{width:22px;height:22px}
.ag-ask{padding:0 18px 0 14px!important}
/* lift: the search row takes the logo row's place while search is active (mobile) */
#hdrwrap.lifted .hd-bar{display:none}
#hdrwrap.lifting .hd-bar{display:flex;animation:barUp .26s cubic-bezier(.4,0,.2,1) forwards;overflow:hidden}
#hdrwrap.lifted.closing .hd-bar{display:flex;animation:barDown .24s cubic-bezier(.4,0,.2,1) forwards;overflow:hidden}
#hdrwrap.lifted.closing .ag-mrow{animation:rowDown .24s cubic-bezier(.4,0,.2,1) forwards}
@keyframes rowDown{from{padding-top:8px}to{padding-top:0}}
#hdrwrap.lifted .ag-mrow{padding-top:8px}
#hdrwrap.lifting .ag-mrow{animation:rowUp .26s cubic-bezier(.4,0,.2,1) both}
@keyframes barUp{from{max-height:56px;opacity:1}to{max-height:0;opacity:0;padding-top:0;padding-bottom:0}}
@keyframes rowUp{from{padding-top:0}to{padding-top:8px}}
@keyframes acIn{from{opacity:0}to{opacity:1}}
body.exporting #hdrwrap.lifting .hd-bar{display:none;animation:none}
.ag-sw:has(>.ai-pill--outline)>.hd-search{height:var(--ag-h)}
.ag-sw>.ai-pill--outline{height:var(--ag-h);flex:none;padding:0 18px 0 14px;font-size:15px}
.ag-mrow .ag-sw>.ai-pill--outline{font-size:14px;padding:0 16px 0 12px}
.ai-open{font-weight:var(--w-strong,600)}
.ai-cta{height:44px;justify-content:center;flex:1}
.prompts-container[data-dir="column"] .prompt-link{width:100%}
.pc-img .ai-pill{height:30px;font-size:12px;padding:0 10px 0 8px}
.cp-hero .ov{position:absolute!important}
/* html2canvas drops the puck shadow (negative spread): exports draw the lightest DS grey border instead */
body.exporting .ai-pill--soft{box-shadow:none;border:1px solid var(--border-subtle)}
body.exporting .cm-start h2 b{background:none;-webkit-background-clip:initial;background-clip:initial;color:#2E7F79}   /* html2canvas cannot clip a gradient to text */

/* ---------- search open: live suggestions + Top Sellers, with the agent's suggestions per option ---------- */
.ac{position:fixed;left:0;right:0;top:var(--ac-top,120px);bottom:0;background:#FFF;z-index:30;border-top:1px solid var(--border-subtle);padding:0 16px 24px;overflow-y:auto;overscroll-behavior:contain;font-size:14px;--ac-pad:16px}
@media(min-width:1024px){.ac{left:50%;right:auto;bottom:auto;transform:translateX(-50%);width:min(860px,calc(100% - 360px));max-height:calc(100vh - var(--ac-top,88px) - 24px);border:1px solid var(--border-subtle);border-top:0;border-radius:0 0 12px 12px;box-shadow:0 18px 40px -20px rgba(0,0,0,.25);--ac-pad:24px}}
html:has(body.searching),body.searching{overflow:hidden}
body.searching #hdrwrap{z-index:40;position:relative;background:#FFF}
body.searching #body,body.searching .pgfoot{pointer-events:none}
@media(min-width:1024px){body.searching #body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:25}}
.ac-terms{list-style:none;margin:0;padding:0}.ac-terms li{padding:9px 0;font-weight:300}.ac-terms li b{font-weight:600}
.ac-hr{height:1px;background:var(--border-subtle);margin:12px 0 16px}
.ac h4{font-size:16px;font-weight:600;margin:0 0 12px}
.ac-rail{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:12px;overflow:hidden}
@media(min-width:1024px){.ac-rail{grid-auto-columns:calc((100% - 48px)/4.6)}}
.ac-rail .pc-name{font-size:13px}
.ac-ai{display:flex;flex-direction:column;gap:10px}
.ac-ai .lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#444}
.ac-ai .set{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- shared AI chip (the prompt-link look, from the config chip styles) ---------- */

/* ---------- PDP prompts: mirrors <google-ai-prompts product-id direction> (shadow parts prompts-container / prompt-item / prompt-link) ---------- */
.gap-wrap{display:flex;flex-direction:column;gap:12px}
.gap-head{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600}
.prompts-container{display:flex;flex-wrap:wrap;gap:8px}
.prompts-container[data-dir="column"]{flex-direction:column;align-items:stretch}
.prompts-container[data-dir="column"] .prompt-link{width:100%}
.prompt-link__icon{display:inline-flex}

/* ---------- PDP ---------- */
.pdp{display:grid;gap:16px;padding-top:0}   /* gallery sits straight under the USP banner on mobile */
@media(min-width:1024px){.pdp{grid-template-columns:minmax(0,1fr) 450px;gap:64px;align-items:start;padding-top:16px}}
/* gallery = live debenhams.com (12 Oct) / Core PDP 2026: mobile peek rail (66% slides, 8px gap, from the edge) + 4px progress bar, no dots;
   desktop 100px thumb column + main image + white round arrows */
.galwrap{margin:0 -16px}
.gal{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .slide{flex:0 0 233px;height:350px;scroll-snap-align:start;position:relative;overflow:hidden;background:var(--surface-media)}
.gal .slide>img{display:block;width:100%;height:100%;object-fit:cover}
.pag{padding:16px 16px 0}
.pag .track{height:4px;background:var(--border-subtle);border-radius:var(--radius-pill);position:relative;overflow:hidden}
.pag .fill{position:absolute;inset:0 auto 0 0;width:25%;background:var(--text-primary);border-radius:var(--radius-pill);transition:width .2s}
.thumbs,.arrow{display:none}
.galmain{position:relative}
.onimg{position:absolute;z-index:2;left:8px;right:auto;bottom:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.galmain .onimg .ai-pill{height:32px;font-size:13px;padding:0 10px 0 8px;gap:4px}.galmain .onimg .ai-icon{width:16px!important;height:16px!important}
@media(min-width:1024px){
  .galwrap{margin:0;display:grid;grid-template-columns:100px minmax(0,1fr);gap:24px;align-items:start}
  .thumbs{display:flex;flex-direction:column;gap:8px}
  .thumbs button{width:100px;aspect-ratio:2/3;padding:0;background:var(--surface-media);overflow:hidden;border:0;cursor:pointer;opacity:.3;transition:opacity .2s}
  .thumbs button.on,.thumbs button:hover{opacity:1}   /* no outline: the selected thumb is full strength, the rest 30% */
  .thumbs img{display:block;width:100%;height:100%;object-fit:cover}
  .gal{overflow:hidden;scroll-snap-type:none;gap:0}
  .gal .slide{flex:0 0 100%;height:auto;aspect-ratio:2/3}
  .pag{display:none}
  .arrow{display:grid;place-items:center;position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:var(--radius-pill);background:#FFF;box-shadow:var(--shadow-tile);border:0;padding:0;cursor:pointer;z-index:3}
  .arrow img{width:16px;height:16px}.arrow.l{left:12px}.arrow.r{right:12px}
  .onimg{left:16px;right:16px;bottom:16px;gap:8px;flex-direction:row;align-items:center}
  .galmain .onimg .ai-pill{height:36px;font-size:14px;padding:0 16px 0 12px;gap:6px}.galmain .onimg .ai-icon{width:18px!important;height:18px!important}
}
.pdp>*{min-width:0}
.galwrap{min-width:0;max-width:calc(100% + 32px)}
@media(min-width:1024px){.galwrap{max-width:100%}}
.buy{display:flex;flex-direction:column;gap:16px}
.tchips{display:flex;gap:10px;flex-wrap:wrap}
.tr-chips{position:absolute;z-index:3;top:12px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.bl-chips{position:absolute;z-index:3;left:16px;bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
@media(min-width:1024px){.bl-chips{left:16px;bottom:16px}}
.ptags{position:absolute;z-index:3;right:16px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.ptags span{background:rgba(255,255,255,.9);color:#000;font:300 13px/1 var(--font-family-base);padding:7px 10px;border-radius:4px}   /* pinned to the gallery container, 16px from the screen edge — they stay put as the images scroll */
@media(min-width:1024px){.tr-chips{top:16px;right:16px}.ptags{right:16px;bottom:16px}.ptags span{font-size:14px;padding:8px 12px}}
.tchip{height:auto!important;padding:9px 14px!important;gap:6px!important;font-size:13px!important;font-weight:300!important}.tchip img{width:16px;height:12px}.tchip .ai-icon{width:16px!important;height:16px!important}
.prow .pname{margin-top:4px}
.wl-c{flex:none;display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:#FFF;box-shadow:var(--shadow-puck);cursor:pointer}.wl-c img{width:20px;height:20px;object-fit:contain}
.pc .pc-iconbtn{border-radius:50%!important;width:32px;height:32px;background:#FFF;box-shadow:var(--shadow-puck);border:0}.pc .pc-iconbtn img{width:16px;height:16px}
.buy .bd{width:100%}
.pbrand{font-size:16px;font-weight:600}.pname{font-size:16px;font-weight:300;margin-top:2px}
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ctas{display:flex;flex-direction:column;gap:8px}
.ctas2{display:flex;gap:8px}
/* live buy stack (debenhams.com 15 Oct): ADD TO BAG · PayPal Checkout · Apple Pay, 8px apart, all 50px; then the Unlimited banner, then Deliver+ */
.ctas .pay{width:100%;height:50px}.ctas .pay--paypal{gap:8px}.ctas .pp-co{font:500 20px/1 var(--font-family-base);color:#2C2E2F}
.unl{display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:4px;background:linear-gradient(100deg,#F2F2F2 0%,#C9C9C9 100%)}
.unl>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}.unl img{height:30px;width:auto;align-self:flex-start}
.unl p{margin:0;font-size:12px;line-height:normal;font-weight:var(--w-regular);color:#000}   /* same as the Deliver+ list items */
.unl button{flex:none;height:32px;padding:0 16px;border:0;border-radius:4px;background:#000;color:#FFF;font:600 14px var(--font-family-base);letter-spacing:.02em;cursor:pointer}.ctas2>*{flex:1}
.glance-blk h3,.sec-h{font-size:16px;font-weight:600;margin:0 0 12px}
.glance{margin:0}
.under{display:flex;flex-direction:column;gap:24px;margin-top:0}   /* same gap 4 (16px) as between the cards above */
@media(min-width:1024px){.under{margin-top:24px}}
.dbox{border:1px solid var(--border-subtle);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.dbox div{display:flex;gap:12px;align-items:flex-start}.dbox img{width:20px;height:20px;flex:none}
/* html2canvas cannot parse color-mix(): flatten the one the Deliver+ banner uses */
.dplus .foot{border-top-color:rgba(0,0,0,.25)}
.acc-set .acc{border-bottom:0;border-top:0}.acc-set .acc+.acc{border-top:1px solid var(--border-subtle)}   /* dividers only between rows */
.acc-set .acc:not(.open) .acc-b{display:none}.acc-set .acc-h{cursor:pointer}.acc-set .acc-h img{transition:transform .2s}
.acc-set .acc-b .glance{margin:0;padding:0}
.acc-set .acc-h{display:flex;width:100%;justify-content:space-between;align-items:center;padding:16px 0;font:600 15px var(--font-family-base);background:none;border:0;color:inherit}
.acc-set .acc-h img{width:16px;height:16px}.acc-set .acc.open .acc-h img{transform:rotate(180deg)}
.acc-set .acc-b{padding:0 0 16px;font-size:14px;font-weight:300;line-height:1.6}
.hd-search>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- PLP — live debenhams.com/categories/womens-partywear (15 Oct): breadcrumb · title + count · photo roundels · filters · 2-up / 5-up grid ---------- */
.plp-top{display:flex;flex-direction:column;gap:8px}
.plp-h{font-size:24px;font-weight:var(--w-strong);margin:8px 0 0}.plp-n{font-size:14px;color:var(--text-secondary);margin:0 0 4px}
@media(min-width:1024px){.plp-top{align-items:center;text-align:center}.plp-top .bc{align-self:flex-start}.plp-h{font-size:22px;margin-top:0}.plp-n{font-size:12px}}
.rnd{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 8px}
.rnd::-webkit-scrollbar{display:none}
.rnd .roundel{width:90px}.rnd .roundel i{width:90px;height:90px}.rnd .roundel i img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.rnd .roundel span{font-size:14px}
@media(min-width:1024px){.rnd{justify-content:center;gap:15px;margin:0;padding:8px 0 16px;overflow:visible}.rnd .roundel{width:120px}.rnd .roundel i{width:120px;height:120px}.rnd .roundel span{font-size:14px}}
.fbar{display:flex;align-items:center;gap:12px;padding:12px 0 4px;overflow-x:auto;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar .sf-ndd{font-size:16px;flex:none}
.fbar .fp{height:44px;padding:0 24px;border-radius:var(--radius-pill);border:1px solid var(--border-default);background:#FFF;font:400 16px var(--font-family-base);color:var(--text-primary);flex:none}
.fbar .more{font-size:16px;text-decoration:underline;white-space:nowrap;margin-left:4px}
.fbar .sort{margin-left:auto;width:220px}
.sf-split{margin:0 -16px}
/* mobile sort + filters = live debenhams.com (15 Oct markup): full-bleed Filters | Relevance bar, then NDD toggle (46×24, grey-4 track, minus knob) left and Size / Colour pills right */
.mfs{display:grid;grid-template-columns:1fr 1fr;margin:8px -16px 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
.mfs button{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px;background:none;border:0;font:300 16px var(--font-family-base);color:var(--text-primary)}
.mfs button+button{border-left:1px solid var(--border-subtle);padding-left:8px}
.mfs .fic{width:18px;height:18px;background:url("assets/ds/icons/lib/icons-filter.svg") center/contain no-repeat}
.mfs .ch{width:16px;height:16px;background:url("assets/ds/icons/lib/icons-down.svg") center/contain no-repeat}
.mff{display:flex;justify-content:space-between;align-items:center;margin:8px 0;padding:8px 0}
.mndd{display:flex;align-items:center;background:none;border:0;padding:0;cursor:pointer}.mndd svg{flex:none}
.mndd span{margin-left:8px;font:300 14px var(--font-family-base);color:var(--text-primary)}
.mfp{display:flex;flex-wrap:wrap;gap:8px}
.mfp span{display:flex;align-items:center;padding:4px 16px;border:1px solid var(--border-subtle);border-radius:9999px;font:300 14px/20px var(--font-family-base);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px;margin-top:16px}
@media(min-width:1024px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:32px 16px;margin-top:24px}}
.mff+.grid{margin-top:0}
.pc .pc-ndd{font-size:13px;margin-top:2px}.pc .pc-ndd img{width:18px;height:18px}
.pc .pc-badges{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.pc .badge{background:#FFF;border-color:#FFF;height:auto;padding:5px 10px;font-size:12px;border-radius:4px}
.pc .sw{display:flex;gap:6px;margin-top:4px}.pc .sw i{width:22px;height:22px;border-radius:4px;border:1px solid var(--border-subtle)}.pc .sw i.on{outline:1.5px solid #000;outline-offset:1px}
/* the agent's next best action: a row of the grid, placed below the filters or after row N (panel) */
.nba{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:8px;background:var(--surface-sunken)}
/* title + body sit together (gap 1, 4px), the prompts a clear gap 4 (16px) below */
.nba{gap:16px!important}.nba .grp{display:flex;flex-direction:column;gap:4px}
.nba h3{margin:0;font-size:18px;font-weight:600}.nba p{margin:0;font-size:14px;font-weight:300;line-height:1.4;color:var(--text-primary,#000)}
.nba .set{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nba .sep{display:none;width:1px;height:28px;background:var(--border-subtle);margin:0 4px}@media(min-width:1024px){.nba .sep{display:block}}
.grid .nba{grid-column:1/-1}
.pc-img .onimg.br{bottom:8px;right:8px;left:auto}

/* ---------- Home: the roundel row (first module) — smaller, padded ---------- */
.hm>.hm-m:first-child>.hm-row{padding:16px;gap:12px!important}
.hm>.hm-m:first-child>.hm-row{overflow-x:auto;scrollbar-width:none}.hm>.hm-m:first-child>.hm-row::-webkit-scrollbar{display:none}
.hm>.hm-m:first-child .hm-t{flex:0 0 80px!important;width:80px!important;margin-left:0!important}
@media(min-width:1024px){.hm>.hm-m:first-child>.hm-row{padding:24px 40px;gap:20px!important;justify-content:safe center}.hm>.hm-m:first-child .hm-t{flex:0 0 100px!important;width:100px!important}}
/* ---------- Home: custom prompts ---------- */
.cp-strip{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--ai-gradient);color:var(--text-primary);font-size:14px;text-align:center}
.cp-strip button{display:inline-flex;align-items:center;gap:6px;color:var(--text-primary);font:600 14px var(--font-family-base);text-decoration:underline;background:none;border:0;cursor:pointer}
.cp-mod{display:grid;grid-template-columns:1fr;margin:16px 0}
@media(min-width:1024px){.cp-mod{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);margin:24px 40px}}
.cp-mod .pan{background:#F4F4F2;padding:24px 16px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.cp-mod .grp{display:flex;flex-direction:column;gap:4px}

.cm-box .send{cursor:pointer;border:0;transition:background .15s}
.cm-b .mock{display:none}
.cm-tags{display:flex;flex-direction:column;gap:4px;margin-top:-8px}
.cm-tags span{font:400 10.5px/1.35 ui-monospace,Menlo,monospace;color:#2F6B63;background:#F2F8F7;border-radius:6px;padding:4px 8px}
.cm-tags span.custom{color:#8A5A00;background:#FFF6E5}.cm-tags b{font-weight:700}
/* ---------- agent start screen (the "Agent" option): the orb, a greeting, four capability cards, the config prompts as chips ---------- */
.cm-start{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 0 8px;gap:8px}
.cm-start h2{display:flex;flex-direction:column;align-items:flex-start;gap:12px}   /* sparkle above the greeting so the text lines up */
.cm .cm-start h2{font-size:20px;line-height:1.3}.cm .cm-start p{max-width:none;font-size:15px;color:var(--text-primary,#000)}
.orb{position:relative;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#CFF5EE 0%,#9DEDE2 28%,#70BEB3 62%,#2E7F79 100%);box-shadow:0 18px 40px -16px rgba(0,120,125,.55),inset 0 -14px 28px rgba(255,255,255,.35);display:grid;place-items:center;animation:orbFloat 5s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,rgba(157,237,226,0),rgba(157,237,226,.9),rgba(0,120,125,0) 60%);animation:orbSpin 6s linear infinite;mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px))}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 75%,rgba(255,255,255,.35),transparent 45%)}
.orb .ai-icon{width:40px!important;height:40px!important;position:relative;filter:brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.18))}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes orbSpin{to{transform:rotate(360deg)}}
.cm-start h2{margin:0;font-size:24px;font-weight:300;line-height:1.2;color:#222}
.cm-start h2 b{font-weight:600;background:linear-gradient(107deg,#2E7F79,#70BEB3 60%,#9DEDE2);-webkit-background-clip:text;background-clip:text;color:transparent}
.cm-start p{margin:0;max-width:340px;font-size:14px;font-weight:300;line-height:1.5;color:#555}
.cm-starters{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:8px;text-align:left}
.cm-starter{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:12px 14px;border-radius:14px;background:#F8F8F8;border:1px solid transparent;font:400 14px/1.3 var(--chat-messenger-font-family);color:#222;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.cm-starter:hover{background:#FFF;border-color:#70BEB3}
.cm-starter .ai-icon{flex:none}
.cm-start .cm-text{margin:8px 0 0;padding:0}
.cm.mob .cm-start h2{font-size:22px}
@media (prefers-reduced-motion:reduce){.orb,.orb::before,.hd-search .caret{animation:none}}
.cm.in .cm-start>*{animation:cmItem .4s cubic-bezier(.22,.9,.24,1) both}
.cm.in .cm-start>:nth-child(2){animation-delay:.2s}.cm.in .cm-start>:nth-child(3){animation-delay:.26s}.cm.in .cm-start>:nth-child(4){animation-delay:.32s}.cm.in .cm-start>:nth-child(5){animation-delay:.38s}

/* toast — where a link would go */
.ct{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#111;color:#fff;font:500 13px var(--font-family-base);padding:10px 16px;border-radius:8px;z-index:999;pointer-events:none;max-width:90vw;text-align:center}
.ct.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="ct" id="ct"></div>
<script src="assets/ds/delivery.js"></script>
<script src="assets/ds/subscribe.js"></script>
<script src="assets/ds/dplus-logos.js"></script>   <!-- Deliver+ lockups: the catalogue reads them when it loads -->
<script src="assets/ds/catalogue.js"></script>
<script src="projects/plp-alignment/data.js"></script>
<script src="assets/ds/usp-live.js"></script>
<script src="assets/ds/usp.js"></script>
<script src="projects/usp-banner/home.js"></script>
<script src="projects/shopping-agent/agent.js"></script>
<script>
const C=window.DG_CATALOGUE,V=(slug,i=0)=>{const c=C&&C.find(x=>x.slug===slug);return c?c.variants[i].html:''};
const strip=h=>h.replace(/ style="width:[^"]*"/,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const desk=()=>innerWidth>=1024;
const PR=()=>(window.PRODUCTS_ALL||{}).debenhams||[];
/* data.js product i shows p{i}.jpg up to 6, then p{i+1}.jpg (p7 is an unlisted coat) */
const IMG=i=>`projects/plp-alignment/img/debenhams/p${i<7?i:i+1}.jpg`;
const A='projects/shopping-agent/';

/* ---- state (the shell sends it; defaults here so the page also opens on its own) ---- */
let S={brand:'debenhams',page:'home',labels:false,on:{},launcher:'outIcon',start:'config',pdpPos:'belowCta',glance:true,pdpDir:'column',pdpHead:true,pdpAsk:true,
  pdpPrompts:['Does this fit true to size?','What shoes would go with this dress?','Is this suitable for a winter wedding?'],
  ssPos:'title',vtoPos:'title',chipPos:'title',chipKind:'similar',vtoMode:'agent',vtoLabel:'Virtual Stylist',nbaRow:0,nbaQ:'What’s the occasion?',nbaOpts:['Wedding guest','Party season','Workwear','Everyday'],
  acMode:'below',acChips:['Wedding guest dresses under £100','Midi dresses with sleeves','Dresses for a Christmas party','Petite occasion dresses'],
  cpPos:'module',search:false,chat:false,agent:{},focus:null};
try{const q=new URLSearchParams(location.search).get('s');if(q)S=Object.assign(S,JSON.parse(q))}catch(e){}   // URLSearchParams already decodes
const ON=f=>S.on[f]!==false;
let EXPORTING=false,BASE=null,CFG=null,CHAT={open:false,msgs:[]};

/* ---- the sparkle: the dev build's shopping-agent-sparkle path, gradient in the agent primary ---- */
let gid=0;
/* the DS AI icon (assets/ds/icons/ai.svg, Figma 27:37643) — every AI entry point */
function spk(sz=18){return `<i class="ai-icon" style="width:${sz}px;height:${sz}px"></i>`}
const E=()=>Object.assign({},AG.DEF,S.agent||{});
const ask=()=>'Ask '+E().name;
/* data-feat = the feature (panel navigation + jump-to highlight); data-q = the query sent to the agent (window.googleAgent.sendQuery) */
const F=(f,opt)=>`data-feat="${f}" data-tag="${esc(TAG[f]+(opt?' · '+opt:''))}"`;
const TAG={launcher:'Entry point',pdpPrompts:'PDP prompts',shopSimilar:'Shop similar',vto:'Virtual try-on',nba:'Next best action',autocomplete:'Autocomplete',custom:'Custom prompts'};
const L=(k,v)=>({launcher:{outIcon:'icon beside',outAsk:'Ask beside',icon:'header icon'},pdpPrompts:{belowCta:'A',aboveGlance:'B'},shopSimilar:{image:'A',cta:'B',card:'C'},vto:{image:'A',cta:'B'},autocomplete:{replace:'A',above:'B',below:'C'},custom:{module:'A',strip:'B',hero:'C'}}[k]||{})[v]||'';

/* ================= HEADER (DS header + USP drop-in) with the entry point per option =================
   outIcon = exposed search, the AI icon in a gradient-outline circle beside the field
   outAsk  = exposed search, a gradient-outline "Ask" pill beside the field
   icon    = mobile search is the header icon only; tapping it opens search, where the AI circle sits left of the X
   lift    = exposed search + AI circle; tapping the field slides it up over the logo row (mobile), giving the overlay the extra height
   Desktop search is always exposed; the button sits beside the field (icon → the circle).
   Search active (Search Figma 1012:2295) = an overlay: USP banners hidden, caret + camera + search in the field, X beside it. */
/* not exposed (mobile): the header has the search icon only; tapping it opens the search row with the field focused (keyboard up) */
const NI=['icon','niAsk','niLift'];
function header(){
  header.was=header.now;header.now=!!S.search;
  const d=desk(),lo=S.launcher,ni=NI.includes(lo)&&!d,exp=!ni||S.search;
  let h=strip(d?V('header',1):V('header',0)).replace(/ style="[^"]*border[^"]*"/,'');
  h=h.replace(/<div class="hd-usp">[\s\S]*?<\/div><\/div>$/,'</div>');
  const ph='Search Fashion, Home &amp; Beauty';   /* the live placeholder, both breakpoints */
  /* a real input: the native keyboard opens on tap; 16px on mobile so iOS does not zoom */
  const q=`<input class="srch-field" type="search" placeholder="${ph}" aria-label="Search" autocomplete="off" enterkeyhint="search" value="${esc(S.q||'')}">`;
  const ics='<span class="ics"><img src="assets/ds/icons/camera.svg" alt=""><img src="assets/ds/icons/search.svg" alt=""></span>';
  const circle=`<button class="ai-circle" ${F('launcher','AI icon beside search')} data-q="" aria-label="${ask()}"><i class="ai-icon"></i></button>`;
  const askPill=`<button class="ai-pill ai-pill--outline ag-ask" ${F('launcher','Ask beside search')} data-q="">${spk(18)}Ask</button>`;
  const btn=(lo==='outAsk'||lo==='niAsk')?askPill:circle;
  const X=`<button class="ag-x" data-closesearch="1" aria-label="Close search"><img src="assets/ds/icons/lib/icons-close.svg" alt="" onerror="this.replaceWith('✕')"></button>`;
  const sIcon='<button aria-label="Search"><img src="assets/ds/icons/search.svg" alt=""></button>';
  /* the button sits beside the field; while search is active the X is always there, and typing pushes the button out (#hdrwrap.typing) */
  const after=btn+(S.search?X:'');
  const lift=lo==='lift'&&S.search&&!d;
  const field=`<div class="ag-sw"><div class="hd-search" data-opensearch="1">${q}${ics}</div>${after}</div>`;
  if(d){
    h=h.replace(/<div class="hd-search">[\s\S]*?<\/span><\/div>/,field);
  }else{
    h=h.replace(sIcon,ni?`<button aria-label="Search" data-opensearch="1" class="hd-sicon${S.search?' off':''}"><img src="assets/ds/icons/search.svg" alt=""></button>`:'');
    if(exp)h=h.replace(/(<div class="hd-bar">[\s\S]*?<\/div><\/div>)/,'$1'+`<div class="ag-mrow">${field}</div>`);
  }
  /* USP banners stay put: the search panel fades in over them, so nothing on the page disappears instantly */
  h=h.replace(/<\/div>$/,`<div data-usp-banners data-usp-auto="${EXPORTING?0:5}"></div></div>`);
  const cls=[lift?'lifted'+(header.was?'':' lifting'):'',S.search&&!header.was&&!EXPORTING?'opening srch-in':'',!S.search&&header.was&&!EXPORTING?'srch-out':'',lo+'-lo',ni?'ni-lo':'',S.search&&S.q?'typing':''].filter(Boolean).join(' ');
  return `<div id="hdrwrap" class="${cls}">${h}${S.search?autocomplete():''}</div>`;
}

/* ================= SEARCH ACTIVE — Search Figma 1012:2295, re-ordered (Jake 15 Oct):
   Recent Searches (one scrolling row) · Popular Searches (one scrolling row) · "Need some help?" agent prompts (stacked) · Recently Viewed.
   An overlay under the header: the page behind does not scroll, and the panel ends at Recently Viewed. ================= */
function autocomplete(){
  const recent=['mens watches','living and home','clarins','hermes','hermes kelly'];
  const popular=['Sunglasses','Garden Furniture','Men’s Watches','Dresses','Wedding','Party Dresses'];
  const R=`<div class="ac-sec"><h4>Recent Searches</h4><div class="ac-chips ac-hs">${recent.map(r=>`<button class="ac-chip">${esc(r)}<img src="assets/ds/icons/lib/icons-close.svg" alt="" onerror="this.remove()"></button>`).join('')}</div></div>`;
  const Pp=`<div class="ac-sec"><h4>Popular Searches</h4><div class="ac-chips ac-hs">${popular.map(r=>`<button class="ac-chip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17l6.5-6.5 4 4L22 5"/><path d="M15 5h7v7"/></svg>${esc(r)}</button>`).join('')}</div></div>`;
  const AI=`<div class="ac-sec" ${F('autocomplete','Need some help?')}><h4>Need some help?</h4><div class="ac-prompts">${S.acChips.filter(Boolean).map(c=>`<button class="ai-pill ai-pill--soft ai-pill--wrap" data-q="${esc(c)}">${spk(14)}${esc(c)}</button>`).join('')}<button class="ai-pill ai-pill--outline ai-pill--wrap" data-q="Help me discover something new">${spk(14)}Help me discover</button></div></div>`;
  const rv=`<div class="ac-sec"><h4>Recently Viewed</h4><div class="ac-rv">${[1,21,5,24,31,27].map(i=>card(PR()[i],i,true)).join('')}</div></div>`;
  return `<div class="ac" id="ac">${R}${Pp}${AI}${rv}</div>`;
}

/* ================= product card (DS .pc) ================= */
function card(p,i,mini){
  if(!p)return '';const sale=p.was?' sale':'';
  const ss=!mini&&ON('shopSimilar')&&S.ssPos==='card'?`<span class="onimg br"><button class="ai-pill ai-pill--soft" ${F('shopSimilar','C · PLP card')} data-q="Shop similar" data-ctx="${esc(p.name)}">${spk(14,false)}Similar</button></span>`:'';
  return `<article class="pc pc--compact"><div class="pc-img"><img class="ph" src="${IMG(i)}" alt="" loading="lazy">
    ${mini?'':`<div class="pc-actions"><button class="pc-iconbtn" aria-label="Add to wishlist"><img src="assets/ds/icons/heart-16.svg" alt=""></button></div>`}${ss}</div>
    <div class="pc-info"><div class="pc-toprow"><div class="pc-titles">${p.brand?`<div class="pc-brand">${esc(p.brand)}</div>`:''}<div class="pc-name">${esc(p.name)}</div></div></div>
    <div class="pc-price${sale}"><span class="now">${esc(p.price)}</span>${p.was?`<span class="was">${esc(p.was)}</span>`:''}${p.pct?`<span class="pct">${esc(p.pct)}</span>`:''}</div></div></article>`;
}

/* ================= HOME — Debenhams live homepage (usp-banner/home.js, captured 06 Oct) + custom prompts ================= */
function home(){
  const d=desk(),doc=new DOMParser().parseFromString(renderHome('debenhams',d),'text/html'),hm=doc.querySelector('.hm'),mods=[...hm.children];
  if(ON('custom')){
    const chips=(S.cpChips||['Gifts for her under £50','Stocking fillers she’ll love','What do I get my dad?']).filter(Boolean);
    const set=chips.map(c=>`<button class="ai-pill ai-pill--soft ai-pill--wrap" data-q="${esc(c)}">${spk(14,false)}${esc(c)}</button>`).join('')+`<button class="ai-pill ai-pill--outline ai-pill--wrap" data-q="Help me find the perfect gift">${spk(14)}Help me choose</button>`;
    if(S.cpPos==='module'){const m=doc.createElement('div');m.innerHTML=`<div class="cp-mod" ${F('custom','A · module')}><div class="pan" style="background:${esc(S.cpBg||'#F4F4F2')};color:${esc(S.cpFg||'#000000')}"><div class="grp"><h3>${esc(S.cpTitle||'Gifting, sorted')}</h3><div class="sub">${esc(S.cpSub||('Ask '+E().name+' for ideas'))}</div></div><div class="set">${set}</div></div><img src="${S.cpImg||`projects/usp-banner/img/home/debenhams/wk38-debs-gifting-hp-homepage-aw-gifting-${d?'dt':'mb'}.webp`}" alt=""></div>`;mods[1]&&mods[1].after(m.firstChild)}
    if(S.cpPos==='strip'){const m=doc.createElement('div');m.innerHTML=`<div class="cp-strip" ${F('custom','B · strip')}><span>Gift shopping for someone special?</span><button data-q="Help me find the perfect gift">${spk(15)}Ask ${esc(E().name)} for ideas</button></div>`;hm.prepend(m.firstChild)}
    if(S.cpPos==='hero'&&mods[1]){mods[1].classList.add('cp-hero');const o=doc.createElement('div');o.className='ov';o.setAttribute('data-feat','custom');o.setAttribute('data-tag','Custom prompts · C · on hero');o.innerHTML=set;mods[1].prepend(o)}
  }
  return hm.outerHTML;
}

/* ================= PLP — Women's Partywear as live (15 Oct): roundels, filters, 2-up / 5-up grid, "Get It Tomorrow", ad badges; next best action below the filters or after row N ================= */
const CATS=[['Party Dresses',1],['Party Jumpsuits',21],['Party Tops',5],['Faux Fur Coats',7],['Party Shoes & Heels',6],['Accessories',28],['Sequin Outfits',24],['Velvet Outfits',31],['Lace Outfits',29]];
function pcard(p,i,k){
  if(!p)return '';const sale=p.was?' sale':'';
  const badges=[k%5===2||k%5===4?'As Seen In Our Ad':'',p.tag||''].filter(Boolean);
  const ss=ON('shopSimilar')&&S.ssPos==='card'?`<span class="onimg br"><button class="ai-pill ai-pill--soft" ${F('shopSimilar','C · PLP card')} data-q="Shop similar" data-ctx="${esc(p.name)}">${spk(14)}Similar</button></span>`:'';
  const sw=k%3===1?`<div class="sw"><i class="on" style="background:#1A1A1A"></i><i style="background:#C9BFA8"></i>${k%2?'<i style="background:#6B2A3A"></i>':''}</div>`:'';
  return `<article class="pc pc--compact"><div class="pc-img"><img class="ph" src="${IMG(i)}" alt="" loading="lazy">
    <div class="pc-actions"><button class="pc-iconbtn" aria-label="Add to wishlist"><img src="assets/ds/icons/heart-16.svg" alt=""></button></div>
    ${badges.length?`<div class="pc-badges">${badges.map(b=>`<span class="badge">${esc(b)}</span>`).join('')}</div>`:''}${ss}</div>
    <div class="pc-info"><div class="pc-toprow"><div class="pc-titles">${p.brand?`<div class="pc-brand">${esc(p.brand)}</div>`:''}<div class="pc-name">${esc(p.name)}</div></div></div>
    <div class="pc-price${sale}"><span class="now">${esc(p.price)}</span>${p.was?`<span class="was">${esc(p.was)}</span>`:''}${p.pct?`<span class="pct">${esc(p.pct)}</span>`:''}</div>${sw}
    ${p.ndd?`<div class="pc-ndd"><img src="assets/ds/icons/lib/icons-delivery-fast.svg" alt="">Get It Tomorrow</div>`:''}</div></article>`;
}
function plp(){
  const d=desk(),cols=d?5:2,ids=[1,21,24,29,31,27,5,23,6,9,28,8,0,3,2,10,12,4,11,13];
  const nba=ON('nba')?`<div class="nba" ${F('nba',S.nbaRow?'after row '+S.nbaRow:'below filters')}><div class="grp"><h3>${esc(S.nbaQ)}</h3><p>Select an option to start a chat with ${esc(E().name)}</p></div><div class="set">${S.nbaOpts.filter(Boolean).map(o=>`<button class="ai-pill ai-pill--soft ai-pill--wrap" data-q="${esc(S.nbaQ+' → '+o)}">${spk(14)}${esc(o)}</button>`).join('')}<span class="sep"></span><button class="ai-pill ai-pill--outline ai-pill--wrap" data-q="Help me decide what to wear">${spk(14)}Help me decide</button></div></div>`:'';
  const cards=ids.map((i,k)=>pcard(PR()[i],i,k));
  const row=+S.nbaRow||0;
  if(nba&&row>0)cards.splice(Math.min(row*cols,cards.length),0,nba);
  const bc=`<nav class="bc" aria-label="Breadcrumb"><a href="#">Home</a><span class="sep">/</span><a href="#">Womens</a><span class="sep">/</span><a href="#">Shop By Collection</a><span class="sep">/</span><span class="cur">Partywear</span></nav>`;
  const rnd=`<div class="rnd">${CATS.map(([n,i])=>`<a class="roundel" href="#"><i><img src="${IMG(i)}" alt=""></i><span>${n}</span></a>`).join('')}</div>`;
  const filters=d
    ?`<div class="fbar"><span class="sf-ndd"><span class="track"></span>Next Day Delivery</span>${['Category','Size','Colour','Style'].map(f=>`<button class="sf-dd">${f}<i></i></button>`).join('')}<a class="more" href="#">Show more filters</a><button class="sf-dd sort">Relevance<i></i></button></div>`
    :`<div class="mfs"><button><span>Filters</span><span class="fic"></span></button><button><span>Relevance</span><i class="ch"></i></button></div>
      <div class="mff"><button class="mndd" aria-pressed="false"><svg viewBox="0 0 46 24" width="46" height="24"><rect width="46" height="24" rx="12" fill="#888888"/><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M7 12H17" stroke="#000" stroke-linecap="round"/></svg><span>Next Day Delivery</span></button>
      <div class="mfp"><span>Size</span><span>Colour</span></div></div>`;
  return `<div class="wrap"><div class="plp-top">${bc}<h1 class="plp-h">Women's Partywear</h1><p class="plp-n">1,000+ products</p>${rnd}</div>${filters}${nba&&row===0?`<div style="margin-top:12px">${nba}</div>`:''}<div class="grid">${cards.join('')}</div></div>`;
}

/* ================= PDP — Debenhams live order (12 Oct): gallery · brand / name · price · colour · size · ADD TO BAG · Deliver+ · delivery · BNPL · At a glance · accordions ================= */
function pdp(){
  const d=desk(),p=PR()[1];
  const glance=`<div class="glance-blk"><h3>At a Glance</h3>${V('at-a-glance',0).replace(/<li><i>✓<\/i>Regular fit<\/li><li><i>✓<\/i>Machine washable<\/li><li><i>✓<\/i>Recycled polyester<\/li>/,['Delicate lace bodice','Pleated midi skirt','Shirt collar and button front','Long sleeves','Regular fit'].map(t=>`<li><i>✓</i>${t}</li>`).join(''))}</div>`;
  const prompts=ON('pdpPrompts')?`<div class="gap-wrap" ${F('pdpPrompts',L('pdpPrompts',S.pdpPos)+' · '+{aboveGlance:'above At a Glance',belowCta:'below the buy buttons'}[S.pdpPos]+' · '+S.pdpDir)}>
    ${S.pdpHead?`<div class="gap-head">${spk(18)}${ask()}</div>`:''}
    <div class="prompts-container" data-dir="${S.pdpDir}" data-product-id="GZZ66300">${S.pdpPrompts.filter(Boolean).map(t=>`<div class="prompt-item"><button class="prompt-link ai-pill ai-pill--soft ai-pill--wrap" data-q="${esc(t)}" aria-label="${esc(t)}"><span class="prompt-link__icon">${spk(16,false)}</span><span class="prompt-link__text">${esc(t)}</span></button></div>`).join('')}
    ${S.pdpAsk?`<div class="prompt-item"><button class="prompt-link ai-pill ai-pill--outline ai-pill--wrap" data-q=""><span class="prompt-link__icon">${spk(16)}</span><span class="prompt-link__text">Ask anything</span></button></div>`:''}</div></div>`:'';
  const ssBtn=ON('shopSimilar')?`<button class="ai-pill ai-pill--soft" ${F('shopSimilar','A · on image')} data-q="Shop similar">${spk(16)}Shop similar</button>`:'';
  const vtoBtn=ON('vto')?`<button class="ai-pill ai-pill--soft vs-chip" ${F('vto','A · on image')} data-q="Virtual Stylist" data-vto="1"><img src="${A}img/hanger.svg" alt="">Virtual Stylist</button>`:'';
  /* one product shot in the data set: four crops of it stand in for the live four-image gallery */
  const SH=['','object-position:50% 12%;transform:scale(1.7);transform-origin:50% 18%','object-position:50% 50%;transform:scale(1.35)','object-position:50% 95%;transform:scale(1.6);transform-origin:50% 92%'];

const TEXTS=[

  q=>`Here are a few I think you’ll love for “${esc(q)}”, all in your size:${ctx('Size 10','Your style')}${car([1,21,24,29])}${qr('Under £50','Show me more like these')}`,

function reply(q,vto,typed){

  if(window.DG_uspMount)DG_uspMount();
  galSync();wirePdp();
  if(S.chat&&!CHAT.open)CHAT.open=true;if(!S.chat&&CHAT.open&&!CHAT.user)CHAT.open=false;
  drawChat();
  if(S.focus&&S.focus.n!==render._n){render._n=S.focus.n;const el=document.querySelector(`[data-feat="${S.focus.f}"]`);if(el&&el.closest('#ac')){scrollTo(0,0);document.getElementById('ac').scrollTop=0}else if(el)el.scrollIntoView({block:'center',behavior:'auto'})}   /* instant, no highlight; search panel features open from the top */
}
fetch('projects/shopping-agent/base-config.json').then(r=>r.json()).then(b=>{BASE=b;CFG=AG.build(BASE,S.agent);render();parent.postMessage({protoReady:1},'*')});
/* re-render on a real width change only: the phone keyboard resizes the viewport, and a re-render would replace the focused input (keyboard drops) */
let rz,lastW=innerWidth;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const a=document.activeElement;if(innerWidth===lastW||(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)))return;lastW=innerWidth;render()},150)});
/* focus the search field in the same tap that opened it, so the keyboard comes up without a second tap */
function focusSearch(){const i=document.querySelector('#hdrwrap .srch-field');if(!i)return;try{i.focus({preventScroll:true})}catch(e){i.focus()}const n=i.value.length;try{i.setSelectionRange(n,n)}catch(e){}}
document.addEventListener('input',e=>{if(!e.target.classList||!e.target.classList.contains('srch-field'))return;S.q=e.target.value;const hw=document.getElementById('hdrwrap');if(hw)hw.classList.toggle('typing',!!S.q.trim())});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('srch-field')&&e.target.value.trim()){e.preventDefault();e.target.blur();const t=document.getElementById('ct');t.textContent='Search results for “'+e.target.value.trim()+'”';t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2000)}});
addEventListener('message',e=>{const d=e.data||{};
  if(d.protoSet){S=Object.assign(S,d.protoSet);EXPORTING=!!d.exporting;if(BASE)CFG=AG.build(BASE,S.agent);if(BASE)render()}
  if(d.protoPing)parent.postMessage({protoPong:1,h:document.documentElement.scrollHeight},'*')});
/* gallery: progress bar follows the rail; thumbs + arrows step it (desktop) */
function galIdx(){const g=document.getElementById('gal');if(!g)return 0;const s=g.querySelector('.slide');const w=s.offsetWidth+(parseFloat(getComputedStyle(g).columnGap)||0);return Math.min(Math.round(g.scrollLeft/w),g.children.length-1)}
function galSync(){const g=document.getElementById('gal'),f=document.getElementById('pagfill');if(!g||!f)return;const i=galIdx(),n=g.children.length;f.style.width=((i+1)/n*100)+'%';document.querySelectorAll('.thumbs button').forEach((b,k)=>b.classList.toggle('on',k===i))}
function galGo(i){const g=document.getElementById('gal');if(!g)return;const n=g.children.length,k=Math.max(0,Math.min(i,n-1));g.scrollTo({left:g.children[k].offsetLeft-g.children[0].offsetLeft,behavior:EXPORTING?'auto':'smooth'})}
document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='gal')requestAnimationFrame(galSync)},true);
document.addEventListener('click',e=>{const t=e.target.closest('[data-slide]');if(t){e.stopPropagation();galGo(+t.dataset.slide);return}const a=e.target.closest('[data-step]');if(a){e.stopPropagation();galGo(galIdx()+(+a.dataset.step))}},true);
document.addEventListener('submit',e=>{if(e.target.id==='cmform'){e.preventDefault();send()}});
document.addEventListener('input',e=>{if(e.target.id==='cminput'){CHAT.draft=e.target.value;const b=document.getElementById('cmsend');if(b)b.classList.toggle('on',!!e.target.value.trim())}});
/* every agent entry point opens the chat with its query (window.googleAgent.sendQuery(q) in production) */
document.addEventListener('click',e=>{
  if(!S.search&&e.target.closest('[data-opensearch]')){scrollTo(0,0);S.search=true;S.q='';parent.postMessage({protoSearch:true},'*');render();focusSearch();return}
  if(e.target.closest('[data-closesearch]')){const hw=document.getElementById('hdrwrap');
    const done=()=>{document.body.classList.remove('closing-search');S.search=false;S.q='';parent.postMessage({protoSearch:false},'*');render()};
    if(EXPORTING||matchMedia('(prefers-reduced-motion:reduce)').matches||!hw)return done();
    if(hw.classList.contains('closing'))return;hw.classList.remove('srch-in');hw.classList.add('closing');document.body.classList.add('closing-search');setTimeout(done,240);return}
  {const ah=e.target.closest('.acc-set .acc-h');if(ah){e.preventDefault();ah.parentNode.classList.toggle('open');return}}
  if(e.target.closest('#cmform'))return;
  const qb=e.target.closest('[data-q]');
  if(qb&&qb.dataset.vto&&S.vtoMode==='own'){e.preventDefault();const t=document.getElementById('ct');t.textContent='Opens the Debenhams Virtual Stylist (our own VTO)';t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200);return}
  if(qb){e.preventDefault();CHAT.user=true;const q=qb.dataset.q;openChat(q?(qb.dataset.ctx&&/similar/i.test(q)?q:q):'',!!qb.dataset.vto);return}
  if(e.target.closest('[data-close]')){CHAT.user=false;CHAT.msgs=[];closeChat();return}
  const a=e.target.closest('a[data-href],a[href]');
  if(a){e.preventDefault();const t=document.getElementById('ct');t.textContent='Link → '+(a.dataset.href||a.getAttribute('href'));t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
  else if(e.target.closest('button'))e.preventDefault()});
</script>
</body>
