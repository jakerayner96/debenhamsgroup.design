<!DOCTYPE html>
<html lang="en" data-brand="debenhams">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../../">
<title>Shopping agent · Debenhams</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ds/tokens.css">
<link rel="stylesheet" href="assets/ds/components.css">
<style>
/* Page scaffolding + the shopping-agent surfaces. Site pieces are DS components (catalogue.js / components.css).
   Agent pieces: the chat window reads the salesAgentConfig style keys by their own names (--chat-messenger-*),
   so what you see here is what the config file sets. PDP prompts mirror <google-ai-prompts> (prompts-container / prompt-link). */
*{box-sizing:border-box}html,body{margin:0;background:var(--surface-page)}
body{font-family:var(--font-family-base);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.wrap{padding:0 16px}@media(min-width:1024px){.wrap{padding:0 40px;max-width:1440px;margin:0 auto}}
.h1{font-size:20px;font-weight:var(--w-strong);margin:12px 0 4px}
@media(min-width:1024px){.h1{font-size:28px}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 8px}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 16px}}
.pc{width:auto!important}
.pgfoot{margin-top:40px}.pgfoot>*,.pgfoot>*>*{width:100%!important;max-width:none!important}
#hdrwrap{position:relative;z-index:20}
.hd-search span.q{color:var(--text-primary)}

/* ---------- the sparkle (dev build: shopping-agent-sparkle, gradient primary-dark → primary → 45% white) ---------- */
.spk{display:inline-block;flex:none;vertical-align:middle}

/* ---------- entry point: Ask Deb ---------- */

/* ---------- AI: DS .ai-pill (assets/ds/components.css) + AI icon; layout only here ---------- */
.ag-sw{flex:1;display:flex;align-items:center;gap:12px;max-width:940px;margin:0 auto;min-width:0}
.ag-sw .hd-search{margin:0;max-width:none}
.hd-search.ag-has{padding-right:8px}.hd-search.ag-has>span:first-child{flex:1}
.ag-mrow{padding:0 16px 12px}.ag-mrow .hd-search{height:44px;padding:0 6px 0 16px;font-size:14px}
.ag-mrow .ai-pill{height:32px;font-size:13px;padding:0 12px 0 10px}
.ai-open{font-weight:var(--w-strong,600)}
.ai-cta{height:44px;justify-content:center;flex:1}
.prompts-container[data-dir="column"] .prompt-link{width:100%}
.pc-img .ai-pill{height:30px;font-size:12px;padding:0 10px 0 8px}
.cp-hero .ov{position:absolute!important}
/* html2canvas drops the puck shadow (negative spread): exports draw the lightest DS grey border instead */
body.exporting .ai-pill--soft{box-shadow:none;border:1px solid var(--border-subtle)}

/* ---------- search open: live suggestions + Top Sellers, with the agent's suggestions per option ---------- */
.ac{position:absolute;left:0;right:0;top:100%;background:#FFF;z-index:30;border-top:1px solid var(--border-subtle);padding:12px 16px 24px;min-height:calc(100vh - 100%);font-size:14px}
@media(min-width:1024px){.ac{left:50%;transform:translateX(-50%);top:76px;width:min(800px,calc(100% - 400px));min-height:0;border:1px solid var(--border-subtle);padding:16px 24px 32px}}
.ac-terms{list-style:none;margin:0;padding:0}.ac-terms li{padding:9px 0;font-weight:300}.ac-terms li b{font-weight:600}
.ac-hr{height:1px;background:var(--border-subtle);margin:12px 0 16px}
.ac h4{font-size:16px;font-weight:600;margin:0 0 12px}
.ac-rail{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:12px;overflow:hidden}
@media(min-width:1024px){.ac-rail{grid-auto-columns:calc((100% - 48px)/4.6)}}
.ac-rail .pc-name{font-size:13px}
.ac-ai{display:flex;flex-direction:column;gap:10px}
.ac-ai .lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#444}
.ac-ai .set{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- shared AI chip (the prompt-link look, from the config chip styles) ---------- */

/* ---------- PDP prompts: mirrors <google-ai-prompts product-id direction> (shadow parts prompts-container / prompt-item / prompt-link) ---------- */
.gap-wrap{display:flex;flex-direction:column;gap:12px}
.gap-head{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600}
.prompts-container{display:flex;flex-wrap:wrap;gap:8px}
.prompts-container[data-dir="column"]{flex-direction:column;align-items:stretch}
.prompts-container[data-dir="column"] .prompt-link{width:100%}
.prompt-link__icon{display:inline-flex}

/* ---------- PDP ---------- */
.pdp{display:grid;gap:16px;padding-top:8px}
@media(min-width:1024px){.pdp{grid-template-columns:minmax(0,1fr) 450px;gap:64px;align-items:start;padding-top:16px}}
/* gallery = live debenhams.com (12 Oct) / Core PDP 2026: mobile peek rail (66% slides, 8px gap, from the edge) + 4px progress bar, no dots;
   desktop 100px thumb column + main image + white round arrows */
.galwrap{margin:0 -16px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .slide{flex:0 0 66%;aspect-ratio:2/3;scroll-snap-align:start;position:relative;overflow:hidden;background:var(--surface-media)}
.gal .slide img{display:block;width:100%;height:100%;object-fit:cover}
.pag{padding:16px 16px 0}
.pag .track{height:4px;background:var(--border-subtle);border-radius:var(--radius-pill);position:relative;overflow:hidden}
.pag .fill{position:absolute;inset:0 auto 0 0;width:25%;background:var(--text-primary);border-radius:var(--radius-pill);transition:width .2s}
.thumbs,.arrow{display:none}
.galmain{position:relative}
.onimg{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:nowrap;gap:6px}
.galmain .onimg .ai-pill{height:32px;font-size:13px;padding:0 10px 0 8px;gap:4px}.galmain .onimg .ai-icon{width:16px!important;height:16px!important}
@media(min-width:1024px){
  .galwrap{margin:0;display:grid;grid-template-columns:100px minmax(0,1fr);gap:24px;align-items:start}
  .thumbs{display:flex;flex-direction:column;gap:8px}
  .thumbs button{width:100px;aspect-ratio:2/3;padding:0;background:var(--surface-media);overflow:hidden;border:2px solid transparent;cursor:pointer}
  .thumbs button.on{border-color:var(--text-primary)}
  .thumbs img{display:block;width:100%;height:100%;object-fit:cover}
  .gal{overflow:hidden;scroll-snap-type:none;gap:0}
  .gal .slide{flex:0 0 100%}
  .pag{display:none}
  .arrow{display:grid;place-items:center;position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:var(--radius-pill);background:#FFF;box-shadow:var(--shadow-tile);border:0;padding:0;cursor:pointer;z-index:3}
  .arrow img{width:16px;height:16px}.arrow.l{left:12px}.arrow.r{right:12px}
  .onimg{left:16px;right:16px;bottom:16px;gap:8px}
  .galmain .onimg .ai-pill{height:36px;font-size:14px;padding:0 16px 0 12px;gap:6px}.galmain .onimg .ai-icon{width:18px!important;height:18px!important}
}
.buy{display:flex;flex-direction:column;gap:16px}
.buy .bd{width:100%}
.pbrand{font-size:16px;font-weight:600}.pname{font-size:16px;font-weight:300;margin-top:2px}
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ctas{display:flex;flex-direction:column;gap:8px}
.ctas2{display:flex;gap:8px}.ctas2>*{flex:1}
.glance-blk h3,.sec-h{font-size:16px;font-weight:600;margin:0 0 12px}
.glance{margin:0}
.under{display:flex;flex-direction:column;gap:24px;margin-top:24px}
.dbox{border:1px solid var(--border-subtle);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.dbox div{display:flex;gap:12px;align-items:flex-start}.dbox img{width:20px;height:20px;flex:none}
/* html2canvas cannot parse color-mix(): flatten the one the Deliver+ banner uses */
.dplus .foot{border-top-color:rgba(0,0,0,.25)}
.acc-set .acc{border-bottom:1px solid var(--border-subtle)}
.acc-set .acc-h{display:flex;width:100%;justify-content:space-between;align-items:center;padding:16px 0;font:600 15px var(--font-family-base);background:none;border:0;color:inherit}
.acc-set .acc-h img{width:16px;height:16px}.acc-set .acc.open .acc-h img{transform:rotate(180deg)}
.acc-set .acc-b{padding:0 0 16px;font-size:14px;font-weight:300;line-height:1.6}
.hd-search>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- PLP ---------- */
.plp-top{display:flex;flex-direction:column;gap:12px}
.pcats{display:flex;gap:8px;overflow:hidden}
.nba{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:8px;background:var(--surface-sunken)}
.nba h3{margin:0;font-size:18px;font-weight:600}.nba p{margin:0;font-size:12px;color:#555}
.nba .set{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nba .sep{width:1px;height:28px;background:var(--border-subtle);margin:0 4px}
.grid .nba{grid-column:1/-1}
.pc-img .onimg.br{bottom:8px;right:8px;left:auto}

/* ---------- Home: custom prompts ---------- */
.cp-strip{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--ai-gradient);color:var(--text-primary);font-size:14px;text-align:center}
.cp-strip button{display:inline-flex;align-items:center;gap:6px;color:var(--text-primary);font:600 14px var(--font-family-base);text-decoration:underline;background:none;border:0;cursor:pointer}
.cp-mod{display:grid;grid-template-columns:1fr;margin:16px 0}
@media(min-width:1024px){.cp-mod{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);margin:24px 40px}}
.cp-mod .pan{background:#F4F4F2;padding:24px 16px;display:flex;flex-direction:column;gap:8px;justify-content:center}
@media(min-width:1024px){.cp-mod .pan{padding:40px}}
.cp-mod h3{margin:0;font-size:26px;font-weight:300}.cp-mod .sub{font-size:16px;color:#333;margin-bottom:8px}
.cp-mod .set{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.cp-mod img{display:block;width:100%;height:100%;object-fit:cover;min-height:220px}
.cp-hero{position:relative}
.cp-hero .ov{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:3}
@media(min-width:1024px){.cp-hero .ov{left:48px;top:48px}}

/* ---------- jump-to highlight (panel navigation) ---------- */
.flash{animation:flash 1.6s ease 1}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(13,153,255,0)}25%,60%{box-shadow:0 0 0 6px rgba(13,153,255,.45)}}

/* ============ CHAT WINDOW — every value from salesAgentConfig.payload.style (set on .cm as custom properties) ============ */
.cm-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90}
/* open / close motion: desktop slides in from the right over a fading scrim, mobile rises from the bottom; the header blocks
   (T&Cs, hero, intro, prompts) follow in a short stagger. Only on the open itself, never on re-renders; off when exporting / reduced motion */
.cm-scrim.in{animation:cmFade .32s ease both}.cm-scrim.out{animation:cmFade .26s ease reverse both}
.cm.in{animation:cmSlide .42s cubic-bezier(.22,.9,.24,1) both}.cm.out{animation:cmSlideOut .26s cubic-bezier(.4,0,1,1) both}
.cm.mob.in{animation-name:cmRise}.cm.mob.out{animation-name:cmSink}
.cm.in .cm-tb,.cm.in .cm-body>*,.cm.in .cm-in{animation:cmItem .4s cubic-bezier(.22,.9,.24,1) both}
.cm.in .cm-tb{animation-delay:.12s}.cm.in .cm-body>:nth-child(1){animation-delay:.16s}.cm.in .cm-body>:nth-child(2){animation-delay:.21s}
.cm.in .cm-body>:nth-child(3){animation-delay:.26s}.cm.in .cm-body>:nth-child(n+4){animation-delay:.31s}.cm.in .cm-in{animation-delay:.3s}
.cm.in .cm-zero .pr button{animation:cmItem .36s cubic-bezier(.22,.9,.24,1) both}
.cm.in .cm-zero .pr button:nth-child(1){animation-delay:.34s}.cm.in .cm-zero .pr button:nth-child(2){animation-delay:.38s}.cm.in .cm-zero .pr button:nth-child(3){animation-delay:.42s}.cm.in .cm-zero .pr button:nth-child(n+4){animation-delay:.46s}
@keyframes cmFade{from{opacity:0}to{opacity:1}}
@keyframes cmSlide{from{transform:translateX(100%)}to{transform:none}}
@keyframes cmSlideOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes cmRise{from{transform:translateY(100%)}to{transform:none}}
@keyframes cmSink{from{transform:none}to{transform:translateY(100%)}}
@keyframes cmItem{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cm.in,.cm.out,.cm-scrim.in,.cm-scrim.out,.cm.in *{animation:none!important}}

<script>
const C=window.DG_CATALOGUE,V=(slug,i=0)=>{const c=C&&C.find(x=>x.slug===slug);return c?c.variants[i].html:''};
const strip=h=>h.replace(/ style="width:[^"]*"/,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const desk=()=>innerWidth>=1024;
const PR=()=>(window.PRODUCTS_ALL||{}).debenhams||[];
/* data.js product i shows p{i}.jpg up to 6, then p{i+1}.jpg (p7 is an unlisted coat) */
const IMG=i=>`projects/plp-alignment/img/debenhams/p${i<7?i:i+1}.jpg`;
const A='projects/shopping-agent/';

/* ---- state (the shell sends it; defaults here so the page also opens on its own) ---- */
let S={brand:'debenhams',page:'pdp',on:{},launcher:'in',msearch:'exposed',pdpPos:'glance',pdpDir:'column',pdpHead:true,pdpAsk:true,
  pdpPrompts:['Does this fit true to size?','What shoes would go with this dress?','Is this suitable for a winter wedding?'],
  ssPos:'image',vtoPos:'image',vtoLabel:'Try it on',nbaPos:'top',nbaQ:'What’s the occasion?',nbaOpts:['Wedding guest','Party season','Workwear','Everyday'],
  acMode:'below',acChips:['Wedding guest dresses under £100','Midi dresses with sleeves','Dresses for a Christmas party','Petite occasion dresses'],
  cpPos:'module',search:false,chat:false,agent:{},focus:null};
try{const q=new URLSearchParams(location.search).get('s');if(q)S=Object.assign(S,JSON.parse(q))}catch(e){}   // URLSearchParams already decodes
const ON=f=>S.on[f]!==false;
let EXPORTING=false,BASE=null,CFG=null,CHAT={open:false,msgs:[]};

/* ---- the sparkle: the dev build's shopping-agent-sparkle path, gradient in the agent primary ---- */
let gid=0;
/* the DS AI icon (assets/ds/icons/ai.svg, Figma 27:37643) — every AI entry point */
function spk(sz=18){return `<i class="ai-icon" style="width:${sz}px;height:${sz}px"></i>`}
const E=()=>Object.assign({},AG.DEF,S.agent||{});
const ask=()=>'Ask '+E().name;
/* data-feat = the feature (panel navigation + jump-to highlight); data-q = the query sent to the agent (window.googleAgent.sendQuery) */
const F=(f,opt)=>`data-feat="${f}" data-tag="${esc(TAG[f]+(opt?' · '+opt:''))}"`;
const TAG={launcher:'Entry point',pdpPrompts:'PDP prompts',shopSimilar:'Shop similar',vto:'Virtual try-on',nba:'Next best action',autocomplete:'Autocomplete',custom:'Custom prompts'};
const L=(k,v)=>({launcher:{in:'1',out:'2'},pdpPrompts:{glance:'A',aboveCta:'B',belowCta:'C'},shopSimilar:{image:'A',cta:'B',card:'C'},vto:{image:'A',cta:'B'},nba:{top:'A',filter:'B',grid:'C'},autocomplete:{replace:'A',above:'B',below:'C'},custom:{module:'A',strip:'B',hero:'C'}}[k]||{})[v]||'';

/* ================= HEADER (DS header + USP drop-in) with the entry point per option ================= */
function header(){
  /* entry point: 1 = inside the search box (white pill, no outline) · 2 = outside it (gradient-outline pill).
     mobile search: exposed (field under the bar; no search icon in the header or the field) · in the header icons (AI icon beside search). Desktop is always exposed. */
  const d=desk(),out=S.launcher==='out',exp=S.msearch!=='icon',on=ON('launcher');
  let h=strip(d?V('header',1):V('header',0)).replace(/ style="[^"]*border[^"]*"/,'');
  h=h.replace(/<div class="hd-usp">[\s\S]*?<\/div><\/div>$/,'</div>');
  const q=S.search?'<span class="q">dress</span>':'<span>Search Fashion, Home &amp; Beauty</span>';
  const pill=cls=>`<button class="ai-pill ${cls}" ${F('launcher',out?'2 · outside search':'1 · inside search')} data-q="">${spk(18)}${ask()}</button>`;
  const sIcon='<button aria-label="Search"><img src="assets/ds/icons/search.svg" alt=""></button>';
  if(d){
    h=h.replace('<span>Search over 10,000+ brands...</span>',q);
    if(on&&!out)h=h.replace('<div class="hd-search">','<div class="hd-search ag-has">').replace(/(<span class="ics">[\s\S]*?<\/span>)/,'$1'+pill(''));
    if(on&&out)h=h.replace(/(<div class="hd-search">[\s\S]*?<\/span><\/div>)/,'<div class="ag-sw">$1'+pill('ai-pill--outline')+'</div>');
  }else{
    if(exp)h=h.replace(sIcon,'');
    else if(on)h=h.replace(sIcon,`<button class="ai-iconbtn" ${F('launcher','header icon')} data-q="" aria-label="${ask()}"><i class="ai-icon"></i></button>`+sIcon);
    if(exp||S.search){
      const inside=on&&!out&&exp,beside=on&&out&&exp;
      const row=`<div class="ag-mrow"><div class="ag-sw"><div class="hd-search${inside?' ag-has':''}">${q}${exp?'':'<span class="ics"><img src="assets/ds/icons/search.svg" alt=""></span>'}${inside?pill(''):''}</div>${beside?pill('ai-pill--outline'):''}</div></div>`;
      h=h.replace(/(<div class="hd-bar">[\s\S]*?<\/div><\/div>)/,'$1'+row);
    }
  }
  h=h.replace(/<\/div>$/,`<div data-usp-banners data-usp-auto="${EXPORTING?0:5}"></div></div>`);
  return `<div id="hdrwrap">${h}${S.search?autocomplete():''}</div>`;
}

/* ================= AUTOCOMPLETE — live = terms + Top Sellers (captured 12 Oct); agent suggestions per option ================= */
function autocomplete(){
  const terms=['dress','<b>wedding</b> dress','<b>wedding guest</b> dresses','dress<b>ing table</b>','<b>coast</b> dresses'];
  const T=`<ul class="ac-terms">${terms.map(t=>`<li>${t}</li>`).join('')}</ul>`;
  const AI=ON('autocomplete')?`<div class="ac-ai" ${F('autocomplete',L('autocomplete',S.acMode)+' · '+{replace:'replaces terms',above:'above terms',below:'below terms'}[S.acMode])}><span class="lbl">${spk(16)}Suggestions</span><div class="set">${S.acChips.filter(Boolean).map(c=>`<button class="ai-pill ai-pill--soft ai-pill--wrap" data-q="${esc(c)}">${spk(14,false)}${esc(c)}</button>`).join('')}<button class="ai-pill ai-pill--soft ai-pill--wrap ai-open" data-q="Help me discover dresses">${spk(14)}Help me discover</button></div></div>`:'';
  const top=[1,21,5,24,31].map(i=>card(PR()[i],i,true)).join('');
  let blk;
  if(!ON('autocomplete'))blk=T;
  else if(S.acMode==='replace')blk=AI;
  else if(S.acMode==='above')blk=AI+'<div class="ac-hr"></div>'+T;
  else blk=T+'<div class="ac-hr"></div>'+AI;
  return `<div class="ac">${blk}<div class="ac-hr"></div><h4>Top Sellers</h4><div class="ac-rail">${top}</div></div>`;
}

/* ================= product card (DS .pc) ================= */
function card(p,i,mini){
  if(!p)return '';const sale=p.was?' sale':'';
  const ss=!mini&&ON('shopSimilar')&&S.ssPos==='card'?`<span class="onimg br"><button class="ai-pill ai-pill--soft" ${F('shopSimilar','C · PLP card')} data-q="Shop similar" data-ctx="${esc(p.name)}">${spk(14,false)}Similar</button></span>`:'';
  return `<article class="pc pc--compact"><div class="pc-img"><img class="ph" src="${IMG(i)}" alt="" loading="lazy">
    ${mini?'':`<div class="pc-actions"><button class="pc-iconbtn pc-iconbtn--sq" aria-label="Add to wishlist"><img src="assets/ds/icons/heart-16.svg" alt=""></button></div>`}${ss}</div>
    <div class="pc-info"><div class="pc-toprow"><div class="pc-titles">${p.brand?`<div class="pc-brand">${esc(p.brand)}</div>`:''}<div class="pc-name">${esc(p.name)}</div></div></div>
    <div class="pc-price${sale}"><span class="now">${esc(p.price)}</span>${p.was?`<span class="was">${esc(p.was)}</span>`:''}${p.pct?`<span class="pct">${esc(p.pct)}</span>`:''}</div></div></article>`;
}

/* ================= HOME — Debenhams live homepage (usp-banner/home.js, captured 06 Oct) + custom prompts ================= */
function home(){
  const d=desk(),doc=new DOMParser().parseFromString(renderHome('debenhams',d),'text/html'),hm=doc.querySelector('.hm'),mods=[...hm.children];
  if(ON('custom')){
    const chips=['Gifts for her under £50','Stocking fillers she’ll love','What do I get my dad?'];
    const set=chips.map(c=>`<button class="ai-pill ai-pill--soft ai-pill--wrap" data-q="${esc(c)}">${spk(14,false)}${esc(c)}</button>`).join('')+`<button class="ai-pill ai-pill--soft ai-pill--wrap ai-open" data-q="Help me find the perfect gift">${spk(14)}Help me choose</button>`;
    if(S.cpPos==='module'){const m=doc.createElement('div');m.innerHTML=`<div class="cp-mod" ${F('custom','A · module')}><div class="pan"><h3>Gifting, sorted</h3><div class="sub">Ask ${esc(E().name)} for ideas</div><div class="set">${set}</div></div><img src="projects/usp-banner/img/home/debenhams/wk38-debs-gifting-hp-homepage-aw-gifting-${d?'dt':'mb'}.webp" alt=""></div>`;mods[1]&&mods[1].after(m.firstChild)}
    if(S.cpPos==='strip'){const m=doc.createElement('div');m.innerHTML=`<div class="cp-strip" ${F('custom','B · strip')}><span>Gift shopping for someone special?</span><button data-q="Help me find the perfect gift">${spk(15)}Ask ${esc(E().name)} for ideas</button></div>`;hm.prepend(m.firstChild)}
    if(S.cpPos==='hero'&&mods[1]){mods[1].classList.add('cp-hero');const o=doc.createElement('div');o.className='ov';o.setAttribute('data-feat','custom');o.setAttribute('data-tag','Custom prompts · C · on hero');o.innerHTML=set;mods[1].prepend(o)}
  }
  return hm.outerHTML;
}

/* ================= PLP — search results / category, DS sort & filter + cards, next best action ================= */
function plp(){
  const d=desk(),ids=[1,5,21,23,24,27,29,31,0,6,2,3,8,9,11,4];
  const nba=ON('nba')?`<div class="nba" ${F('nba',L('nba',S.nbaPos)+' · '+{top:'above results',grid:'in grid',filter:'under filters'}[S.nbaPos])}><h3>${esc(S.nbaQ)}</h3><p>Select an option to start a chat with ${esc(E().name)}</p><div class="set">${S.nbaOpts.filter(Boolean).map(o=>`<button class="ai-pill ai-pill--soft ai-pill--wrap" data-q="${esc('Dresses for: '+o)}">${spk(14,false)}${esc(o)}</button>`).join('')}<span class="sep"></span><button class="ai-pill ai-pill--soft ai-pill--wrap ai-open" data-q="Help me decide what to wear">${spk(14)}Help me decide</button></div></div>`:'';
  const cards=ids.map(i=>card(PR()[i],i));
  if(nba&&S.nbaPos==='grid')cards.splice(d?4:2,0,nba);
  const bar=d?strip(V('sort-filter',0)):V('sort-filter',2).replace(/<div style="width:360px">([\s\S]*)<\/div>$/,'$1');
  return `<div class="wrap"><div class="plp-top">${strip(V('breadcrumb',0)).replace('New In</a>','Womens</a>').replace('Womens New In','Womens Clothing').replace('New In Dresses','Dresses')}
    <div class="h1">Womens Dresses <span style="font-weight:300;font-size:14px;color:#666">2,481 items</span></div>
    <div class="pcats">${V('category-nav',1).replace(/Dresses|Tops|Jeans|Knitwear/g,m=>({Dresses:'Midi Dresses',Tops:'Maxi Dresses',Jeans:'Party Dresses',Knitwear:'Wedding Guest'}[m]))}</div>
    ${nba&&S.nbaPos==='top'?nba:''}${bar}${nba&&S.nbaPos==='filter'?nba:''}</div>
    <div class="grid" style="margin-top:16px">${cards.join('')}</div></div>`;
}

/* ================= PDP — Debenhams live order (12 Oct): gallery · brand / name · price · colour · size · ADD TO BAG · Deliver+ · delivery · BNPL · At a glance · accordions ================= */
function pdp(){
  const d=desk(),p=PR()[1];
  const glance=`<div class="glance-blk"><h3>At a Glance</h3>${V('at-a-glance',0).replace(/<li><i>✓<\/i>Regular fit<\/li><li><i>✓<\/i>Machine washable<\/li><li><i>✓<\/i>Recycled polyester<\/li>/,['Delicate lace bodice','Pleated midi skirt','Shirt collar and button front','Long sleeves','Regular fit'].map(t=>`<li><i>✓</i>${t}</li>`).join(''))}</div>`;
  const prompts=ON('pdpPrompts')?`<div class="gap-wrap" ${F('pdpPrompts',L('pdpPrompts',S.pdpPos)+' · '+{glance:'replaces At a Glance',aboveCta:'above CTA',belowCta:'below CTA'}[S.pdpPos]+' · '+S.pdpDir)}>
    ${S.pdpHead?`<div class="gap-head">${spk(18)}${ask()}</div>`:''}
    <div class="prompts-container" data-dir="${S.pdpDir}" data-product-id="GZZ66300">${S.pdpPrompts.filter(Boolean).map(t=>`<div class="prompt-item"><button class="prompt-link ai-pill ai-pill--soft ai-pill--wrap" data-q="${esc(t)}" aria-label="${esc(t)}"><span class="prompt-link__icon">${spk(16,false)}</span><span class="prompt-link__text">${esc(t)}</span></button></div>`).join('')}
    ${S.pdpAsk?`<div class="prompt-item"><button class="prompt-link ai-pill ai-pill--soft ai-pill--wrap ai-open" data-q=""><span class="prompt-link__icon">${spk(16)}</span><span class="prompt-link__text">Ask anything</span></button></div>`:''}</div></div>`:'';
  const ssBtn=ON('shopSimilar')?`<button class="ai-pill ai-pill--soft" ${F('shopSimilar','A · on image')} data-q="Shop similar">${spk(16)}Shop similar</button>`:'';
  const vtoBtn=ON('vto')?`<button class="ai-pill ai-pill--soft" ${F('vto','A · on image')} data-q="Try it on" data-vto="1">${spk(16)}${esc(S.vtoLabel)}</button>`:'';
  /* one product shot in the data set: four crops of it stand in for the live four-image gallery */
  const SH=['','object-position:50% 12%;transform:scale(1.7);transform-origin:50% 18%','object-position:50% 50%;transform:scale(1.35)','object-position:50% 95%;transform:scale(1.6);transform-origin:50% 92%'];
  const ai=[S.vtoPos==='image'&&vtoBtn,S.ssPos==='image'&&ssBtn].filter(Boolean).join('');
  const gal=`<div class="galwrap"><div class="thumbs">${SH.map((st,i)=>`<button class="${i?'':'on'}" data-slide="${i}" aria-label="Image ${i+1}"><img src="${IMG(1)}" alt="" style="${st}"></button>`).join('')}</div>
    <div class="galmain"><div class="gal" id="gal">${SH.map((st,i)=>`<div class="slide"><img src="${IMG(1)}" alt="${esc(p.name)} — image ${i+1}" style="${st}">${!i&&ai?`<span class="onimg">${ai}</span>`:''}</div>`).join('')}</div>
      <button class="arrow l" data-step="-1" aria-label="Previous"><img src="assets/ds/icons/lib/icons-left.svg" alt=""></button><button class="arrow r" data-step="1" aria-label="Next"><img src="assets/ds/icons/lib/icons-right.svg" alt=""></button></div>
    <div class="pag"><div class="track"><div class="fill" id="pagfill"></div></div></div></div>`;
  const ctaRow=[S.vtoPos==='cta'&&ON('vto')?`<button class="ai-pill ai-pill--soft ai-cta" ${F('vto','B · under CTA')} data-q="Try it on" data-vto="1">${spk(16)}${esc(S.vtoLabel)}</button>`:'',S.ssPos==='cta'&&ON('shopSimilar')?`<button class="ai-pill ai-pill--soft ai-cta" ${F('shopSimilar','B · under CTA')} data-q="Shop similar">${spk(16)}Shop similar</button>`:''].filter(Boolean);
  const info=`<div class="buy"><div class="prow"><div><div class="pbrand">${esc(p.brand)}</div><div class="pname">${esc(p.name)}</div></div><img src="assets/ds/icons/heart-24.svg" alt="" width="24"></div>
    ${V('ratings',0)}
    ${V('price',0)}
    <div style="font-size:14px">Colour: <b>Hot Pink</b></div><div class="cswatches"><button class="cswatch on"><img src="${IMG(1)}" alt="" style="width:60px;height:89px;object-fit:cover;display:block"></button></div>
    ${V('size-selector',0).replace(' style="width:360px"','').replace(/<button class="sz">One size<\/button>/,'')}
    ${S.pdpPos==='aboveCta'?prompts:''}
    <div class="ctas"><button class="bd pri">Add to Bag</button>${ctaRow.length?`<div class="ctas2">${ctaRow.join('')}</div>`:''}</div>
    ${S.pdpPos==='belowCta'?prompts:''}
    ${strip(V('deliver-plus',d?1:0))}
    <div class="dbox"><div><img src="assets/ds/icons/lib/icons-delivery-fast.svg" alt="" onerror="this.remove()"><span>Sold &amp; Delivered by <u>Debenhams</u></span></div><div><img src="assets/ds/icons/lib/icons-delivery-fast.svg" alt="" onerror="this.remove()"><span>Delivery From £2.99 Or 99p On Orders Over £30</span></div><div><img src="assets/ds/icons/lib/icons-quick-add.svg" alt="" onerror="this.remove()"><span>Eligible for return within 21 days. Plus 14-day extension when you purchase Debenhams Deliver+</span></div></div>
    ${strip(V('bnpl',0))}</div>`;
  const glanceSlot=S.pdpPos==='glance'?prompts:glance;
  const acc=`<div class="acc-set">${['Description','Product Details &amp; Care','Delivery','Returns','Manufacturer'].map((t,k)=>`<div class="acc${k?'':' open'}"><button class="acc-h">${t}<img src="assets/ds/icons/lib/icons-down.svg" alt="" onerror="this.remove()"></button>${k?'':'<div class="acc-b">Long sleeve lace and pleated midi shirt dress in hot pink. Delicate lace bodice, shirt collar, button front and a softly pleated midi skirt. Regular fit.</div>'}</div>`).join('')}</div>`;
  const under=`<div class="under">${glanceSlot}${acc}</div>`;
  return d?`<div class="wrap">${strip(V('breadcrumb',0)).replace('New In</a>','Womens</a>').replace('Womens New In','Dresses').replace('New In Dresses','Midi Dresses')}<div class="pdp"><div>${gal}${under}</div>${info}</div></div>`
          :`<div class="wrap"><div class="pdp">${gal}${info}${under}</div></div>`;
}

/* ================= CHAT WINDOW — rendered from the built config ================= */
function applyVars(el,obj){for(const k in obj){if(k==='mobile'||typeof obj[k]!=='string')continue;el.style.setProperty(k,obj[k])}}
function md(s){return esc(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="#" data-href="$2">$1</a>')}
function chat(){
  if(!CHAT.open||!CFG)return '';
  const p=CFG.payload,st=p.settings,mob=innerWidth<768,c=p.components,zs=c.zeroState.payload,icon=E().icon==='spark'?spk(28):`<img class="ic" src="${A}img/chat-icon.jpg" alt="">`;
  const head=[c.text&&{o:c.text.order,h:`<div class="cm-text" data-c="text">${md(c.text.payload.text)}</div>`},
    c.hero&&{o:c.hero.order,h:`<div class="cm-hero"><img src="${A}img/${mob?'hero-mobile':'hero'}.jpg" alt=""></div>`},
    {o:c.zeroState.order,h:`<div class="cm-zero" data-c="zero">${zs.text.replace(/<(?!br\s*\/?>)/g,'&lt;')}<div class="pr">${zs.prompts.map(t=>`<button data-q="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>`}].filter(Boolean).sort((a,b)=>a.o-b.o).map(x=>x.h).join('');
  const msgs=CHAT.msgs.map(m=>m.u?`<div class="cm-u">${esc(m.u)}</div>`:m.typing?`<div class="cm-dots"><i></i><i></i><i></i></div>`:`<div class="cm-b">${m.b}</div>`).join('');
  return `${mob?'':'<div class="cm-scrim" data-close="1"></div>'}<div class="cm${mob?' mob':''}" id="cm" role="dialog" aria-label="${esc(st['chat-title'])}">
    <div class="cm-tb">${E().icon==='spark'?`<span class="ic">${icon}</span>`:icon}<span class="t">${esc(st['chat-title'])}</span><span class="acts"><button data-reset="1" aria-label="Reset"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4a8 8 0 1 0 8 8"/><path d="M12 1v6l3-3z" fill="currentColor"/></svg></button><button data-close="1" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span></div>
    <div class="cm-body">${head}${msgs?`<div class="cm-msgs">${msgs}</div>`:''}</div>
    <div class="cm-in"><div class="cm-box"><span class="plus">+</span><span class="ph">${esc(st['placeholder-text'])}</span><span class="send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div></div>
    <div class="cm-disc">${esc(st['disclosure-text'])}</div></div>`;
}
function styleChat(){const el=document.getElementById('cm');if(!el)return;const sy=CFG.payload.style,mob=innerWidth<768;applyVars(el,sy);if(mob)applyVars(el,sy.mobile||{});
  const pad=(mob?sy.mobile['--chat-messenger-internal-chat-padding']:sy['--chat-messenger-internal-chat-padding'])||'0 48px';el.style.setProperty('--chat-messenger-internal-chat-padding-x',pad.split(' ')[1]||'48px');
  const z=el.querySelector('[data-c="zero"]');if(z)applyVars(z,CFG.payload.components.zeroState.payload.styles);
  const t=el.querySelector('[data-c="text"]');if(t&&CFG.payload.components.text)applyVars(t,CFG.payload.components.text.payload.styles)}

/* mock replies — the live agent writes these; the tiles follow rich-content-config.tileConfig */
function tile(i){const p=PR()[i];return `<div class="cm-tile"><img src="${IMG(i)}" alt=""><div class="n">${esc(p.name)}</div><div class="p"><b class="${p.was?'sale':''}">${esc(p.price)}</b>${p.was?`<s>${esc(p.was)}</s><em>${esc(p.pct)}</em>`:''}</div><button class="cm-cart">${esc(CFG.payload.settings['cart-button-text'])}</button></div>`}
function reply(q,vto){
  const mk='<br><span class="mock">Mock reply — the agent writes this</span>';
  if(vto)return `Let’s see how the <b>Coast Lace and Pleated Midi Shirt Dress</b> looks on you. Upload a full-length photo and I’ll show it on you in a few seconds.<div class="cm-up">${spk(28)}<div><b>Upload a photo</b>Your photo is only used for this try-on.</div></div>${mk}`;
  if(/similar/i.test(q))return `Here are styles similar to the <b>Coast Lace and Pleated Midi Shirt Dress</b> — lace, pleats and midi lengths in a similar price range.<div class="cm-car">${[21,31,27,5].map(tile).join('')}</div>${mk}`;
  if(/fit|size/i.test(q))return `This dress is a <b>regular fit</b> and most customers say it’s true to size. If you’re between sizes, size up for room through the shoulders. What size do you usually wear?${mk}`;
  return `Here are a few I think you’ll love. Tell me your size, budget or occasion and I’ll narrow it down.<div class="cm-car">${[1,21,24,29].map(tile).join('')}</div>${mk}`;
}
function openChat(q,vto){CHAT.open=true;
  if(q){CHAT.msgs.push({u:q},{typing:true});setTimeout(()=>{CHAT.msgs=CHAT.msgs.filter(m=>!m.typing);CHAT.msgs.push({b:reply(q,vto)});drawChat()},EXPORTING?0:900)}
  drawChat();parent.postMessage({protoChat:true},'*')}
/* DRAWN = the window is on screen: the open animation runs only on the closed → open step, not when a reply or a page re-render redraws it */
let DRAWN=false;
function closeChat(){const cm=document.getElementById('cm');
  const done=()=>{CHAT.open=false;CHAT.closing=false;drawChat();parent.postMessage({protoChat:false},'*')};
  if(!cm||EXPORTING||matchMedia('(prefers-reduced-motion:reduce)').matches)return done();
  if(CHAT.closing)return;CHAT.closing=true;
  document.querySelectorAll('#chat .cm,#chat .cm-scrim').forEach(el=>{el.classList.remove('in');el.classList.add('out')});setTimeout(done,260)}
function drawChat(){document.getElementById('chat').innerHTML=chat();styleChat();
  const open=!!document.getElementById('cm');
  if(open&&!DRAWN&&!EXPORTING)document.querySelectorAll('#chat .cm,#chat .cm-scrim').forEach(el=>el.classList.add('in'));
  DRAWN=open}

/* ================= render ================= */
const PAGES={home,plp,pdp};
function render(){
  document.documentElement.setAttribute('data-brand','debenhams');
  document.body.classList.toggle('exporting',EXPORTING);
  if(window.HOME_CSS&&!document.getElementById('homecss')){const st=document.createElement('style');st.id='homecss';st.textContent=HOME_CSS;document.head.appendChild(st)}
  if(CFG){const r=document.documentElement.style,e=E();r.setProperty('--ai-primary',e.primary);r.setProperty('--ai-chip-bg',e.chipBg);r.setProperty('--ai-chip-border',e.chipBorder);r.setProperty('--ai-chip-radius',e.chipRadius+'px')}
  gid=0;
  document.getElementById('app').innerHTML=`${header()}<div id="body">${(PAGES[S.page]||pdp)()}</div><div class="pgfoot">${strip(V('footer',0))}</div><div id="chat"></div>`;
  if(window.DG_uspMount)DG_uspMount();
  galSync();
  if(S.chat&&!CHAT.open)CHAT.open=true;if(!S.chat&&CHAT.open&&!CHAT.user)CHAT.open=false;
  drawChat();
  if(S.focus&&S.focus.n!==render._n){render._n=S.focus.n;const el=document.querySelector(`[data-feat="${S.focus.f}"]`);if(el){el.scrollIntoView({block:'center',behavior:EXPORTING?'auto':'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
}
fetch('projects/shopping-agent/base-config.json').then(r=>r.json()).then(b=>{BASE=b;CFG=AG.build(BASE,S.agent);render();parent.postMessage({protoReady:1},'*')});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});
addEventListener('message',e=>{const d=e.data||{};
  if(d.protoSet){S=Object.assign(S,d.protoSet);EXPORTING=!!d.exporting;if(BASE)CFG=AG.build(BASE,S.agent);if(BASE)render()}
  if(d.protoPing)parent.postMessage({protoPong:1,h:document.documentElement.scrollHeight},'*')});
/* gallery: progress bar follows the rail; thumbs + arrows step it (desktop) */
function galIdx(){const g=document.getElementById('gal');if(!g)return 0;const s=g.querySelector('.slide');const w=s.offsetWidth+(parseFloat(getComputedStyle(g).columnGap)||0);return Math.min(Math.round(g.scrollLeft/w),g.children.length-1)}
function galSync(){const g=document.getElementById('gal'),f=document.getElementById('pagfill');if(!g||!f)return;const i=galIdx(),n=g.children.length;f.style.width=((i+1)/n*100)+'%';document.querySelectorAll('.thumbs button').forEach((b,k)=>b.classList.toggle('on',k===i))}
function galGo(i){const g=document.getElementById('gal');if(!g)return;const n=g.children.length,k=Math.max(0,Math.min(i,n-1));g.scrollTo({left:g.children[k].offsetLeft-g.children[0].offsetLeft,behavior:EXPORTING?'auto':'smooth'})}
document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='gal')requestAnimationFrame(galSync)},true);
document.addEventListener('click',e=>{const t=e.target.closest('[data-slide]');if(t){e.stopPropagation();galGo(+t.dataset.slide);return}const a=e.target.closest('[data-step]');if(a){e.stopPropagation();galGo(galIdx()+(+a.dataset.step))}},true);
/* every agent entry point opens the chat with its query (window.googleAgent.sendQuery(q) in production) */
document.addEventListener('click',e=>{
  const qb=e.target.closest('[data-q]');
  if(qb){e.preventDefault();CHAT.user=true;const q=qb.dataset.q;openChat(q?(qb.dataset.ctx&&/similar/i.test(q)?q:q):'',!!qb.dataset.vto);return}
  if(e.target.closest('[data-close]')){CHAT.user=false;CHAT.msgs=[];closeChat();return}
  if(e.target.closest('[data-reset]')){CHAT.msgs=[];drawChat();return}
  const a=e.target.closest('a[data-href],a[href]');
  if(a){e.preventDefault();const t=document.getElementById('ct');t.textContent='Link → '+(a.dataset.href||a.getAttribute('href'));t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
  else if(e.target.closest('button'))e.preventDefault()});
</script>
</body>
