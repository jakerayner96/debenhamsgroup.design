<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../../">
<title>Product carousel · in situ</title>
</head>
<body>
<script>
/* In situ: this page IS the Shopping agent page (projects/shopping-agent/page.html — the latest home, PDP and search), opened as it stands,
   plus three files: insitu-pre.js (state), ds-next.css (the proposed DS changes) and insitu.js (swaps its product rails for the DS
   Product carousel and adds the mini bag). So every in-situ screen stays as current as the Shopping agent prototype. */
(function(){
  fetch('projects/shopping-agent/page.html',{cache:'no-cache'}).then(function(r){return r.text()}).then(function(h){
    h=h.replace('<base href="../../">','<base href="../../"><script src="projects/product-carousel/insitu-pre.js"><\/script>')
       .replace('</head>','<link rel="stylesheet" href="projects/product-carousel/ds-next.css"></head>')
       .replace(/<\/body>(?![\s\S]*<\/body>)/,'<script src="assets/ds/carousel.js"><\/script><script src="projects/product-carousel/insitu.js"><\/script></body>');
    document.open();document.write(h);document.close();
  });
})();
</script>
</body>
</html>
