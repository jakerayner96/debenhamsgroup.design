<!DOCTYPE html>
<html lang="en" data-brand="debenhams">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<title>PDP · DS template</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Jost:wght@400;500;600&family=Archivo:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ds/tokens.css">
<link rel="stylesheet" href="assets/ds/components.css">
<style>
/* DS page template — PDP. THE MASTER PDP: the Shopping agent PDP (projects/shopping-agent, banked 16 Oct 2026) rebuilt on DS components only.
   Order — mobile: header · USP banners · gallery (product tags bottom right) · AI tag chip (Virtual Stylist, centred; desktop: under the gallery — Shop Similar is Google, not launched, kept in the DS only) ·
   PDP title · ratings · price · option label + colour swatches · size selector · PDP buy buttons (Add to bag → PayPal → Apple Pay, always) ·
   Ask Deb / Google PDP prompts (ai-prompts.js) · membership box (Unlimited) · Deliver+ · delivery grid (delivery.js; See more → Delivery
   Options modal; returns line, then Sold & Delivered by — placeholder until a size is picked) · BNPL · Subscribe & Save (subscribe.js; ADD → modal) — that order, Jake 16 Oct · then the accordion set
   (At a Glance open · Description · Product Details & Care · Delivery · Returns · Manufacturer) · footer.
   Desktop: breadcrumb, then gallery + accordions on the left, the buy column on the right.
   AI Generated strip (26 Oct 2026): S.ai = indexes of the AI gallery images → DS .ai-wrap + .badge-ai on those slides, product tags lift (never on thumbnails).
   New PDP features land HERE so every next PDP gets them. Any fascia: ?brand=<slug>. Drop components in via the data-slot hooks. */
*{box-sizing:border-box}html,body{margin:0;background:var(--surface-page)}
body{font-family:var(--font-family-base);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.pg{padding:0 var(--gap-4)}
.pdp{display:flex;flex-direction:column;gap:var(--gap-4)}
.pdp .gal{margin:0 calc(var(--gap-4)*-1)}
.buy{display:flex;flex-direction:column;gap:var(--gap-4)}
.buy .bd{width:100%}
.under{display:flex;flex-direction:column;gap:var(--gap-6);margin:var(--gap-2) 0 var(--gap-8)}
@media(min-width:1024px){
  .pg{padding:0 var(--gap-12);max-width:1440px;margin:0 auto}
  .pdp{display:grid;grid-template-columns:minmax(0,1fr) 446px;gap:var(--gap-16);align-items:start}
  .pdp .gal{margin:0}
  .under{margin-top:var(--gap-6)}
  .vs{margin-top:var(--gap-6)}
  .buy{gap:var(--gap-5)}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/ds/header.js"></script>
<script src="assets/ds/usp-live.js"></script>
<script src="assets/ds/usp.js"></script>
<script src="assets/ds/footer.js"></script>
<script src="assets/ds/membership.js"></script>
<script src="assets/ds/delivery.js"></script>
<script src="assets/ds/ai-prompts.js"></script>
<script src="assets/ds/subscribe.js"></script>
<script src="assets/ds/dplus-logos.js"></script>
<script src="assets/ds/catalogue.js"></script>
<script src="templates/products.js"></script>
<script>
/* in: ?brand=<slug> or ?s={"brand":…}; {protoSet} / {protoPing} as the review shell expects. out: {protoReady}, {protoPong,h}. */
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const q=new URLSearchParams(location.search);
let S={brand:q.get('brand')||'debenhams'},EXPORTING=false;
try{const s=q.get('s');if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
const desk=()=>innerWidth>=1024;
const IC='assets/ds/icons/',LIB=IC+'lib/';
const WISH={boohooman:'bookmark',karenmillen:'bookmark',brandroom:'bookmark',plt:'plt-heart'};
const wishIcon=b=>IC+(WISH[b]||'heart-24')+'.svg';
/* delivery grid as live (DS delivery.js): fastest first, cheapest last, James's two-click-&-collect rule, badges, returns line */
/* seller line: grey placeholder until a size is picked, then sold by the fascia ('site'; a marketplace key, e.g. 'amass', makes it a link → seller modal) */
let SELLER=null;
const DG_OPTS=()=>({layout:'list',scen:'std',pr:true,prBadge:'fastest',badges:true,ni:'split',sort:'price',cut:'midnight',modal:'toggle',ret:true,retDays:21,desk:desk(),sheet:'up',brand:S.brand,seller:SELLER});
/* Subscribe & Save: the product at 5% off, size = the first size until one is picked; centred modal from 600px, bottom sheet on phones */
const SNS=P=>({brand:P.brand,name:P.name,price:P.price,img:P.imgs[0],size:(document.querySelector('.sz.on')||{}).textContent||P.sizes[0],colour:P.colour,pct:5});
const DPLUS=['debenhams','boohoo','boohooman','plt','karenmillen','warehouse'];   /* every fascia but The Brand Room runs Deliver+ (bag-summary.js BAG_LIVE) */

function header(){const dev=desk()?'desktop':'mobile';
  return `<header class="hd${desk()?' hd--desktop':''}" data-hd-brand="${S.brand}" data-hd-kind="main" data-hd-device="${dev}">${window.DG_headerHTML?DG_headerHTML(S.brand,'main',dev):''}</header><div data-usp-banners data-usp-auto="${EXPORTING?0:5}"></div>`}
/* AI generated imagery (EU AI Act Art. 50(4), 26 Oct 2026): S.ai (or a product's own p.ai) = indexes of the AI images. Each gets the DS strip on its slide
   (.ai-wrap + .badge-ai, live text S.aiCopy, default "AI Generated"), its alt text appends S.aiAlt (default "AI generated image") and the product tags lift (.main.has-ai). Never on thumbnails. */
const AIS=p=>S.ai||p.ai||[];
function slide(p,s,i){const alt=`${esc(p.name)}, view ${i+1}`;
  return AIS(p).includes(i)?`<span class="ai-wrap"><img src="${s}" alt="${alt} · ${S.aiAlt||'AI generated image'}"><span class="badge-ai">${S.aiCopy||'<b>AI</b> Generated'}</span></span>`:`<img src="${s}" alt="${alt}">`}
function gallery(p,top=''){
  return `<div class="pdp-gal" data-slot="gallery">
    <div class="thumbs">${p.imgs.map((s,i)=>`<button class="${i?'':'on'}" data-i="${i}" aria-label="Image ${i+1}"><img src="${s}" alt=""></button>`).join('')}</div>
    <div class="main${AIS(p).length?' has-ai':''}">${top}${(p.tags||(p.tag?[p.tag]:[])).length?`<span class="ptags">${(p.tags||[p.tag]).map(x=>`<span>${esc(x)}</span>`).join('')}</span>`:''}
      <div class="slides">${p.imgs.map((s,i)=>slide(p,s,i)).join('')}</div>
      <button class="nav prev" aria-label="Previous image"><img src="${LIB}icons-left.svg" alt=""></button><button class="nav next" aria-label="Next image"><img src="${LIB}icons-right.svg" alt=""></button></div>
    <div class="pag"><i style="width:${Math.round(100/p.imgs.length)}%"></i></div></div>`}
function price(p){return `<div class="price-blk price-blk--pdp"><div class="price"><span class="now${p.was?' sale':''}">${esc(p.price)}</span>${p.was?`<span class="was">${esc(p.was)}</span>${p.save?`<span class="save">${esc(p.save)}</span>`:''}`:''}</div>${p.code?`<div class="price-code">${esc(p.code)}</div>`:''}</div>`}
const C=window.DG_CATALOGUE||[],V=(slug,i=0)=>{const c=C.find(x=>x.slug===slug);return c&&c.variants[i]?c.variants[i].html:''};
const strip=h=>h.replace(/ style="width:[^"]*"/,'');
const num=s=>parseFloat(String(s).replace(/[^0-9.]/g,''))||0;
function accSet(P){const rows=[['At a Glance',P.glance?`<ul class="glance glance--chips">${P.glance.map(g=>`<li><i>✓</i>${esc(g)}</li>`).join('')}</ul>`:'',true],
    ['Description',`${esc(P.name)}.${P.glance?' '+esc(P.glance.join('. '))+'.':''}`],
    ['Product Details &amp; Care','Fabric and care from the product feed.'],
    ['Delivery','Every way to get this item, and its price, is in Delivery Methods above.'],
    ['Returns','Eligible for return within 21 days. Exclusions apply.'],
    ['Manufacturer',`${esc(P.brand)}, Debenhams Group, Manchester M1 2DU.`]].filter(r=>r[1]);
  return `<div class="acc-set" data-slot="info">${rows.map(([h,b,o])=>`<div class="acc${o?' open':''}"><button class="acc-h">${h}<img src="${LIB}icons-down.svg" alt="" onerror="this.remove()"></button><div class="acc-b">${b}</div></div>`).join('')}</div>`}
function page(){const P=(window.DG_PDP_PRODUCTS||{})[S.brand]||DG_PDP_PRODUCTS.debenhams,d=desk();
  const crumbs=P.crumbs.map((c,i)=>i<P.crumbs.length-1?`<a href="#">${esc(c)}</a><span class="sep">/</span>`:`<span class="cur">${esc(c)}</span>`).join('');
  const bnpl=strip(V('bnpl',0)).replace(/£23\.33/,'£'+(num(P.price)/3).toFixed(2));
  const dplus=DPLUS.includes(S.brand)?strip(V('deliver-plus',d?1:0)):'';
  /* Virtual Stylist (hanger), centred: between the gallery and the title on mobile, under the gallery on desktop (Jake 22 Oct 2026, from live KM).
     Shop Similar is a Google feature not launched yet: it stays in the DS (catalogue AI tag chip) but is off the default PDP. */
  const chips=`<div class="pdp-chips pdp-chips--center" data-slot="ai-chips"><button class="ai-pill ai-pill--soft ai-pill--tag"><img class="ic" src="${LIB}icons-hanger.svg" alt="">Virtual Stylist</button></div>`;
  const under=`<div class="under" data-slot="below">${accSet(P)}</div>`;
  const buy=`<div class="buy" data-slot="buy">
      ${d?'':chips}
      <div class="pdp-head"><div class="titles"><span class="brand">${esc(P.brand)}</span><h1 class="name">${esc(P.name)}</h1></div><button class="wish" aria-label="Add to wishlist"><img src="${wishIcon(S.brand)}" alt=""></button></div>
      ${V('ratings',0).replace(/ style="[^"]*"/,'')}
      ${price(P)}
      <div class="opt-label">Colour: <b>${esc(P.colour)}</b></div>
      <div class="cswatches"><button class="cswatch on" aria-label="${esc(P.colour)}"><img src="${P.imgs[0]}" alt=""></button></div>
      <div class="sizes"><div class="sizes-head"><span>Size: <b>Select a size</b></span><span class="guide">Size guide</span></div><div class="set">${P.sizes.map(z=>`<button class="sz">${esc(z)}</button>`).join('')}</div></div>
      <div class="pdp-ctas" data-slot="ctas"><button class="bd pri">Add to bag</button><button class="pay pay--paypal"><img src="assets/ds/icons/payments/paypal-wordmark.svg" alt="PayPal"><span class="pp-co">Checkout</span></button><button class="pay pay--apple"><img src="assets/ds/icons/payments/applepay-onblack.svg" alt="Apple Pay"></button></div>
      ${window.DG_aiPromptsHTML?DG_aiPromptsHTML(S.brand,{sku:P.sku||''}):''}
      ${window.DG_memberBoxHTML?DG_memberBoxHTML(S.brand):''}
      ${dplus}
      ${window.DG_delivery?DG_delivery.grid(DG_OPTS()):''}
      ${bnpl}
      ${window.DG_subscribe?DG_subscribe.box(SNS(P)):''}
    </div>`;
  return `${header()}<main class="pg">
  ${d?`<nav class="bc" aria-label="Breadcrumb">${crumbs}</nav>`:''}
  <div class="pdp">${d?`<div><div class="gal">${gallery(P)}</div><div class="vs">${chips}</div>${under}</div>${buy}`:`<div class="gal">${gallery(P)}</div>${buy}${under}`}</div>
  </main><footer data-ftr="${S.brand}"></footer>`}
function wire(){
  const g=document.querySelector('.pdp-gal');if(!g)return;const sl=g.querySelector('.slides'),th=[...g.querySelectorAll('.thumbs button')],bar=g.querySelector('.pag i');
  const go=i=>{const im=sl.children[i];if(im)sl.scrollTo({left:im.offsetLeft-sl.offsetLeft,behavior:'smooth'})};
  th.forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const cur=()=>Math.round(sl.scrollLeft/(sl.children[0].offsetWidth+4));
  g.querySelector('.prev').onclick=()=>go(Math.max(0,cur()-1));g.querySelector('.next').onclick=()=>go(Math.min(sl.children.length-1,cur()+1));
  sl.addEventListener('scroll',()=>{const i=cur(),n=sl.children.length,max=sl.scrollWidth-sl.clientWidth;th.forEach((b,j)=>b.classList.toggle('on',j===i));
    if(bar)bar.style.left=Math.round((max?sl.scrollLeft/max:0)*(100-100/n))+'%'},{passive:true});
  if(window.DG_delivery)DG_delivery.mount(document,DG_OPTS());
  if(window.DG_subscribe){const P=(window.DG_PDP_PRODUCTS||{})[S.brand]||DG_PDP_PRODUCTS.debenhams;document.querySelectorAll('[data-sns-open]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-sns-modal]').forEach(x=>x.remove());document.body.insertAdjacentHTML('beforeend',DG_subscribe.modal(SNS(P),{desk:innerWidth>=600}));DG_subscribe.wire(document.querySelector('[data-sns-modal]'))})}
  document.querySelectorAll('.acc-h').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));
  document.querySelectorAll('.sz').forEach(z=>z.onclick=()=>{document.querySelectorAll('.sz').forEach(x=>x.classList.toggle('on',x===z));const l=document.querySelector('.sizes-head b');if(l)l.textContent=z.textContent;
    if(!SELLER){SELLER='site';if(window.DG_delivery)DG_delivery.setSeller(document,DG_OPTS())}});
  document.addEventListener('click',e=>{if(e.target.closest('a[href="#"]'))e.preventDefault()});
}
function render(){document.documentElement.setAttribute('data-brand',S.brand);document.documentElement.classList.toggle('exporting',EXPORTING);
  document.getElementById('app').innerHTML=page();
  if(window.DG_uspMount)DG_uspMount();
  document.querySelectorAll('[data-ftr]').forEach(el=>window.DG_footer&&DG_footer(el,S.brand));
  wire();document.dispatchEvent(new CustomEvent('dg:render'))}
render();
let rz,lw=innerWidth;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if((lw>=1024)!==desk()){lw=innerWidth;render()}},150)});
addEventListener('message',e=>{const d=e.data||{};
  if(d.protoSet){S=Object.assign(S,d.protoSet);EXPORTING=!!d.exporting;render()}
  if(d.protoPing)parent.postMessage({protoPong:1,h:document.documentElement.scrollHeight},'*')});
addEventListener('load',()=>parent.postMessage({protoReady:1},'*'));
</script>
</body>
</html>
